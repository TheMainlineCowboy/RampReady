<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RampReady A1 — Animated Ground Crew Preview</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b2634;font:14px system-ui;color:white}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;background:#131923e8;padding:12px;border-radius:12px;max-width:310px;pointer-events:none}
#hud strong{color:#ffd064}#actions{position:absolute;bottom:15px;right:12px}
button{padding:10px 16px;border:0;border-radius:9px;background:#ffd064;color:#171d24;font-weight:700}
</style></head><body>
<div id="hud"><b>RampReady · A1 crew preview</b><div id="phase">Preparing scene</div><small>Animated Three.js runtime, independent of heavy airport texture loading. This is an isolated preview using the same A1 NPC code; the translucent aircraft is only a position reference.</small></div>
<div id="actions"><button id="reset">Replay ground crew</button> <button id="testStop">Simulate stop</button></div>
<script type="module">
import * as THREE from "three";
import {createA1GroundCrewScene} from "./src/simulation/a1GroundCrewScene.js";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x819db7);
scene.add(new THREE.HemisphereLight(0xffffff,0x42536b,2));
const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(-20,30,-16);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x565e65,roughness:.9}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.04;scene.add(ground);
const stripe=new THREE.Mesh(new THREE.PlaneGeometry(.13,48),new THREE.MeshBasicMaterial({color:0xc0a631}));
stripe.rotation.x=-Math.PI/2;stripe.position.set(0,.003,-2);scene.add(stripe);
const aircraft=new THREE.Group();scene.add(aircraft);
// Thin, translucent fuselage size marker. This is a QA coordinate guide ONLY.
const body=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,27,18),new THREE.MeshStandardMaterial({color:0xdfe5ed,transparent:true,opacity:.28,depthWrite:false}));
body.rotation.x=Math.PI/2;body.position.set(0,2.4,8.3);aircraft.add(body);
const nose=new THREE.Mesh(new THREE.ConeGeometry(.9,3.1,16),new THREE.MeshStandardMaterial({color:0xdfe5ed,transparent:true,opacity:.28,depthWrite:false}));
nose.rotation.x=-Math.PI/2;nose.position.set(0,2.4,-6.75);aircraft.add(nose);
const crew=createA1GroundCrewScene(THREE,{scene,aircraft,realPeople:true});
const camera=new THREE.PerspectiveCamera(57,1,.1,400);
camera.position.set(10.8,6.3,-5.7);camera.lookAt(3.6,1.2,3.5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));document.body.appendChild(renderer.domElement);
const phase=document.getElementById("phase");
const size=()=>{const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();};addEventListener("resize",size);size();
let simulatedStop=false;
document.getElementById("reset").onclick=()=>{simulatedStop=false;crew.reset()};
document.getElementById("testStop").onclick=()=>{simulatedStop=!simulatedStop};
// The exact same Three.js scene powers visual browser review and a deterministic
// screen-capture mode, without video-recorder throttling or synthetic frames.
let last=performance.now();
let captureMode=false;
function stepScene(dt) {
  const state=crew.update(dt,{
    tugPosition:new THREE.Vector3(0,0,simulatedStop?-4.5:-8),
    stage:crew.isClear()?1:0
  });
  phase.innerHTML=`<strong>${state.phase}</strong> · Loader moved ${Math.hypot(state.loaderX-4.3,state.loaderZ-3.6).toFixed(1)} m<br>Guide: ${state.signal} · Approach ${crew.isClear()?"CLEAR":"HOLD"} · Humans ${crew.realHumanStatus}`;
  if(crew.isClear()){
    camera.position.set(-3.7,2.6,-12.3);
    camera.lookAt(-3.7,1.3,-7.1);
  }else{
    camera.position.set(10.8,6.3,-5.7);
    camera.lookAt(3.6,1.2,3.5);
  }
  renderer.domElement.dataset.a1CrewPhase=state.phase;
  renderer.domElement.dataset.a1CrewClear=String(crew.isClear());
  renderer.domElement.dataset.a1HumanStatus=crew.realHumanStatus;
  renderer.domElement.dataset.a1GuideSignal=state.signal;
  renderer.render(scene,camera);
  return state;
}
window.__a1Capture={
  begin(){
    if(crew.realHumanStatus!=="ready")throw Error("Both human GLBs must load before capture");
    captureMode=true;simulatedStop=false;crew.reset();return true;
  },
  next({steps=3,stop=false}={}){
    if(!captureMode)throw Error("Begin the real-scene capture first");
    simulatedStop=stop;
    let state;
    for(let i=0;i<steps;i++)state=stepScene(.05);
    return {
      image:renderer.domElement.toDataURL("image/png").split(",")[1],
      phase:state.phase,clear:crew.isClear(),signal:state.signal,
      elapsed:state.elapsed,humanStatus:crew.realHumanStatus,
    };
  },
  end(){captureMode=false;last=performance.now();}
};
function draw(now){
  const dt=Math.min(.35,Math.max(0,(now-last)/1000));last=now;
  if(!captureMode)stepScene(dt);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
