name: KPHX Verification PNG Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-verification-png-artifact.yml"

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
      - uses: actions/upload-artifact@v4
        with:
          name: kphx-verification-png
          path: reports/kphx-full-airport-first-render.png
          if-no-files-found: error
          compression-level: 0
