name: Receive exact Airport Jetway binary

on:
  push:
    branches:
      - fix/exact-airport-jetway-glb
    paths:
      - 'scripts/receive-exact-jetway-mail-transfer.mjs'
      - '.github/workflows/receive-exact-jetway-binary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  receive-build-render-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JETWAY_TRANSFER_KEY: 959c7c8171d0d1a1f9a6cb2cb6110f50cafac196b1122c25bf6c1b82aaf65927
    steps:
      - name: Check out PR 137 branch
        uses: actions/checkout@v4
        with:
          ref: fix/exact-airport-jetway-glb
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Open encrypted transfer mailbox and receive all exact parts
        run: node scripts/receive-exact-jetway-mail-transfer.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact GLB, seven embedded textures, 58 gates, and A1 controller
        run: |
          node scripts/materialize-exact-airport-jetway.mjs
          node scripts/prepare-uploaded-airport-jetway-fleet.mjs
          node scripts/verify-exact-airport-jetway-runtime.mjs
          node scripts/verify-uploaded-airport-jetway-fleet.mjs
          node scripts/verify-uploaded-airport-jetway-articulation-v10.mjs

      - name: Run complete RampReady verification
        run: npm run verify

      - name: Build exact browser runtime
        run: npm run build

      - name: Install Chromium verifier
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and inspect exact A1 jetway
        run: npx playwright test tests/browser/uploaded-jetway-articulation-v10.spec.js --reporter=line --workers=1

      - name: Upload exact browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-airport-jetway-recovery-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            public/models/airport-jetway/exact-asset-manifest.json
          if-no-files-found: warn
          retention-days: 3

      - name: Commit exact supplied GLB after browser verification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/models/airport-jetway/Airport_Jetway.glb public/models/airport-jetway/exact-asset-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Install exact supplied Airport Jetway GLB [skip transfer]'
          git push origin HEAD:fix/exact-airport-jetway-glb
