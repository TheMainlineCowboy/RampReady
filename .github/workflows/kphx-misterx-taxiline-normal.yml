name: KPHX MisterX Taxiline Normal Map

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-misterx-taxiline-normal.yml"

permissions:
  contents: write

jobs:
  move-one-file:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Download exact Taxilines normal map
        shell: bash
        run: |
          set -euo pipefail
          DIR="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Taxilines/Old"
          mkdir -p "$DIR"
          gdown "https://drive.google.com/uc?id=15rvmDz2GxG_ICJBcFOjwNCHGfYhWY8tH" -O "$DIR/Taxilines_NRM.png"
          sha256sum "$DIR/Taxilines_NRM.png" > "$DIR/Taxilines_NRM.png.sha256"

      - name: Commit exact file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Taxilines/Old/Taxilines_NRM.png             assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Taxilines/Old/Taxilines_NRM.png.sha256
          git commit -m "Move exact MisterX Taxilines normal map"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
