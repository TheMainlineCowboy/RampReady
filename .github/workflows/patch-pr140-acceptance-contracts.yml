name: Verify PR 140 acceptance contracts

on:
  pull_request:
    branches:
      - maintenance/pr140-acceptance-base
    types: [opened, synchronize, reopened]
    paths:
      - .pr140-contract-patch-trigger
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR 140 branch
        uses: actions/checkout@v4
        with:
          ref: fix/a1-rigid-parent-orientation-final
          fetch-depth: 0

      - name: Verify current fail-closed acceptance migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-a1-measured-ground-contact-contract.mjs
          node scripts/verify-a1-evidence-subview-contract.mjs
          grep -Fq 'grounded-jetway-door-gap-reported-no-child-lift-v1' scripts/prepare-current-head-browser-expectations-v1.mjs
          grep -Fq 'exact-authored-a1-lowest-geometry-ramp-contact-v2' scripts/prepare-a1-bogie-centroid-browser-authority-v1.mjs
          grep -Fq 'exact-a1-terminal-joint-and-bogie-contact-subviews-v2' scripts/prepare-a1-evidence-subviews-v1.mjs
          grep -Fq 'articulationAppliedJetwayVerticalFitMeters).toBeCloseTo(0, 5)' scripts/prepare-current-head-browser-expectations-v1.mjs
          grep -Fq 'inspectionCameraEndpointBogieAircraftOppositionCosine' tests/browser/a1-terminal-joint-bogie-subviews.spec.js
          echo 'PR 140 acceptance contract maintenance is verification-only; no workflow may rewrite the PR branch.'
