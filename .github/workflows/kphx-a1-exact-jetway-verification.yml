name: KPHX A1 Exact XP11 Jetway Verification

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-a1-exact-jetway-verification.yml"

permissions:
  contents: read

concurrency:
  group: kphx-a1-exact-xp11-jetway-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            package.json
            package-lock.json
            index.html
            vite.config.js
            src
            public/models/kphx/Terminal4.exact.glb
            public/models/kphx/Terminal4b.exact.glb
            public/models/kphx-xp11-jetways
          sparse-checkout-cone-mode: false

      - name: Verify exact XP11 runtime contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/models/kphx-xp11-jetways/layout.exact.json
          test "$(find public/models/kphx-xp11-jetways/objects -mindepth 1 -maxdepth 1 -type d | wc -l)" = "18"
          test -f public/models/kphx-xp11-jetways/textures/jetway_1_ALB.png
          test -f public/models/kphx-xp11-jetways/textures/jetway_1_LIT.png
          test -f public/models/kphx-xp11-jetways/textures/jetway_1_NML.png

      - name: Install verifier browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start verifier
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/a1-xp11-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/a1-xp11-vite.log
          exit 1

      - name: Capture exact A1 XP11 jetway evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const evidence = {};
          const views = ["oblique", "top", "terminal"];

          for (const view of views) {
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
            const errors = [];
            const failed = [];
            const httpErrors = [];
            page.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });
            page.on("pageerror", (e) => errors.push(String(e)));
            page.on("requestfailed", (r) => failed.push({ url: r.url(), error: r.failure()?.errorText || "unknown" }));
            page.on("response", (r) => { if (r.status() >= 400) httpErrors.push({ url: r.url(), status: r.status() }); });

            await page.goto(
              `http://127.0.0.1:4173/RampReady/?kphxA1Jetway=1&view=${view}`,
              { waitUntil: "domcontentloaded", timeout: 60000 },
            );
            await page.waitForFunction(() => {
              const canvas = document.querySelector("canvas.kphxA1JetwayVerifierCanvas");
              return ["ready", "error"].includes(canvas?.dataset?.kphxA1JetwayVerifier);
            }, null, { timeout: 120000 });

            const state = await page.evaluate(() => {
              const canvas = document.querySelector("canvas.kphxA1JetwayVerifierCanvas");
              return canvas ? { ...canvas.dataset } : {};
            });
            await page.screenshot({
              path: `reports/kphx-a1-xp11-jetway-${view}.png`,
              fullPage: true,
            });
            evidence[view] = { state, errors, failed, httpErrors };
            await page.close();
          }

          fs.writeFileSync(
            "reports/kphx-a1-xp11-jetway-verification.json",
            JSON.stringify(evidence, null, 2) + "\n",
          );
          await browser.close();
          NODE

      - name: Enforce exact A1 XP11 source contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const evidence = JSON.parse(
            fs.readFileSync("reports/kphx-a1-xp11-jetway-verification.json", "utf8"),
          );
          const failures = [];

          for (const [view, result] of Object.entries(evidence)) {
            const d = result.state || {};
            if (d.kphxA1JetwayVerifier !== "ready") failures.push(`${view}:state=${d.kphxA1JetwayVerifier}`);
            if (d.kphxA1FacadeResource !== "lib/airport/Ramp_Equipment/Jetways/Jetway_1_solid.fac") {
              failures.push(`${view}:resource=${d.kphxA1FacadeResource}`);
            }
            if (d.kphxA1WedObjectId !== "104804") failures.push(`${view}:wed=${d.kphxA1WedObjectId}`);
            if (d.kphxA1NodeCount !== "7") failures.push(`${view}:nodes=${d.kphxA1NodeCount}`);
            if (d.kphxA1WallCount !== "6") failures.push(`${view}:walls=${d.kphxA1WallCount}`);
            if (d.kphxA1ObjectInstanceCount !== "16") failures.push(`${view}:objects=${d.kphxA1ObjectInstanceCount}`);
            if (d.kphxJetwaySourcePlacementCount !== "108") failures.push(`${view}:sourceCount=${d.kphxJetwaySourcePlacementCount}`);
            if (d.kphxJetwayReadyStraightPlacementCount !== "107") failures.push(`${view}:readyCount=${d.kphxJetwayReadyStraightPlacementCount}`);
            if (d.kphxJetwayBlockedCurveIds !== "99713") failures.push(`${view}:curveBlock=${d.kphxJetwayBlockedCurveIds}`);
            if (d.kphxLegacyAirportJetwayGlbLoaded !== "false") failures.push(`${view}:legacyGlb=${d.kphxLegacyAirportJetwayGlbLoaded}`);
            if (d.kphxA1WallSequence !== "Wall 1,Wall 1,Wall 1,Wall 1,Wall 5,Wall 4") failures.push(`${view}:wallSequence=${d.kphxA1WallSequence}`);
            if ((result.errors || []).length) failures.push(`${view}:browser=${result.errors.join(" | ")}`);
            if ((result.failed || []).length) failures.push(`${view}:failedRequests=${JSON.stringify(result.failed)}`);
            if ((result.httpErrors || []).length) failures.push(`${view}:httpErrors=${JSON.stringify(result.httpErrors)}`);
          }

          if (failures.length) throw new Error(failures.join("; "));
          console.log(JSON.stringify(evidence.oblique.state, null, 2));
          NODE

      - name: Upload exact A1 XP11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: kphx-a1-exact-xp11-jetway-verification
          path: |
            reports/kphx-a1-xp11-jetway-oblique.png
            reports/kphx-a1-xp11-jetway-top.png
            reports/kphx-a1-xp11-jetway-terminal.png
            reports/kphx-a1-xp11-jetway-verification.json
          if-no-files-found: error
          compression-level: 0
