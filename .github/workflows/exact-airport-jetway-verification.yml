name: Exact Airport Jetway Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.jetway-geometry-staging-v2/**'
      - '.jetway-geometry-staging-v5/**'
      - '.jetway-source-staging/**'
      - 'scripts/materialize-exact-airport-jetway.mjs'
      - 'scripts/probe-exact-jetway-source-chunks.mjs'
      - 'scripts/scan-exact-jetway-history.mjs'
      - 'scripts/verify-exact-airport-jetway-runtime.mjs'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - '.github/workflows/exact-airport-jetway-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exact-airport-jetway:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete pull-request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recover exact uploaded GLB from repository history
        run: node scripts/scan-exact-jetway-history.mjs

      - name: Inspect current original-source chunk stream
        run: node scripts/probe-exact-jetway-source-chunks.mjs

      - name: Reconstruct and verify exact uploaded geometry package
        run: node scripts/materialize-exact-airport-jetway.mjs

      - name: Require exact uploaded GLB and all seven textures
        run: node scripts/verify-exact-airport-jetway-runtime.mjs

      - name: Fail closed on any exact-asset mismatch
        if: failure()
        run: exit 1
