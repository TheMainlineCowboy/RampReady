name: Repair static jetway facade registration

on:
  push:
    branches:
      - fix/live-experience-cdp-capture
    paths:
      - .github/workflows/repair-static-jetway-facade-registration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-static-jetway-facade-registration
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-experience-cdp-capture
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Preserve measured per-gate Rotunda-to-wall registration
        shell: python
        run: |
          from pathlib import Path
          import re

          register_path = Path('src/environment/registerStaticJetwayFleetToFacadeV1.js')
          connector_path = Path('src/environment/uploadedAirportJetwayTerminalConnector.js')
          register = register_path.read_text(encoding='utf-8')
          connector = connector_path.read_text(encoding='utf-8')

          register = register.replace(
              'const AUTHORITY = "57-static-authored-rotundas-photo-registered-to-terminal-facade-v2";',
              'const AUTHORITY = "57-static-authored-rotundas-measured-source-wall-registration-v3";',
          )

          measure_re = re.compile(r'function measureAuthoredRotundaOffsetFromModelRoot\(THREE, a1Anchor\) \{.*?\n\}\n\nfunction buildRegisteredPlacement', re.S)
          measure_new = '''function measureAuthoredRotundaOffsetFromModelRoot(THREE, a1Anchor) {
            const model = a1Anchor?.getObjectByName("UploadedAirportJetwayModel_A1");
            const rotunda = model?.getObjectByName("Rotunda") || model?.getObjectByName("Rotunda_Jetway_0");
            if (!model || !rotunda) {
              throw new Error("Static jetway registration could not measure the exact supplied Rotunda/model-root offset");
            }
            a1Anchor.updateWorldMatrix(true, true);
            model.updateWorldMatrix(true, true);
            rotunda.updateWorldMatrix(true, true);
            const worldBounds = new THREE.Box3().setFromObject(rotunda);
            if (worldBounds.isEmpty()) throw new Error("Exact supplied Rotunda has empty bounds during static registration");
            const worldCenter = worldBounds.getCenter(new THREE.Vector3());
            const worldSize = worldBounds.getSize(new THREE.Vector3());
            const localCenter = a1Anchor.worldToLocal(worldCenter.clone());
            if (![localCenter.x, localCenter.y, localCenter.z].every(Number.isFinite)) {
              throw new Error(`Exact supplied Rotunda/model-root offset is invalid: ${localCenter.toArray().join(",")}`);
            }
            const horizontalMagnitude = Math.hypot(localCenter.x, localCenter.z);
            if (horizontalMagnitude > 12) {
              throw new Error(`Exact supplied Rotunda/model-root horizontal offset is excessive: ${horizontalMagnitude}`);
            }
            const radiusMeters = Math.max(worldSize.x, worldSize.z) * 0.5;
            if (!(radiusMeters > 0.7 && radiusMeters < 3.5)) {
              throw new Error(`Exact supplied Rotunda horizontal radius is invalid: ${radiusMeters}`);
            }
            return Object.freeze({
              x: localCenter.x,
              y: localCenter.y,
              z: localCenter.z,
              horizontalMagnitude,
              radiusMeters,
              authority: ROOT_OFFSET_AUTHORITY,
            });
          }

          function buildRegisteredPlacement'''
          register, count = measure_re.subn(measure_new, register, count=1)
          if count != 1:
              raise SystemExit('Could not replace exact Rotunda measurement function')

          build_re = re.compile(r'function buildRegisteredPlacement\(THREE, placement, authoredRotundaOffset\) \{.*?\n\}\n\nfunction applyPlacementDeltaToStaticInstances', re.S)
          build_new = '''function buildRegisteredPlacement(THREE, placement, authoredRotundaOffset) {
            const sourceX = Number(placement.x);
            const sourceZ = Number(placement.z);
            const sourceYaw = Number(placement.yaw);
            const towardX = Number(placement.connectorTowardX);
            const towardZ = Number(placement.connectorTowardZ);
            const targetX = Number(placement.targetX);
            const targetZ = Number(placement.targetZ);
            const sourceWallDistance = Number(placement.wallConnectorLength) - SOURCE_WALL_LENGTH_PADDING_METERS;
            if (![sourceX, sourceZ, sourceYaw, towardX, towardZ, targetX, targetZ, sourceWallDistance].every(Number.isFinite)) {
              throw new Error(`Static jetway ${placement.gate} has incomplete source/facade registration evidence`);
            }
            const magnitude = Math.hypot(towardX, towardZ);
            if (!(magnitude > 0.95 && magnitude < 1.05)) {
              throw new Error(`Static jetway ${placement.gate} terminal direction is not normalized: ${magnitude}`);
            }
            if (!(sourceWallDistance > 0.4 && sourceWallDistance < 44)) {
              throw new Error(`Static jetway ${placement.gate} source-to-wall distance is invalid: ${sourceWallDistance}`);
            }
            const ux = towardX / magnitude;
            const uz = towardZ / magnitude;
            const wallX = sourceX + ux * sourceWallDistance;
            const wallZ = sourceZ + uz * sourceWallDistance;

            // The source BGL gate coordinate is the physical Rotunda center. The
            // previous implementation discarded it and moved every gate to one
            // fabricated 3.98 m center-to-wall distance. Preserve the measured
            // per-gate Rotunda/wall relationship instead, then use the exact GLB
            // Rotunda radius only to determine the short visible vestibule span.
            const rotundaX = sourceX;
            const rotundaZ = sourceZ;
            const visibleTerminalLegMeters = sourceWallDistance - authoredRotundaOffset.radiusMeters;
            if (!(visibleTerminalLegMeters > 0.35 && visibleTerminalLegMeters < 6.5)) {
              throw new Error(`Static jetway ${placement.gate} measured visible terminal vestibule is not compact: ${visibleTerminalLegMeters}`);
            }

            const bridgeDx = targetX - rotundaX;
            const bridgeDz = targetZ - rotundaZ;
            const bridgeDistance = Math.hypot(bridgeDx, bridgeDz);
            const yaw = bridgeDistance > 2 ? Math.atan2(bridgeDx, bridgeDz) : sourceYaw;
            const rotatedRotundaOffset = new THREE.Vector3(
              authoredRotundaOffset.x,
              0,
              authoredRotundaOffset.z,
            ).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const modelRootX = rotundaX - rotatedRotundaOffset.x;
            const modelRootZ = rotundaZ - rotatedRotundaOffset.z;
            const reconstructedRotundaX = modelRootX + rotatedRotundaOffset.x;
            const reconstructedRotundaZ = modelRootZ + rotatedRotundaOffset.z;
            const physicalRotundaRegistrationError = Math.hypot(
              reconstructedRotundaX - rotundaX,
              reconstructedRotundaZ - rotundaZ,
            );
            const displacement = Math.hypot(modelRootX - sourceX, modelRootZ - sourceZ);
            if (!(displacement <= MAXIMUM_REGISTRATION_DISPLACEMENT_METERS)) {
              throw new Error(`Static jetway ${placement.gate} facade registration displacement is excessive: ${displacement}`);
            }
            if (physicalRotundaRegistrationError > 1e-6) {
              throw new Error(`Static jetway ${placement.gate} authored Rotunda registration error is ${physicalRotundaRegistrationError}`);
            }
            const wallError = Math.abs(Math.hypot(wallX - rotundaX, wallZ - rotundaZ) - sourceWallDistance);
            const yawChange = Math.abs(wrapYaw(THREE, yaw - sourceYaw));
            return {
              ...placement,
              x: rotundaX,
              z: rotundaZ,
              yaw,
              aircraftDoorDistance: bridgeDistance,
              wallConnectorLength: sourceWallDistance,
              staticModelRootX: modelRootX,
              staticModelRootZ: modelRootZ,
              staticAuthoredRotundaOffsetX: authoredRotundaOffset.x,
              staticAuthoredRotundaOffsetZ: authoredRotundaOffset.z,
              staticAuthoredRotundaRadiusMeters: authoredRotundaOffset.radiusMeters,
              staticVisibleTerminalLegMeters: visibleTerminalLegMeters,
              staticSourceWallDistanceMeters: sourceWallDistance,
              staticPhysicalRotundaRegistrationErrorMeters: physicalRotundaRegistrationError,
              staticFacadeWallX: wallX,
              staticFacadeWallZ: wallZ,
              staticFacadeRegistrationDisplacementMeters: displacement,
              staticFacadeRegistrationYawChangeRadians: yawChange,
              staticFacadeWallErrorMeters: wallError,
              staticFacadeRegistrationAuthority: AUTHORITY,
              staticModelRootOffsetAuthority: ROOT_OFFSET_AUTHORITY,
            };
          }

          function applyPlacementDeltaToStaticInstances'''
          register, count = build_re.subn(build_new, register, count=1)
          if count != 1:
              raise SystemExit('Could not replace static gate registration function')

          register = register.replace(
              'marker.userData.staticFacadeWallDistanceMeters = ROTUNDA_CENTER_TO_WALL_METERS;',
              'marker.userData.staticFacadeWallDistanceMeters = registered.staticSourceWallDistanceMeters;\n    marker.userData.staticAuthoredRotundaRadiusMeters = registered.staticAuthoredRotundaRadiusMeters;\n    marker.userData.staticVisibleTerminalLegMeters = registered.staticVisibleTerminalLegMeters;',
          )
          max_anchor = 'const maximumPhysicalRotundaError = Math.max(...staticRegisteredPlacements.map((placement) => placement.staticPhysicalRotundaRegistrationErrorMeters));'
          if max_anchor not in register:
              raise SystemExit('Static registration summary anchor is missing')
          register = register.replace(
              max_anchor,
              max_anchor + '\n  const minimumVisibleTerminalLeg = Math.min(...staticRegisteredPlacements.map((placement) => placement.staticVisibleTerminalLegMeters));\n  const maximumVisibleTerminalLeg = Math.max(...staticRegisteredPlacements.map((placement) => placement.staticVisibleTerminalLegMeters));\n  const minimumSourceWallDistance = Math.min(...staticRegisteredPlacements.map((placement) => placement.staticSourceWallDistanceMeters));\n  const maximumSourceWallDistance = Math.max(...staticRegisteredPlacements.map((placement) => placement.staticSourceWallDistanceMeters));',
          )
          register = register.replace(
              'group.userData.uploadedJetwayStaticVisibleTerminalLegMeters = VISIBLE_TERMINAL_LEG_METERS;',
              'group.userData.uploadedJetwayStaticVisibleTerminalLegMeters = VISIBLE_TERMINAL_LEG_METERS;\n  group.userData.uploadedJetwayStaticMinimumMeasuredVisibleTerminalLegMeters = minimumVisibleTerminalLeg;\n  group.userData.uploadedJetwayStaticMaximumMeasuredVisibleTerminalLegMeters = maximumVisibleTerminalLeg;\n  group.userData.uploadedJetwayStaticMinimumMeasuredWallDistanceMeters = minimumSourceWallDistance;\n  group.userData.uploadedJetwayStaticMaximumMeasuredWallDistanceMeters = maximumSourceWallDistance;\n  group.userData.uploadedJetwayStaticAuthoredRotundaRadiusMeters = authoredRotundaOffset.radiusMeters;',
          )

          connector_re = re.compile(r'function measureConnector\(placement\) \{.*?\n\}\n\nfunction addBox', re.S)
          connector_new = '''function measureConnector(placement) {
            const measuredLength = Math.max(1.25, Math.min(18, Number(placement.wallConnectorLength) || 1.25));
            const towardX = Number(placement.connectorTowardX) || 0;
            const towardZ = Number(placement.connectorTowardZ) || 0;
            const magnitude = Math.hypot(towardX, towardZ) || 1;
            const ux = towardX / magnitude;
            const uz = towardZ / magnitude;

            let terminalOverlap;
            let length;
            let startDistance;
            let visibleTerminalLegMeters;
            if (placement.gate === "A1") {
              terminalOverlap = 1.45;
              length = Math.max(1.8, Math.min(19.5, measuredLength + terminalOverlap));
              startDistance = 0;
              visibleTerminalLegMeters = measuredLength;
            } else {
              const authoredRotundaRadius = Number(placement.staticAuthoredRotundaRadiusMeters);
              visibleTerminalLegMeters = Number(placement.staticVisibleTerminalLegMeters);
              if (!(authoredRotundaRadius > 0.7 && authoredRotundaRadius < 3.5)) {
                throw new Error(`Static jetway ${placement.gate} is missing the measured authored Rotunda radius`);
              }
              if (!(visibleTerminalLegMeters > 0.35 && visibleTerminalLegMeters < 6.5)) {
                throw new Error(`Static jetway ${placement.gate} measured visible vestibule is invalid: ${visibleTerminalLegMeters}`);
              }
              terminalOverlap = STATIC_TERMINAL_OVERLAP_METERS;
              startDistance = Math.max(0, authoredRotundaRadius - STATIC_ROTUNDA_OVERLAP_METERS);
              length = visibleTerminalLegMeters + STATIC_ROTUNDA_OVERLAP_METERS + STATIC_TERMINAL_OVERLAP_METERS;
            }

            const centerDistance = startDistance + length * 0.5;
            const centerX = placement.x + ux * centerDistance;
            const centerZ = placement.z + uz * centerDistance;
            const centerY = Number(placement.rotundaY) || 4.1;
            const yaw = Math.atan2(ux, uz);
            const sideX = Math.cos(yaw);
            const sideZ = -Math.sin(yaw);
            return {
              measuredLength,
              terminalOverlap,
              length,
              startDistance,
              visibleTerminalLegMeters,
              ux,
              uz,
              centerX,
              centerY,
              centerZ,
              yaw,
              sideX,
              sideZ,
              span: length,
              halfWidth: 1.31,
            };
          }

          function addBox'''
          connector, count = connector_re.subn(connector_new, connector, count=1)
          if count != 1:
              raise SystemExit('Could not replace static terminal connector measurement function')

          register_path.write_text(register, encoding='utf-8')
          connector_path.write_text(connector, encoding='utf-8')

          for path, text, required in [
              (register_path, register, [
                  '57-static-authored-rotundas-measured-source-wall-registration-v3',
                  'const rotundaX = sourceX;',
                  'staticAuthoredRotundaRadiusMeters',
                  'staticVisibleTerminalLegMeters',
                  'staticSourceWallDistanceMeters',
              ]),
              (connector_path, connector, [
                  'placement.staticAuthoredRotundaRadiusMeters',
                  'placement.staticVisibleTerminalLegMeters',
                  'startDistance = Math.max(0, authoredRotundaRadius - STATIC_ROTUNDA_OVERLAP_METERS)',
              ]),
          ]:
              for token in required:
                  if token not in text:
                      raise SystemExit(f'{path}: missing repaired token {token}')

          if 'const rotundaX = wallX - ux * ROTUNDA_CENTER_TO_WALL_METERS;' in register:
              raise SystemExit('Fabricated universal Rotunda center-to-wall registration survived')
          if 'const inferredRotundaRadius = Math.max(0, measuredLength - STATIC_VISIBLE_TERMINAL_LEG_METERS);' in connector:
              raise SystemExit('Connector still infers Rotunda radius from a fixed visible leg')

      - name: Commit measured static registration repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/environment/registerStaticJetwayFleetToFacadeV1.js src/environment/uploadedAirportJetwayTerminalConnector.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Measured static facade registration is already materialized.'
            exit 0
          fi
          git commit -m 'fix(jetway): preserve measured static Rotunda wall registration'
          git push origin HEAD:fix/live-experience-cdp-capture
