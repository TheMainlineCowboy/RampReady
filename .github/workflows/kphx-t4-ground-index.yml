name: KPHX T4 A1 Ground Index

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-t4-ground-index.yml"

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            public/models/kphx-full-airport/surfaces/surface-network.json
          sparse-checkout-cone-mode: false

      - name: Extract exact T4 A1 surface neighborhood
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const input="public/models/kphx-full-airport/surfaces/surface-network.json";
          const network=JSON.parse(fs.readFileSync(input,"utf8"));
          const R=6378137;
          const anchor={lat:33.436530675,lon:-111.998921221,x:0,z:6.2};
          const lat0=anchor.lat*Math.PI/180;
          const radius=450;

          function project(lat,lon){
            const east=(lon-anchor.lon)*Math.PI/180*R*Math.cos(lat0);
            const north=(lat-anchor.lat)*Math.PI/180*R;
            return {x:-north+anchor.x,z:-east+anchor.z};
          }

          function projectedPoints(entry){
            const out=[];
            const add=(node)=>{
              const lat=Number(node?.latitude), lon=Number(node?.longitude);
              if(Number.isFinite(lat)&&Number.isFinite(lon)) out.push(project(lat,lon));
            };
            for(const ring of entry.rings||[]) for(const node of ring.nodes||[]) add(node);
            for(const node of entry.nodes||[]) add(node);
            return out;
          }

          function bounds(entry){
            const p=projectedPoints(entry);
            if(!p.length) return null;
            const xs=p.map(q=>q.x), zs=p.map(q=>q.z);
            return {minX:Math.min(...xs),maxX:Math.max(...xs),minZ:Math.min(...zs),maxZ:Math.max(...zs)};
          }

          function distanceToBounds(b){
            if(!b) return Infinity;
            const dx=anchor.x<b.minX?b.minX-anchor.x:anchor.x>b.maxX?anchor.x-b.maxX:0;
            const dz=anchor.z<b.minZ?b.minZ-anchor.z:anchor.z>b.maxZ?anchor.z-b.maxZ:0;
            return Math.hypot(dx,dz);
          }

          function select(list){
            return (list||[]).map(entry=>{
              const b=bounds(entry);
              return {entry,b,d:distanceToBounds(b)};
            }).filter(item=>item.d<=radius).map(({entry,b,d})=>({
              id:entry.id,
              name:entry.name,
              resource:entry.resource,
              resourcePrefix:entry.resourcePrefix,
              sourceClass:entry.sourceClass,
              distanceToA1BoundsMeters:Number(d.toFixed(3)),
              bounds:b
            })).sort((a,b)=>a.distanceToA1BoundsMeters-b.distanceToA1BoundsMeters);
          }

          const selected={
            polygons:select(network.polygons),
            drapedOrthophotos:select(network.drapedOrthophotos),
            lines:select(network.lines),
          };
          const all=[...selected.polygons,...selected.drapedOrthophotos,...selected.lines];
          const resources=[...new Set(all.map(x=>x.resource))].sort();
          const prefixes=[...new Set(all.map(x=>x.resourcePrefix))].sort();
          const byPrefix={};
          for(const prefix of prefixes){
            const entries=all.filter(x=>x.resourcePrefix===prefix);
            byPrefix[prefix]={
              placements:entries.length,
              resources:[...new Set(entries.map(x=>x.resource))].sort()
            };
          }
          const report={
            schemaVersion:2,
            authority:input,
            projection:"verified KPHX A1 local flat-earth source frame",
            a1:anchor,
            radiusMeters:radius,
            counts:{
              polygons:selected.polygons.length,
              drapedOrthophotos:selected.drapedOrthophotos.length,
              lines:selected.lines.length,
              placements:all.length,
              uniqueResources:resources.length
            },
            resourcePrefixes:prefixes,
            resources,
            byPrefix,
            selected
          };
          fs.writeFileSync("reports/kphx-t4-a1-ground-index.json",JSON.stringify(report,null,2)+"\n");
          console.log("COUNTS "+JSON.stringify(report.counts));
          console.log("PREFIXES "+JSON.stringify(byPrefix));
          NODE

      - name: Upload exact T4 A1 ground index
        uses: actions/upload-artifact@v4
        with:
          name: kphx-t4-a1-ground-index
          path: reports/kphx-t4-a1-ground-index.json
          if-no-files-found: error
