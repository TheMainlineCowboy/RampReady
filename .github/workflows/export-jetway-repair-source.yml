name: Export jetway repair source

on:
  push:
    branches: [agent/fix-terminal4-jetway-geometry]
    paths:
      - '.github/workflows/export-jetway-repair-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repair workspace
        run: |
          tar -czf rampready-jetway-repair-source.tar.gz \
            package.json package-lock.json vite.config.js playwright*.js \
            src scripts tests public/models/airport-jetway \
            .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: rampready-jetway-repair-source-${{ github.sha }}
          path: rampready-jetway-repair-source.tar.gz
          retention-days: 1
