name: Verify exact supplied jetway articulation

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/kphx-source/exact-kphx-manifest.json'
      - 'public/models/kphx/wed-jetways.exact.json'
      - 'public/models/kphx/wed-ground.exact.json'
      - 'public/models/kphx/Terminal4.exact.glb'
      - 'public/models/kphx/Terminal4b.exact.glb'
      - 'scripts/verify-exact-kphx-source-runtime.mjs'
      - 'public/models/airport-jetway/Airport_Jetway.glb'
      - 'src/environment/sourcePlacedTerminal4Jetways.js'
      - 'src/environment/uploadedAirportJetwayFleet.js'
      - 'src/environment/uploadedAirportJetwayFleetReadyV2.js'
      - 'src/environment/uploadedAirportJetwayExactModelGuard.js'
      - 'src/environment/uploadedAirportJetwayArticulationV10.js'
      - 'scripts/materialize-exact-airport-jetway.mjs'
      - 'scripts/prepare-exact-airport-jetway-source-wiring.mjs'
      - 'scripts/prepare-uploaded-airport-jetway-fleet.mjs'
      - 'scripts/prepare-uploaded-airport-jetway-articulation-v10.mjs'
      - 'scripts/prepare-uploaded-airport-jetway-readiness-v2.mjs'
      - 'scripts/prepare-terminal4-crj-runtime-evidence.mjs'
      - 'scripts/verify-exact-airport-jetway-runtime.mjs'
      - 'scripts/verify-uploaded-airport-jetway-fleet.mjs'
      - 'scripts/verify-uploaded-airport-jetway-articulation-v10.mjs'
      - 'tests/browser/uploaded-jetway-articulation-v10.spec.js'
      - 'package.json'
      - '.github/workflows/verify-uploaded-jetway-articulation-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-exact-supplied-jetway-articulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Detect exact KPHX source migration
        id: source-mode
        shell: bash
        run: |
          if test -f assets/kphx-source/exact-kphx-manifest.json; then
            echo 'exact=true' >> "$GITHUB_OUTPUT"
            echo 'Exact KPHX source authority is present; retired 58-placement/A1 preparers will not run.'
          else
            echo 'exact=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact KPHX source airport authority
        if: steps.source-mode.outputs.exact == 'true'
        run: npm run materialize:kphx-source

      - name: Prepare and verify legacy supplied GLB articulation
        if: steps.source-mode.outputs.exact != 'true'
        run: |
          node scripts/materialize-exact-airport-jetway.mjs
          node scripts/prepare-exact-airport-jetway-source-wiring.mjs
          node scripts/prepare-uploaded-airport-jetway-articulation-v10.mjs
          node scripts/prepare-uploaded-airport-jetway-readiness-v2.mjs
          node scripts/prepare-terminal4-crj-runtime-evidence.mjs
          node scripts/prepare-uploaded-airport-jetway-fleet.mjs
          node scripts/verify-exact-airport-jetway-runtime.mjs
          node scripts/verify-uploaded-airport-jetway-fleet.mjs
          node scripts/verify-uploaded-airport-jetway-articulation-v10.mjs

      - name: Run complete RampReady verification
        run: npm run verify

      - name: Build exact production artifact
        run: npm run build

      - name: Install legacy browser verifier
        if: steps.source-mode.outputs.exact != 'true'
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and measure legacy articulated supplied A1 jetway
        if: steps.source-mode.outputs.exact != 'true'
        run: npx playwright test tests/browser/uploaded-jetway-articulation-v10.spec.js --reporter=line --workers=1

      - name: Upload legacy exact jetway evidence
        if: always() && steps.source-mode.outputs.exact != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: exact-supplied-jetway-articulation-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            public/models/airport-jetway/exact-asset-manifest.json
          if-no-files-found: warn
          retention-days: 1
