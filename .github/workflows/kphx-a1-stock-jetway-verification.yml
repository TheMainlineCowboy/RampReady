name: Materialize and Verify XP11 A1 Stock Jetway

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-a1-stock-jetway-verification.yml"

permissions:
  contents: write

concurrency:
  group: kphx-a1-stock-jetway-verification
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            package.json
            package-lock.json
            index.html
            vite.config.js
            src
            scripts/convert-kphx-obj8-to-gltf.mjs
            scripts/materialize-xp11-stock-jetway-facade.mjs
            reports/kphx-a1-source-jetway-authority.json
            public/models/kphx
            public/models/kphx-stock-jetways
          sparse-checkout-cone-mode: false

      - name: Download exact stock XP11 source ZIPs from Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown pillow
          mkdir -p /tmp/xp11-jetways /tmp/xp11-textures /tmp/runtime-textures
          gdown 1uxoZcKcZpQUpoUSMl6c2jdGM9sOC-zEA -O /tmp/XP11_Jetways.zip
          gdown 1ouKCCP82gySCF3murkHfV-H3bgybKamZ -O /tmp/textures.zip
          echo "b64fe7f83e2a286bb52c5b4255953eda46f04b1b5c0d9928faffe4b9371f595f  /tmp/XP11_Jetways.zip" | sha256sum --check --strict
          echo "e6419a2b1a7b0be4f8ee8f572d588b2d8331c085873f87c31d6348e7b8fbefdd  /tmp/textures.zip" | sha256sum --check --strict
          unzip -q /tmp/XP11_Jetways.zip -d /tmp/xp11-jetways
          unzip -q /tmp/textures.zip -d /tmp/xp11-textures

      - name: Prepare browser-compatible copies of exact stock textures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil, hashlib, json

          source = Path("/tmp/xp11-textures/textures")
          out = Path("/tmp/runtime-textures")
          out.mkdir(parents=True, exist_ok=True)

          Image.open(source / "jetway_1_ALB.dds").save(out / "jetway_1_ALB.png")
          Image.open(source / "jetway_1_LIT.dds").save(out / "jetway_1_LIT.png")
          shutil.copy2(source / "jetway_1_NML.png", out / "jetway_1_NML.png")

          report = {
              "source": {
                  "jetway_1_ALB.dds": hashlib.sha256((source / "jetway_1_ALB.dds").read_bytes()).hexdigest(),
                  "jetway_1_LIT.dds": hashlib.sha256((source / "jetway_1_LIT.dds").read_bytes()).hexdigest(),
                  "jetway_1_NML.png": hashlib.sha256((source / "jetway_1_NML.png").read_bytes()).hexdigest(),
              },
              "runtime": {
                  name: hashlib.sha256((out / name).read_bytes()).hexdigest()
                  for name in ("jetway_1_ALB.png", "jetway_1_LIT.png", "jetway_1_NML.png")
              },
              "conversionPolicy": "DDS decompressed to PNG for browser transport only; dimensions and decoded pixels preserved"
          }
          Path("/tmp/texture-conversion.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Materialize exact stock jetway facade
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-xp11-stock-jetway-facade.mjs             /tmp/xp11-jetways/jetways             /tmp/runtime-textures             public/models/kphx-stock-jetways
          test -f public/models/kphx-stock-jetways/manifest.json
          test -f public/models/kphx-stock-jetways/jetway_1_solid.fac
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const m = JSON.parse(fs.readFileSync("public/models/kphx-stock-jetways/manifest.json", "utf8"));
          if (m.ringMode !== 0) throw new Error("stock jetway facade is not RING 0");
          if (m.objects.length !== 18) throw new Error("stock jetway OBJ count mismatch");
          if (m.segments.length !== 24) throw new Error("stock jetway segment count mismatch");
          if (m.walls.length !== 10) throw new Error("stock jetway wall count mismatch");
          console.log({
            facadeSha256: m.sourceFacadeSha256,
            ringMode: m.ringMode,
            objects: m.objects.length,
            segments: m.segments.length,
            walls: m.walls.length,
          });
          NODE

      - name: Install verifier browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start A1 stock jetway verifier
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/a1-stock-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/a1-stock-vite.log
          exit 1

      - name: Capture exact A1 stock jetway evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
          const errors = [];
          const failed = [];
          const httpErrors = [];
          page.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("requestfailed", (r) => failed.push({ url: r.url(), error: r.failure()?.errorText || "unknown" }));
          page.on("response", (r) => { if (r.status() >= 400) httpErrors.push({ url: r.url(), status: r.status() }); });

          let waitError = null;
          await page.goto("http://127.0.0.1:4173/RampReady/?kphxA1StockJetway=1", {
            waitUntil: "domcontentloaded",
            timeout: 60000,
          });
          try {
            await page.waitForFunction(() => {
              const c = document.querySelector("canvas.kphxA1StockJetwayVerifierCanvas");
              return ["ready", "error"].includes(c?.dataset?.kphxA1StockJetwayVerifier);
            }, null, { timeout: 120000 });
          } catch (error) {
            waitError = String(error);
          }

          const evidence = await page.evaluate(() => {
            const c = document.querySelector("canvas.kphxA1StockJetwayVerifierCanvas");
            return c ? { dataset: { ...c.dataset } } : { dataset: {} };
          });
          await page.screenshot({ path: "reports/kphx-a1-stock-jetway-verification.png", fullPage: true });
          fs.writeFileSync(
            "reports/kphx-a1-stock-jetway-verification.json",
            JSON.stringify({ evidence, errors, failed, httpErrors, waitError }, null, 2) + "\n",
          );
          await browser.close();
          NODE

      - name: Enforce source-only A1 contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync("reports/kphx-a1-stock-jetway-verification.json", "utf8"));
          const d = result.evidence?.dataset || {};
          const failures = [];
          if (d.kphxA1StockJetwayVerifier !== "ready") failures.push(d.kphxA1StockJetwayError || `state=${d.kphxA1StockJetwayVerifier}`);
          if (d.kphxA1StockResource !== "lib/airport/Ramp_Equipment/Jetways/Jetway_1_solid.fac") failures.push("wrong resource");
          if (d.kphxA1StockFacadeWedObjectId !== "104804") failures.push(`facade=${d.kphxA1StockFacadeWedObjectId}`);
          if (d.kphxA1StockNodeCount !== "7") failures.push(`nodes=${d.kphxA1StockNodeCount}`);
          if (d.kphxA1StockEdgeCount !== "6") failures.push(`edges=${d.kphxA1StockEdgeCount}`);
          if (d.kphxA1StockRingMode !== "0") failures.push(`ring=${d.kphxA1StockRingMode}`);
          if (d.kphxA1StockWallSequence !== "Rotunda_extension|Rotunda_extension|Rotunda_extension|Rotunda_extension|Tunnel_11-15.5m|Cabin") failures.push(`walls=${d.kphxA1StockWallSequence}`);
          if (d.kphxA1OldUploadedGlbUsed !== "false") failures.push("old Airport_Jetway.glb was used");
          if (!(Number(d.kphxA1StockAttachmentCount) > 0)) failures.push(`attachments=${d.kphxA1StockAttachmentCount}`);
          if (!(Number(d.kphxA1StockObjectPrototypeCount) > 0)) failures.push(`objectPrototypes=${d.kphxA1StockObjectPrototypeCount}`);
          if (result.waitError) failures.push(`wait=${result.waitError}`);
          if ((result.errors || []).length) failures.push(`browser=${result.errors.join(" | ")}`);
          if ((result.failed || []).length) failures.push(`failedRequests=${JSON.stringify(result.failed)}`);
          if ((result.httpErrors || []).length) failures.push(`httpErrors=${JSON.stringify(result.httpErrors)}`);
          if (failures.length) throw new Error(`A1 exact stock jetway verification failed: ${failures.join("; ")}`);
          console.log(JSON.stringify(d, null, 2));
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kphx-a1-stock-jetway-verification
          path: |
            reports/kphx-a1-stock-jetway-verification.png
            reports/kphx-a1-stock-jetway-verification.json
            /tmp/texture-conversion.json
          if-no-files-found: warn
          compression-level: 0

      - name: Commit verified stock runtime assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/kphx-stock-jetways
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
            exit 0
          fi
          git commit -m "Materialize exact XP11 stock A1 jetway facade"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
