name: KPHX Full Exact MisterX Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-full-misterx-materialize.yml"

permissions:
  contents: write

concurrency:
  group: kphx-full-misterx-materialize-staged-agp
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install exact conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --quiet gdown
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch exact KPHX WED authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kphx-source reports
          gdown "https://drive.google.com/uc?id=1oUuiZQiWbqIMXtqSQMklZ9E_jbsg_T2d" -O .kphx-source/earth.wed.xml
          test "$(sha256sum .kphx-source/earth.wed.xml | awk '{print $1}')" = "59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498"
          node scripts/extract-kphx-wed-object-placements.mjs \
            .kphx-source/earth.wed.xml \
            reports/kphx-full-airport-wed-placements-misterx.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const input=JSON.parse(fs.readFileSync("reports/kphx-full-airport-wed-placements-misterx.json","utf8"));
          const allMisterX=(input.placements.externalLibraries||[]).filter((p)=>p.resourcePrefix==="MisterX_Library");
          const ambiguousRandom=new Set([
            "MisterX_Library/Airport/Aircraft/Bombardier_Global_Express/Random.obj",
            "MisterX_Library/Airport/Aircraft/Cessna_172/Random.obj",
            "MisterX_Library/Airport/Aircraft/Cessna_208_Caravan/Random_PAX.obj",
            "MisterX_Library/Airport/Aircraft/Cessna_Citation_II/Random.obj",
            "MisterX_Library/Airport/Aircraft/Learjet_35/Random.obj",
          ]);
          const exactAgpResource="MisterX_Library/Vehicles/Trucks/Truck_Fedex.agp";
          const blocked=allMisterX.filter((p)=>ambiguousRandom.has(p.resource));
          const agpPlacements=allMisterX.filter((p)=>p.resource===exactAgpResource);
          const selected=allMisterX.filter((p)=>!ambiguousRandom.has(p.resource)&&p.resource!==exactAgpResource);
          const resources={};
          for(const p of selected) resources[p.resource]=(resources[p.resource]||0)+1;
          const blockedCounts={};
          for(const p of blocked) blockedCounts[p.resource]=(blockedCounts[p.resource]||0)+1;
          const payload={
            schemaVersion:1,
            authority:"KPHX 1.75.1 earth.wed.xml exact MisterX object placements",
            source:{...input.source,wedSha256:"59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498",authority:"user-supplied expanded X-Plane package"},
            selection:{policy:"all WED_ObjPlacement entries with resourcePrefix MisterX_Library; no radius/area selection"},
            masterAnchor:input.masterAnchor,
            totals:{objectPlacementCount:selected.length,uniqueResourceCount:Object.keys(resources).length,packageOwnedPlacementCount:0,externalLibraryPlacementCount:selected.length},
            packageOwned:{placementCount:0,uniqueResourceCount:0,resources:{}},
            externalLibraries:{placementCount:selected.length,uniqueResourceCount:Object.keys(resources).length,prefixCounts:{"MisterX_Library":selected.length},resources},
            placements:{packageOwned:[],externalLibraries:selected},
            rampStarts:[],
          };
          if(allMisterX.length!==2443) throw new Error(`MisterX WED authority changed: total=${allMisterX.length}`);
          if(blocked.length!==25||Object.keys(blockedCounts).length!==5){
            throw new Error(`MisterX ambiguous Random contract changed: placements=${blocked.length}, resources=${Object.keys(blockedCounts).length}`);
          }
          if(selected.length+agpPlacements.length!==2418||Object.keys(resources).length!==107){
            throw new Error(`Exact MisterX WED authority changed: objPlacements=${selected.length}, agpPlacements=${agpPlacements.length}, objResources=${Object.keys(resources).length}`);
          }
          fs.writeFileSync("reports/kphx-full-misterx-wed-placements.json",JSON.stringify(payload,null,2)+"\n");
          fs.writeFileSync("reports/kphx-full-misterx-object-resources.json",JSON.stringify({
            authority:"reports/kphx-full-misterx-wed-placements.json",
            dependency:"MisterX_Library",
            resources:Object.keys(resources).sort(),
          },null,2)+"\n");
          fs.writeFileSync("reports/kphx-full-misterx-blocked-random-resources.json",JSON.stringify({
            authority:"MisterX_Library library.txt multiple equal-priority EXPORT mappings",
            policy:"blocked rather than choose a substitute/random physical aircraft",
            placementCount:blocked.length,
            uniqueResourceCount:Object.keys(blockedCounts).length,
            resources:blockedCounts,
          },null,2)+"\n");
          fs.writeFileSync("reports/kphx-full-misterx-agp-authority.json",JSON.stringify({
            authority:"KPHX 1.75.1 earth.wed.xml exact MisterX AGP placement",
            policy:"tracked separately; never force AGP through OBJ converter",
            resource:exactAgpResource,
            placementCount:agpPlacements.length,
            placements:agpPlacements,
          },null,2)+"\n");
          NODE

      - name: Use staged exact MisterX 2.0c source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .misterx
          cp -a "$GITHUB_WORKSPACE/assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library" .misterx
          test -f .misterx/library.txt
          test "$(cat .misterx/version.txt)" = "2.0c"

      - name: Supplement only missing exact MisterX OBJ sources
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/misterx-downloads.txt <<'EOF'
          16ZkrJxBHfc2hOJ--14nGzaPtPyAlJKv9 .misterx/Airport/Aircraft/Boeing_767_300/UPS_new.obj
          1ww3SIDJupqq0GkbE5Too7K8xmYLhbyVo .misterx/Airport/Aircraft/Boeing_767_300/UPS.dds
          1BZ_YtlRVdHrUMIpcSBO6choxEEcqk-LN .misterx/Airport/Aircraft/Boeing_767_300/UPS_LIT.png
          1QyCa_5hirSV5M3rTJluFBcgtS7s_aPeh .misterx/Airport/Aircraft/Boeing_767_300/Normal_Cargo.png
          1CdS70QY03vinEJqF1bhyNwcssePqBUKW .misterx/Airport/Aircraft/Boeing_777_200ER/American_Airlines.obj
          1cgPQ1_CXb1RJEKy_PnYyd5GGvMtClnkG .misterx/Airport/Aircraft/Boeing_777_200ER/American_Airlines.dds
          13ZVF0qiR1RRr4DlgGGAJ0ml3rtCwcHhm .misterx/Airport/Aircraft/Boeing_777_200ER/American_Airlines_LIT.png
          1Qa_bjxBEOm2na42gJ90yqIi6utV8PpSV .misterx/Airport/Aircraft/Boeing_777_200ER/Normal.png
          1DX8w1cnTy5ofm0AycBlKzDXeAFyAtZRv .misterx/Airport/Aircraft/Bombardier_CRJ700/American_Eagle.obj
          1nSyBho0-xsF_fx2sQiQGksC73vHDqxWR .misterx/Airport/Aircraft/Bombardier_CRJ700/American_Eagle.dds
          1845i__d-te2OwJote-3H5IDBm9Gmrjjv .misterx/Airport/Aircraft/Bombardier_CRJ700/Shadow.dds
          1FgElMPwzEqrU2MLVP8jmHdoW1096YjZo .misterx/Airport/Aircraft/Bombardier_Global_Express/Red_N712ZT.obj
          1_toHobEsy1G8YOJH1XIvkHh0V1v0I0zn .misterx/Airport/Aircraft/Bombardier_Global_Express/Red_N712ZT.dds
          16abAryb8kGty8T-F3cD_058PCgBH8dGw .misterx/Airport/Aircraft/Bombardier_Global_Express/White_N526CX.obj
          1HbLq_tAUY_hUodGrzD7C7iw_Je9alFoC .misterx/Airport/Aircraft/Bombardier_Global_Express/White_N526CX.dds
          1GsfUD1xa32tYSyNXXx2_HaprpFeIn5mk .misterx/Airport/Aircraft/Bombardier_Global_Express/Shadow.dds
          187L4Sfgsp8d3tX48uVsfWq69VtEfoVlU .misterx/Airport/Aircraft/Cessna_208_Caravan/Fedex.obj
          1eq6irOvXrxMp-GG3U7KHIZ7ch40-gFBl .misterx/Airport/Aircraft/Cessna_208_Caravan/Fedex.dds
          1sBR0jmP6eBSW4zFayFgjF0blALB8J38c .misterx/Airport/Aircraft/Cessna_208_Caravan/Shadow.dds
          179CwGe2FNAL24prQiNVAw7Z4N3SommnF .misterx/Airport/Aircraft/Cessna_Citation_II/N236RM.obj
          1pbMZdBWxo8Jmd99smPT2Xxb8Egw-AX-p .misterx/Airport/Aircraft/Cessna_Citation_II/N236RM.dds
          1wdkBGpazi23z2XnZ6THDXIwRa0LikHQR .misterx/Airport/Aircraft/Cessna_Citation_II/N530MX.obj
          1bTNkRHJ0Xhs3UuRJeYBTTjxK7FwbTaar .misterx/Airport/Aircraft/Cessna_Citation_II/N530MX.dds
          1YLFo8NE6JuaEwpF5rIeycuf9cBLJYLCA .misterx/Airport/Aircraft/Cessna_Citation_II/Shadow.dds
          1tKjgSukTE5ceMR3f5_iSayCFdYal2uI6 .misterx/Airport/Aircraft/Learjet_35/Cyan_Yellow_N683BA.obj
          1aEIdWuBq9HPk5fFNrAhnwtk2pW9kU9Ce .misterx/Airport/Aircraft/Learjet_35/Cyan_Yellow_N683BA.dds
          1ZLLhzCYdVppMHD6FFzNG1RMpryb0GI8N .misterx/Airport/Aircraft/Learjet_35/Shadow.dds
          1aO6T0jLUB1ZwVPUiYLNLEqUrX2GplHCD .misterx/Airport/Other/Checkered_Hut.obj
          1FTUznEieYp5OeZECE_dOtDyFYdj9HA8s .misterx/Airport/Other/Glideslope_Antenna.obj
          1WqW9NjidGAfNWln_1deqy18LkQoQMoHH .misterx/Airport/Other/ILS_Antennas.obj
          1UkGwFk1KcqWCA7a8Neg3fudchZc0DUte .misterx/Airport/Other/ILS_Antennas.dds
          1EYMQ1RJpupm6hSagE2sZN1BeEvnuMFY9 .misterx/Objects/Construction/Garbage_Container_Rusty.obj
          1JRgWilgj8ADAe5sxFYNakvWzH4pkpMMv .misterx/Objects/Construction/Container_Rusty.dds
          1KL75ITJuXJv_3M116BTLMWPACH17Rcjh .misterx/Vehicles/Construction/Bulldozer.obj
          1q1SVndPdgXbGtlU6qNifSlMEQea5J5O3 .misterx/Vehicles/Construction/Bulldozer.dds
          1h7XahpqS6LFopfRN7RxR7G_GV5PS3g40 .misterx/Vehicles/Construction/Steamroller.obj
          1yhGVFL5lamyBDIEobpcYoqO3-Sj2rtw2 .misterx/Vehicles/Construction/Steamroller.dds
          1OpTFow3MZGDMQ2l6yiNc-TVcDr1oHdUN .misterx/Vehicles/Trucks/Box_Truck_Fedex.obj
          14tgOoiHPxScds4PxcQV6ghVXH8kvWuVp .misterx/Vehicles/Trucks/Box_Truck_UPS.obj
          1Jw0ObjP7a7RumyaK-R9MIVXMzUGgkRt2 .misterx/Vehicles/Trucks/Box_Truck_White.obj
          1KhwdpUL9piLf3Q_Ydt9KyaXZJCCroD7Q .misterx/Vehicles/Trucks/Box_Truck.dds
          1GlBU9PVn7SQYE3tJzJTLaVoJiHFloX64 .misterx/Vehicles/Trucks/Box_Truck_UPS.dds
          1rw3x1Wjp097VAyv4gSzZzliujx4a2-JQ .misterx/Vehicles/Trucks/Trailer_Fedex.obj
          1ZCDzkcL9cEYsqy5Y-7_uT9GkL0Ecg89r .misterx/Vehicles/Trucks/Trailer_Fedex.dds
          14TZV-yzdL_b0jBry2Dc98nrl5BClQ5va .misterx/Vehicles/Trucks/Trailer_UPS.obj
          1T6tZPiH5N4E9StpgHcR12jZ5AsuTiWh1 .misterx/Vehicles/Trucks/Trailer_UPS.dds
          1hETPtkVeWnPMECBrktLhgtEKRt50vins .misterx/Vehicles/Trucks/Trailer_NRM.png
          EOF

          cat /tmp/misterx-downloads.txt | xargs -P 4 -n 2 bash -c '
            set -euo pipefail
            id="$1"
            target="$2"
            mkdir -p "$(dirname "$target")"
            gdown "https://drive.google.com/uc?id=$id" -O "$target"
          ' _

          node scripts/resolve-xplane-library.mjs \
            .misterx \
            reports/kphx-full-misterx-object-resources.json \
            reports/kphx-full-misterx-library-map-preflight.json \
            --virtual-prefix=MisterX_Library

      - name: Resolve all exact WED MisterX resources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-xplane-library.mjs \
            .misterx \
            reports/kphx-full-misterx-object-resources.json \
            reports/kphx-full-misterx-library-map.json \
            --virtual-prefix=MisterX_Library

      - name: Materialize all exact WED MisterX objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime-misterx
          node scripts/materialize-kphx-full-airport.mjs \
            .misterx \
            .runtime-misterx \
            --placement-report=reports/kphx-full-misterx-wed-placements.json \
            --library-map=reports/kphx-full-misterx-library-map.json \
            --include-external-prefixes=MisterX_Library \
            --batch-name=full-misterx

      - name: Verify full exact MisterX contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const m=JSON.parse(fs.readFileSync(".runtime-misterx/manifest.json","utf8"));
          const a=JSON.parse(fs.readFileSync("reports/kphx-full-misterx-wed-placements.json","utf8"));
          const agp=JSON.parse(fs.readFileSync("reports/kphx-full-misterx-agp-authority.json","utf8"));
          if(m.failures?.length) throw new Error(`MisterX failures=${m.failures.length}`);
          if(m.resolvedExternal.materializedPlacementCount!==a.totals.objectPlacementCount){
            throw new Error(`Expected ${a.totals.objectPlacementCount} exact MisterX OBJ placements, got ${m.resolvedExternal.materializedPlacementCount}`);
          }
          if(m.resolvedExternal.expectedUniqueResourceCount!==107||m.resolvedExternal.materializedUniqueResourceCount!==107){
            throw new Error(`Expected 107 exact MisterX OBJ resources, got expected=${m.resolvedExternal.expectedUniqueResourceCount} materialized=${m.resolvedExternal.materializedUniqueResourceCount}`);
          }
          console.log(JSON.stringify({objPlacements:a.totals.objectPlacementCount,objResources:107,agpPlacements:agp.placementCount,blockedRandomPlacements:25,status:"PASS"},null,2));
          NODE

      - name: Install and commit full exact MisterX runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models/kphx-full-airport/external public/models/kphx-full-airport/batches
          cp -a .runtime-misterx/external/. public/models/kphx-full-airport/external/
          cp .runtime-misterx/manifest.json public/models/kphx-full-airport/batches/full-misterx.manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/kphx-full-airport/external/MisterX_Library \
            public/models/kphx-full-airport/batches/full-misterx.manifest.json \
            reports/kphx-full-airport-wed-placements-misterx.json \
            reports/kphx-full-misterx-wed-placements.json \
            reports/kphx-full-misterx-object-resources.json \
            reports/kphx-full-misterx-blocked-random-resources.json \
            reports/kphx-full-misterx-agp-authority.json \
            reports/kphx-full-misterx-library-map.json \
            reports/kphx-full-airport-materialization-full-misterx.json
          git commit -m "Materialize full exact KPHX MisterX objects"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

# retrigger after exact GLOBAL_SHADOWS / GLOBAL_LOD / TILTED support
