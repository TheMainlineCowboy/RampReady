# Storage guard reverified 2026-08-06; preserves named PR140 acceptance evidence for its one-day retention window.
name: Cleanup Actions storage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-actions-storage.yml
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: rampready-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Delete obsolete artifacts and all caches, then verify zero remain
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          get_json() {
            local endpoint="$1" paginated="${2:-false}" attempt=1 output
            while (( attempt <= 30 )); do
              if [[ "${paginated}" == "true" ]]; then
                output="$(gh api --paginate --slurp "${endpoint}" 2>&1)"
              else
                output="$(gh api "${endpoint}" 2>&1)"
              fi
              if jq -e . >/dev/null 2>&1 <<<"${output}"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "GET ${endpoint} failed on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            return 1
          }

          delete_one() {
            local endpoint="$1" attempt=1 output
            while (( attempt <= 30 )); do
              if output="$(gh api --method DELETE "${endpoint}" 2>&1)"; then
                sleep 0.25
                return 0
              fi
              [[ "${output}" == *"HTTP 404"* ]] && return 0
              echo "DELETE ${endpoint} failed on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            return 1
          }

          main_sha="$(get_json "repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')" || exit 1
          pr140_json="$(get_json "repos/${GITHUB_REPOSITORY}/pulls/140")" || exit 1
          pr140_sha="$(jq -r 'if .state == "open" then .head.sha else empty end' <<<"${pr140_json}")"
          keep_json="$(printf '%s\n' "${main_sha}" "${pr140_sha}" | jq -R . | jq -s 'map(select(length > 0)) | unique')"
          echo "Preserving main, open PR #140, and named PR140 exact-acceptance artifacts for their one-day retention window: ${keep_json}"

          deleted_artifacts=0
          deleted_artifact_bytes=0
          while true; do
            pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)" || exit 1
            mapfile -t rows < <(
              jq -r --argjson keep "${keep_json}" '
                .[] | .artifacts[]
                | (.workflow_run.head_sha // "") as $sha
                | select(($keep | index($sha)) == null)
                | select(((.name // "") | startswith("pr140-exact-acceptance-")) | not)
                | [.id, (.size_in_bytes // 0)]
                | @tsv
              ' <<<"${pages}"
            )
            (( ${#rows[@]} == 0 )) && break
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r id bytes <<<"${row}"
              delete_one "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || exit 1
              deleted_artifacts=$((deleted_artifacts + 1))
              deleted_artifact_bytes=$((deleted_artifact_bytes + bytes))
            done
            echo "Deleted ${deleted_artifacts} obsolete artifacts (${deleted_artifact_bytes} bytes)."
            sleep 3
          done

          deleted_caches=0
          deleted_cache_bytes=0
          while true; do
            pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)" || exit 1
            mapfile -t rows < <(jq -r '.[] | .actions_caches[]? | [.id, (.size_in_bytes // 0)] | @tsv' <<<"${pages}")
            (( ${#rows[@]} == 0 )) && break
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r id bytes <<<"${row}"
              delete_one "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || exit 1
              deleted_caches=$((deleted_caches + 1))
              deleted_cache_bytes=$((deleted_cache_bytes + bytes))
            done
            echo "Deleted ${deleted_caches} caches (${deleted_cache_bytes} bytes)."
            sleep 3
          done

          artifact_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)" || exit 1
          obsolete_artifacts="$(
            jq -r --argjson keep "${keep_json}" '
              [.[] | .artifacts[]
                | (.workflow_run.head_sha // "") as $sha
                | select(($keep | index($sha)) == null)
                | select(((.name // "") | startswith("pr140-exact-acceptance-")) | not)]
              | length
            ' <<<"${artifact_pages}"
          )"
          preserved_artifacts="$(jq -r '[.[] | .artifacts[]] | length' <<<"${artifact_pages}")"
          preserved_bytes="$(jq -r '[.[] | .artifacts[].size_in_bytes // 0] | add // 0' <<<"${artifact_pages}")"
          cache_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)" || exit 1
          remaining_caches="$(jq -r '[.[] | .actions_caches[]?] | length' <<<"${cache_pages}")"

          echo "STORAGE CLEANUP VERIFIED: deleted artifacts=${deleted_artifacts} (${deleted_artifact_bytes} bytes), caches=${deleted_caches} (${deleted_cache_bytes} bytes); remaining obsolete artifacts=${obsolete_artifacts}, caches=${remaining_caches}; preserved current/acceptance evidence=${preserved_artifacts} artifacts (${preserved_bytes} bytes)."
          (( obsolete_artifacts == 0 && remaining_caches == 0 ))

          freed_mb=$(( (deleted_artifact_bytes + deleted_cache_bytes + 524287) / 1048576 ))
          echo "description=artifacts=0 caches=0; freed ${freed_mb} MB" >> "${GITHUB_OUTPUT}"

      - name: Check out main storage policy source
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce one-day artifact retention
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          upload = re.compile(r'^\s*uses:\s*actions/upload-artifact@')
          retention_line = re.compile(r'retention-days:\s*(\d+)')
          failures = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if not upload.match(line):
                      continue
                  base_indent = len(line) - len(line.lstrip())
                  retention = None
                  for candidate in lines[index + 1:]:
                      stripped = candidate.strip()
                      indent = len(candidate) - len(candidate.lstrip())
                      if stripped.startswith('- ') and indent <= base_indent:
                          break
                      match = retention_line.search(stripped)
                      if match:
                          retention = int(match.group(1))
                          break
                  if retention != 1:
                      failures.append(f'{path}:{index + 1}: retention-days={retention!r}, expected 1')

          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('RETENTION POLICY VERIFIED: every actions/upload-artifact step retains evidence for exactly one day.')

      - name: Publish cleanup success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION: ${{ steps.cleanup.outputs.description }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='Actions storage cleanup' \
            -f description="${DESCRIPTION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish cleanup failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='Actions storage cleanup' \
            -f description='Cleanup or one-day retention policy failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
