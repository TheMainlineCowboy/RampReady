name: Cleanup Actions storage

on:
  push:
    paths:
      - .github/workflows/cleanup-actions-storage.yml
  workflow_run:
    workflows:
      - Build
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: rampready-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Delete obsolete runs, artifacts, and caches, then verify zero remain
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail

          wait_for_quota() {
            local rate_json remaining reset now wait_seconds
            if ! rate_json="$(gh api rate_limit 2>&1)" || ! jq -e . >/dev/null 2>&1 <<<"${rate_json}"; then
              echo "Could not read GitHub API rate limit; waiting 60 seconds: ${rate_json}" >&2
              sleep 60
              return
            fi
            remaining="$(jq -r '.resources.core.remaining // 0' <<<"${rate_json}")"
            reset="$(jq -r '.resources.core.reset // 0' <<<"${rate_json}")"
            now="$(date +%s)"
            echo "GitHub API core quota remaining=${remaining}; reset=${reset}; now=${now}." >&2
            if (( remaining < 75 && reset > now )); then
              wait_seconds=$((reset - now + 15))
              echo "Waiting ${wait_seconds}s for GitHub API quota reset." >&2
              sleep "${wait_seconds}"
            fi
          }

          api_json() {
            local endpoint="$1"
            local paginated="${2:-false}"
            local attempt=1
            local output
            while (( attempt <= 24 )); do
              wait_for_quota
              if [[ "${paginated}" == "true" ]]; then
                output="$(gh api --paginate --slurp "${endpoint}" 2>&1)"
              else
                output="$(gh api "${endpoint}" 2>&1)"
              fi
              if jq -e . >/dev/null 2>&1 <<<"${output}"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "GitHub GET failed for ${endpoint} on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            echo "GitHub GET permanently failed for ${endpoint}." >&2
            return 1
          }

          api_delete() {
            local endpoint="$1"
            local attempt=1
            local output
            while (( attempt <= 24 )); do
              wait_for_quota
              if output="$(gh api --method DELETE "${endpoint}" 2>&1)"; then
                sleep 1
                return 0
              fi
              if [[ "${output}" == *"HTTP 404"* ]]; then
                return 0
              fi
              echo "GitHub DELETE failed for ${endpoint} on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            echo "GitHub DELETE permanently failed for ${endpoint}." >&2
            return 1
          }

          main_response="$(api_json "repos/${GITHUB_REPOSITORY}/commits/main")" || exit 1
          main_sha="$(jq -r '.sha' <<<"${main_response}")"
          pulls_response="$(api_json "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=1&page=1")" || exit 1
          latest_pr_sha="$(jq -r '.[0].head.sha // empty' <<<"${pulls_response}")"
          keep_shas=("${EVENT_SHA}" "${main_sha}" "${latest_pr_sha}")
          keep_json="$(printf '%s\n' "${keep_shas[@]}" | jq -R . | jq -s 'map(select(length > 0)) | unique')"

          echo "Preserving current event, main, and the most recently updated open PR head: ${keep_json}"

          deleted_runs=0
          while true; do
            response="$(api_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)" || exit 1
            mapfile -t run_ids < <(
              jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '
                .[].workflow_runs[]
                | select(.status == "completed")
                | select((.id | tostring) != $current)
                | select(($keep | index(.head_sha)) == null)
                | .id
              ' <<<"${response}"
            )
            if (( ${#run_ids[@]} == 0 )); then
              break
            fi
            for run_id in "${run_ids[@]}"; do
              api_delete "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" || exit 1
              deleted_runs=$((deleted_runs + 1))
            done
            echo "Deleted ${deleted_runs} completed obsolete workflow runs so far."
            sleep 10
          done

          deleted_artifacts=0
          deleted_artifact_bytes=0
          while true; do
            response="$(api_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)" || exit 1
            mapfile -t artifact_rows < <(
              jq -r --argjson keep "${keep_json}" '
                .[].artifacts[]
                | (.workflow_run.head_sha // "") as $sha
                | select(($keep | index($sha)) == null)
                | [.id, (.size_in_bytes // 0)]
                | @tsv
              ' <<<"${response}"
            )
            if (( ${#artifact_rows[@]} == 0 )); then
              break
            fi
            for artifact_row in "${artifact_rows[@]}"; do
              IFS=$'\t' read -r artifact_id artifact_bytes <<<"${artifact_row}"
              api_delete "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" || exit 1
              deleted_artifacts=$((deleted_artifacts + 1))
              deleted_artifact_bytes=$((deleted_artifact_bytes + artifact_bytes))
            done
            echo "Deleted ${deleted_artifacts} orphaned obsolete artifacts (${deleted_artifact_bytes} bytes) so far."
            sleep 5
          done

          deleted_caches=0
          deleted_cache_bytes=0
          while true; do
            response="$(api_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)" || exit 1
            mapfile -t cache_rows < <(jq -r '.[].actions_caches[]? | [.id, (.size_in_bytes // 0)] | @tsv' <<<"${response}")
            if (( ${#cache_rows[@]} == 0 )); then
              break
            fi
            for cache_row in "${cache_rows[@]}"; do
              IFS=$'\t' read -r cache_id cache_bytes <<<"${cache_row}"
              api_delete "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}" || exit 1
              deleted_caches=$((deleted_caches + 1))
              deleted_cache_bytes=$((deleted_cache_bytes + cache_bytes))
            done
            echo "Deleted ${deleted_caches} Actions caches (${deleted_cache_bytes} bytes) so far."
            sleep 5
          done

          run_check="$(api_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)" || exit 1
          remaining_obsolete_runs="$(
            jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '
              [.[].workflow_runs[]
                | select(.status == "completed")
                | select((.id | tostring) != $current)
                | select(($keep | index(.head_sha)) == null)]
              | length
            ' <<<"${run_check}"
          )"
          artifact_check="$(api_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)" || exit 1
          remaining_obsolete_artifacts="$(
            jq -r --argjson keep "${keep_json}" '
              [.[].artifacts[]
                | (.workflow_run.head_sha // "") as $sha
                | select(($keep | index($sha)) == null)]
              | length
            ' <<<"${artifact_check}"
          )"
          remaining_kept_artifacts="$(jq -r '[.[].artifacts[]] | length' <<<"${artifact_check}")"
          remaining_kept_bytes="$(jq -r '[.[].artifacts[].size_in_bytes // 0] | add // 0' <<<"${artifact_check}")"
          cache_check="$(api_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)" || exit 1
          remaining_caches="$(jq -r '[.[].actions_caches[]?] | length' <<<"${cache_check}")"

          echo "Cleanup verified: deleted ${deleted_runs} obsolete runs, ${deleted_artifacts} orphaned artifacts (${deleted_artifact_bytes} bytes), and ${deleted_caches} caches (${deleted_cache_bytes} bytes); remaining obsolete runs=${remaining_obsolete_runs}; remaining obsolete artifacts=${remaining_obsolete_artifacts}; remaining caches=${remaining_caches}; preserved artifacts=${remaining_kept_artifacts} (${remaining_kept_bytes} bytes)."

          if (( remaining_obsolete_runs != 0 || remaining_obsolete_artifacts != 0 || remaining_caches != 0 )); then
            echo "Actions storage cleanup verification failed."
            exit 1
          fi

          deleted_mb=$(( (deleted_artifact_bytes + deleted_cache_bytes + 524287) / 1048576 ))
          echo "description=runs=0 artifacts=0 caches=0; freed ${deleted_mb} MB" >> "${GITHUB_OUTPUT}"

      - name: Check out storage policy source
        if: always()
        uses: actions/checkout@v4

      - name: Enforce one-day artifact retention
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          violations = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if 'uses: actions/upload-artifact@' not in line:
                      continue
                  base_indent = len(line) - len(line.lstrip())
                  retention = None
                  for next_line in lines[index + 1:]:
                      stripped = next_line.strip()
                      indent = len(next_line) - len(next_line.lstrip())
                      if stripped.startswith('- ') and indent <= base_indent:
                          break
                      match = re.search(r'retention-days:\s*(\d+)', stripped)
                      if match:
                          retention = int(match.group(1))
                          break
                  if retention != 1:
                      violations.append(f'{path}:{index + 1}: upload-artifact retention-days={retention!r}, expected 1')

          if violations:
              print('\n'.join(violations))
              sys.exit(1)
          print('Verified every actions/upload-artifact step retains evidence for exactly one day.')

      - name: Publish cleanup success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION: ${{ steps.cleanup.outputs.description }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='Actions storage cleanup' \
            -f description="${DESCRIPTION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish cleanup failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='Actions storage cleanup' \
            -f description='Cleanup or one-day retention policy failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
