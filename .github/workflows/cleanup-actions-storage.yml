name: Cleanup Actions storage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-actions-storage.yml
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read
  deployments: read
  pull-requests: read
  statuses: write

concurrency:
  group: rampready-actions-storage-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Purge obsolete completed Actions storage and runs
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          get_json() {
            local endpoint="$1" paginated="${2:-false}" attempt=1 output
            while (( attempt <= 20 )); do
              if [[ "${paginated}" == "true" ]]; then
                output="$(gh api --paginate --slurp "${endpoint}" 2>&1)" || true
              else
                output="$(gh api "${endpoint}" 2>&1)" || true
              fi
              if jq -e . >/dev/null 2>&1 <<<"${output}"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "GET ${endpoint} failed on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            return 1
          }

          delete_one() {
            local endpoint="$1" attempt=1 output
            while (( attempt <= 20 )); do
              if output="$(gh api --method DELETE "${endpoint}" 2>&1)"; then
                sleep 0.20
                return 0
              fi
              [[ "${output}" == *"HTTP 404"* ]] && return 0
              echo "DELETE ${endpoint} failed on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            return 1
          }

          event_sha="${GITHUB_SHA}"
          current_main_sha=""
          deployed_main_sha=""
          accepted_pr_number=""
          accepted_pr_sha=""
          keep_json='[]'

          refresh_keep() {
            local main_response deployments pulls_pages merged_pages accepted_pr_json latest_deployed_main_sha latest_merged_number
            main_response="$(get_json "repos/${GITHUB_REPOSITORY}/commits/main")"
            current_main_sha="$(jq -r '.sha' <<<"${main_response}")"

            deployments="$(get_json "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100")"
            latest_deployed_main_sha="$(jq -r '[.[] | select((.ref // "") == "main")][0].sha // empty' <<<"${deployments}")"
            if [[ -n "${latest_deployed_main_sha}" ]]; then
              deployed_main_sha="${latest_deployed_main_sha}"
            elif [[ -z "${deployed_main_sha}" ]]; then
              deployed_main_sha="${current_main_sha}"
              echo "No github-pages main deployment was returned; falling back to current main ${current_main_sha}."
            fi

            pulls_pages="$(get_json "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" true)"
            merged_pages="$(get_json "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" true)"
            latest_merged_number="$(
              jq -r '
                [.[][]
                  | select(.merged_at != null)
                  | select((.title // "") | test("maintenance|storage purge|acceptance harness"; "i") | not)
                  | select((.head.ref // "") | test("maintenance|storage|acceptance"; "i") | not)]
                | if length == 0 then 0 else max_by(.number).number end
              ' <<<"${merged_pages}"
            )"
            accepted_pr_json="$(
              jq -c --argjson latest_merged "${latest_merged_number}" '
                [.[][]
                  | select(.number > $latest_merged)
                  | select((.title // "") | test("maintenance|storage purge|acceptance harness"; "i") | not)
                  | select((.head.ref // "") | test("maintenance|storage|acceptance"; "i") | not)]
                | if length == 0 then null else max_by(.number) end
              ' <<<"${pulls_pages}"
            )"
            accepted_pr_number="$(jq -r 'if . == null then empty else .number end' <<<"${accepted_pr_json}")"
            accepted_pr_sha="$(jq -r 'if . == null then empty else .head.sha end' <<<"${accepted_pr_json}")"
            keep_json="$(printf '%s\n' "${event_sha}" "${current_main_sha}" "${deployed_main_sha}" "${accepted_pr_sha}" | jq -R . | jq -s 'map(select(length > 0)) | unique')"
          }

          deleted_artifacts=0
          deleted_artifact_bytes=0
          deleted_caches=0
          deleted_cache_bytes=0
          deleted_runs=0

          # IMPORTANT: cleanup must never cancel or force-cancel an active run.
          # An in-progress PR verifier or Pages release is not disposable storage.
          # Only COMPLETED obsolete runs are eligible for deletion.
          for pass in $(seq 1 20); do
            refresh_keep
            echo "Cleanup pass ${pass}: preserving event=${event_sha}, current main=${current_main_sha}, deployed main=${deployed_main_sha}, accepted PR #${accepted_pr_number:-none}=${accepted_pr_sha:-none}. Active workflow runs are never cancellation targets."
            progress=0

            artifact_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)"
            mapfile -t artifact_rows < <(
              jq -r --argjson keep "${keep_json}" '
                .[] | .artifacts[]
                | (.workflow_run.head_sha // "") as $sha
                | select(($keep | index($sha)) == null)
                | [.id, (.size_in_bytes // 0)] | @tsv
              ' <<<"${artifact_pages}"
            )
            for row in "${artifact_rows[@]}"; do
              IFS=$'\t' read -r id bytes <<<"${row}"
              delete_one "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              deleted_artifacts=$((deleted_artifacts + 1))
              deleted_artifact_bytes=$((deleted_artifact_bytes + bytes))
              progress=1
            done

            cache_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)"
            mapfile -t cache_rows < <(jq -r '.[] | .actions_caches[]? | [.id, (.size_in_bytes // 0)] | @tsv' <<<"${cache_pages}")
            for row in "${cache_rows[@]}"; do
              IFS=$'\t' read -r id bytes <<<"${row}"
              delete_one "repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
              deleted_caches=$((deleted_caches + 1))
              deleted_cache_bytes=$((deleted_cache_bytes + bytes))
              progress=1
            done

            run_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)"
            mapfile -t run_ids < <(
              jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '
                .[] | .workflow_runs[]
                | select((.id | tostring) != $current)
                | select(.status == "completed")
                | (.head_sha // "") as $sha
                | select(($keep | index($sha)) == null)
                | .id
              ' <<<"${run_pages}"
            )
            for id in "${run_ids[@]}"; do
              delete_one "repos/${GITHUB_REPOSITORY}/actions/runs/${id}"
              deleted_runs=$((deleted_runs + 1))
              progress=1
            done

            sleep 5
            refresh_keep
            artifact_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)"
            obsolete_artifacts="$(jq -r --argjson keep "${keep_json}" '[.[] | .artifacts[] | (.workflow_run.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${artifact_pages}")"
            cache_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)"
            remaining_caches="$(jq -r '[.[] | .actions_caches[]?] | length' <<<"${cache_pages}")"
            run_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)"
            obsolete_completed_runs="$(jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '[.[] | .workflow_runs[] | select((.id | tostring) != $current) | select(.status == "completed") | (.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${run_pages}")"

            if (( obsolete_artifacts == 0 && remaining_caches == 0 && obsolete_completed_runs == 0 )); then
              break
            fi
            if (( progress == 0 )); then
              echo "No deletion progress on pass ${pass}; leaving active runs untouched and waiting for completed-storage state to settle."
            fi
          done

          refresh_keep
          artifact_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)"
          obsolete_artifacts="$(jq -r --argjson keep "${keep_json}" '[.[] | .artifacts[] | (.workflow_run.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${artifact_pages}")"
          preserved_artifacts="$(jq -r '[.[] | .artifacts[]] | length' <<<"${artifact_pages}")"
          preserved_bytes="$(jq -r '[.[] | .artifacts[].size_in_bytes // 0] | add // 0' <<<"${artifact_pages}")"
          cache_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)"
          remaining_caches="$(jq -r '[.[] | .actions_caches[]?] | length' <<<"${cache_pages}")"
          run_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)"
          obsolete_completed_runs="$(jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '[.[] | .workflow_runs[] | select((.id | tostring) != $current) | select(.status == "completed") | (.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${run_pages}")"

          echo "STORAGE CLEANUP VERIFIED: accepted PR #${accepted_pr_number:-none}=${accepted_pr_sha:-none}; current main=${current_main_sha}; deployed main=${deployed_main_sha}; deleted artifacts=${deleted_artifacts} (${deleted_artifact_bytes} bytes), caches=${deleted_caches} (${deleted_cache_bytes} bytes), completed runs=${deleted_runs}; remaining obsolete artifacts=${obsolete_artifacts}, caches=${remaining_caches}, completed runs=${obsolete_completed_runs}; active runs untouched; preserved current evidence=${preserved_artifacts} artifacts (${preserved_bytes} bytes)."

          (( obsolete_artifacts == 0 && remaining_caches == 0 && obsolete_completed_runs == 0 ))

          freed_mb=$(( (deleted_artifact_bytes + deleted_cache_bytes + 524287) / 1048576 ))
          echo "description=completed obsolete runs/artifacts=0 caches=0; active runs untouched; freed ${freed_mb} MB" >> "${GITHUB_OUTPUT}"

      - name: Check out main storage policy source
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce one-day artifact retention
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          upload = re.compile(r'^\s*uses:\s*actions/upload-artifact@')
          retention_line = re.compile(r'retention-days:\s*(\d+)')
          failures = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if not upload.match(line):
                      continue
                  base_indent = len(line) - len(line.lstrip())
                  retention = None
                  for candidate in lines[index + 1:]:
                      stripped = candidate.strip()
                      indent = len(candidate) - len(candidate.lstrip())
                      if stripped.startswith('- ') and indent <= base_indent:
                          break
                      match = retention_line.search(stripped)
                      if match:
                          retention = int(match.group(1))
                          break
                  if retention != 1:
                      failures.append(f'{path}:{index + 1}: retention-days={retention!r}, expected 1')

          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('RETENTION POLICY VERIFIED: every actions/upload-artifact step retains evidence for exactly one day.')

      - name: Publish cleanup success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DESCRIPTION: ${{ steps.cleanup.outputs.description }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='Actions storage cleanup' \
            -f description="${DESCRIPTION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish cleanup failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='Actions storage cleanup' \
            -f description='Completed-run/artifact/cache cleanup or one-day retention policy failed; active runs were not cancelled' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
