name: KPHX XP12 Server List Decode

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp12-server-list-decode.yml"

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            reports
          sparse-checkout-cone-mode: false

      - name: Decode installer server-list constants and fetch official list
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y binutils >/dev/null
          mkdir -p /tmp/xp12 reports
          curl -L --fail --retry 4 --show-error             "https://lookup.x-plane.com/_lookup_12_/download/X-Plane12InstallerLinux.zip"             -o /tmp/xp12.zip
          unzip -q /tmp/xp12.zip -d /tmp/xp12
          BIN="$(find /tmp/xp12 -maxdepth 3 -type f -iname '*Installer*Linux*' -print -quit)"
          test -n "$BIN"

          {
            echo "=== rodata 0x142b940..0x142b9d0 ==="
            objdump -s --start-address=0x142b940 --stop-address=0x142b9d0 "$BIN"
            echo
            echo "=== strings near target offsets ==="
            strings -a -t x "$BIN" | awk '
              {
                off=strtonum("0x"$1);
                if (off >= 0x142b900 && off <= 0x142ba40) print
              }'
          } > reports/kphx-xp12-server-list-rodata.txt

          curl -L --fail --retry 4 --show-error             "https://lookup.x-plane.com/_lookup_12_/server_list_12.txt"             -o reports/kphx-xp12-server-list-current.txt
          sha256sum reports/kphx-xp12-server-list-current.txt             > reports/kphx-xp12-server-list-current.sha256

          cat reports/kphx-xp12-server-list-rodata.txt
          echo "=== current official server list ==="
          cat reports/kphx-xp12-server-list-current.txt

      - name: Commit exact server-list evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             reports/kphx-xp12-server-list-rodata.txt             reports/kphx-xp12-server-list-current.txt             reports/kphx-xp12-server-list-current.sha256
          git commit -m "Decode XP12 installer server-list path"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
