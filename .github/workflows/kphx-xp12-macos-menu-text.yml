name: KPHX XP12 macOS Menu Text Bounds

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp12-macos-menu-text.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            reports/kphx-xp12-macos-main-menu.png
          sparse-checkout-cone-mode: false

      - name: Extract visible text bounds from the committed installer screenshot
        shell: bash
        run: |
          set -euo pipefail
          swift - reports/kphx-xp12-macos-main-menu.png <<'SWIFT' > reports/kphx-xp12-macos-menu-text.txt
          import Foundation
          import Vision
          import AppKit

          let args = CommandLine.arguments
          guard args.count >= 2 else { fatalError("missing image path") }
          let url = URL(fileURLWithPath: args[1])
          guard let image = NSImage(contentsOf: url),
                let cg = image.cgImage(forProposedRect: nil, context: nil, hints: nil) else {
              fatalError("unable to load screenshot")
          }
          let width = Double(cg.width)
          let height = Double(cg.height)
          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = true
          request.recognitionLanguages = ["en-US"]
          let handler = VNImageRequestHandler(cgImage: cg, options: [:])
          try handler.perform([request])
          print("image_width=\(Int(width))")
          print("image_height=\(Int(height))")
          for obs in request.results ?? [] {
              guard let top = obs.topCandidates(1).first else { continue }
              let b = obs.boundingBox
              let x = b.origin.x * width
              let yTop = (1.0 - b.origin.y - b.size.height) * height
              let w = b.size.width * width
              let h = b.size.height * height
              let cx = x + w/2.0
              let cy = yTop + h/2.0
              print(String(format:"TEXT|%.1f|%.1f|%.1f|%.1f|%.1f|%.1f|%@", x,yTop,w,h,cx,cy,top.string))
          }
          SWIFT
          cat reports/kphx-xp12-macos-menu-text.txt
          grep -Ei 'Install.*Free.*Demo|Free Demo|Install X-Plane|Continue' reports/kphx-xp12-macos-menu-text.txt

      - name: Commit menu text bounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-xp12-macos-menu-text.txt
          git commit -m "Locate XP12 macOS free-demo button"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
