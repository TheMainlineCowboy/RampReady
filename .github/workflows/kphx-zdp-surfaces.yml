# rerun after current surface interface correction
name: KPHX ZDP Exact Surface Checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-zdp-surfaces.yml"

permissions:
  contents: write

concurrency:
  group: kphx-zdp-surfaces
  cancel-in-progress: false

jobs:
  zdp-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZDP_RELEASE_TAG: kphx-dependency-zdp-1.2.0
      ZDP_ARCHIVE_SHA256: ff86f43460fa672db7833cc9477d879b46769ea1630519a9830e5f9acf5c9a2c
      KPHX_WED_SHA256: 59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install exact conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download locked ZDP 1.2.0 source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${ZDP_RELEASE_TAG}" --pattern 'ZDP_Library-1.2.0.tar.gz' --dir .
          printf '%s  %s\n' "${ZDP_ARCHIVE_SHA256}" "ZDP_Library-1.2.0.tar.gz" | sha256sum --check --strict
          tar -xzf ZDP_Library-1.2.0.tar.gz
          test -f .zdp/library.txt

      - name: Build exact ZDP surface request set
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const index = JSON.parse(fs.readFileSync("reports/kphx-external-resource-index.json","utf8"));
          const resources = (index.resources?.ZDP_Library || []).filter((r) => !r.toLowerCase().endsWith(".obj"));
          if (resources.length !== 49) throw new Error(`Expected 49 ZDP non-OBJ resources, got ${resources.length}`);
          fs.writeFileSync("reports/kphx-zdp-surface-resources.json", JSON.stringify({resources}, null, 2) + "\n");
          NODE
          node scripts/resolve-xplane-library.mjs             .zdp             reports/kphx-zdp-surface-resources.json             reports/kphx-zdp-surface-library-map.json             --virtual-prefix=ZDP_Library

      - name: Materialize exact ZDP surface resources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-kphx-surface-resources.mjs             .zdp             public/models/kphx-full-airport/surface-batches/zdp             --placement-report=public/models/kphx-full-airport/surfaces/surface-network.json             --library-map=reports/kphx-zdp-surface-library-map.json             --include-external-prefixes=ZDP_Library             --skip-package-owned=true

      - name: Verify exact ZDP surface checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const root = "public/models/kphx-full-airport/surface-batches/zdp";
          const manifest = JSON.parse(fs.readFileSync(`${root}/manifest.json`,"utf8"));
          const network = JSON.parse(fs.readFileSync(`${root}/surface-network.json`,"utf8"));
          if (manifest.failures?.length) throw new Error(`ZDP surface failures: ${manifest.failures.length}`);
          if (manifest.packageOwnedResourceCount !== 0) throw new Error("ZDP external-only batch included package-owned resources");
          if (manifest.expectedResolvedExternalResourceCount !== 49) throw new Error(`Expected 49 ZDP surface resources, got ${manifest.expectedResolvedExternalResourceCount}`);
          if (manifest.resolvedExternalResourceCount !== 49) throw new Error(`Materialized ${manifest.resolvedExternalResourceCount}/49 ZDP surface resources`);
          const records = [
            ...network.polygons,
            ...network.lines,
            ...network.drapedOrthophotos,
          ].filter((x) => x.resourcePrefix === "ZDP_Library");
          console.log(JSON.stringify({
            resources: manifest.resolvedExternalResourceCount,
            placements: records.length,
            polygons: network.polygons.filter(x=>x.resourcePrefix==="ZDP_Library").length,
            lines: network.lines.filter(x=>x.resourcePrefix==="ZDP_Library").length,
            drapedOrthophotos: network.drapedOrthophotos.filter(x=>x.resourcePrefix==="ZDP_Library").length,
            status: "PASS"
          }, null, 2));
          NODE

      - name: Commit exact ZDP surface checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/models/kphx-full-airport/surface-batches/zdp             reports/kphx-zdp-surface-resources.json             reports/kphx-zdp-surface-library-map.json
          git commit -m "Move exact ZDP KPHX surface checkpoint"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
