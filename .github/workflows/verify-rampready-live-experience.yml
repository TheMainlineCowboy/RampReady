name: Verify RampReady Live Experience

on:
  workflow_run:
    workflows: ["Deploy RampReady to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA to verify
        required: true
        type: string

permissions:
  contents: read
  statuses: write

env:
  PAGE_URL: https://themainlinecowboy.github.io/RampReady/

jobs:
  verify-live-experience:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact deployed commit
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            expected_sha="${DISPATCH_SHA:-}"
          else
            expected_sha="${DEPLOYED_SHA:-}"
          fi
          test -n "${expected_sha}"
          echo "expected_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"

      - name: Wait for immutable GitHub Pages release marker
        id: marker
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
        run: |
          set +e
          marker_url="${PAGE_URL}releases/${EXPECTED_SHA}.txt"
          mkdir -p live-experience-evidence
          : > live-experience-evidence/release-marker.log

          for attempt in $(seq 1 60); do
            rm -f /tmp/release-marker.txt
            status=$(curl -L -sS \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -o /tmp/release-marker.txt \
              -w '%{http_code}' \
              "${marker_url}?attempt=${attempt}" \
              2>> live-experience-evidence/release-marker.log || true)

            live_sha="not-served"
            if [ "${status}" = "200" ] && [ -s /tmp/release-marker.txt ]; then
              live_sha=$(head -c 128 /tmp/release-marker.txt | tr -d '\r\n')
            fi

            printf 'attempt=%s status=%s marker=%s url=%s\n' \
              "${attempt}" "${status:-curl-error}" "${live_sha}" "${marker_url}" \
              | tee -a live-experience-evidence/release-marker.log

            if [ "${status}" = "200" ] && [ "${live_sha}" = "${EXPECTED_SHA}" ]; then
              summary="Exact immutable Pages release ${EXPECTED_SHA} is live"
              echo "exit_code=0" >> "${GITHUB_OUTPUT}"
              echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
              echo "${summary} after attempt ${attempt}."
              exit 0
            fi
            sleep 5
          done

          summary="Pages deployment succeeded but immutable marker ${EXPECTED_SHA} was not served within five minutes"
          printf '%s\n' "${summary}" | tee live-experience-evidence/error.txt >&2
          echo "exit_code=1" >> "${GITHUB_OUTPUT}"
          echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
          exit 1

      - name: Check out exact deployed commit
        if: steps.marker.outputs.exit_code == '0'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.expected_sha }}

      - name: Set up Node.js
        if: steps.marker.outputs.exit_code == '0'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies and Chromium
        if: steps.marker.outputs.exit_code == '0'
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.53.1
          npx playwright install --with-deps chromium

      - name: Verify live equipment, controls, camera, and aircraft
        if: steps.marker.outputs.exit_code == '0'
        id: browser
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
        run: |
          set +e
          mkdir -p live-experience-evidence
          node scripts/verify-live-experience-browser.cjs
          exit_code=$?
          if [ "${exit_code}" -eq 0 ]; then
            summary="Live equipment, controls, camera and aircraft verified"
          elif [ -s live-experience-evidence/error.txt ]; then
            summary=$(head -n 1 live-experience-evidence/error.txt | tr '\r\n' ' ' | sed 's/[[:space:]]\+/ /g')
          else
            summary="Live browser verifier exited ${exit_code} without an error file"
            printf '%s\n' "${summary}" > live-experience-evidence/error.txt
          fi
          summary=${summary:0:125}
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          echo "summary=${summary}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload live-experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rampready-live-experience-${{ steps.release.outputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-experience-evidence/
          if-no-files-found: warn
          retention-days: 1

      - name: Publish exact live-experience verdict
        if: always()
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          MARKER_EXIT_CODE: ${{ steps.marker.outputs.exit_code }}
          MARKER_SUMMARY: ${{ steps.marker.outputs.summary }}
          BROWSER_EXIT_CODE: ${{ steps.browser.outputs.exit_code }}
          BROWSER_SUMMARY: ${{ steps.browser.outputs.summary }}
        with:
          script: |
            const markerPassed = process.env.MARKER_EXIT_CODE === '0';
            const browserPassed = process.env.BROWSER_EXIT_CODE === '0';
            const passed = markerPassed && browserPassed;
            const description = (
              markerPassed
                ? (process.env.BROWSER_SUMMARY || 'Live browser verification did not complete')
                : (process.env.MARKER_SUMMARY || 'Immutable Pages release marker was not available')
            ).slice(0, 140);
            for (const statusContext of ['production/rampready-live-experience', 'production/crj700-side-views']) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: process.env.EXPECTED_SHA,
                state: passed ? 'success' : 'failure',
                context: statusContext,
                description,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      - name: Enforce live-experience verdict
        if: always()
        shell: bash
        env:
          MARKER_EXIT_CODE: ${{ steps.marker.outputs.exit_code }}
          MARKER_SUMMARY: ${{ steps.marker.outputs.summary }}
          BROWSER_EXIT_CODE: ${{ steps.browser.outputs.exit_code }}
          BROWSER_SUMMARY: ${{ steps.browser.outputs.summary }}
        run: |
          if [ "${MARKER_EXIT_CODE:-1}" -ne 0 ]; then
            echo "${MARKER_SUMMARY:-Immutable Pages release marker verification failed}" >&2
            exit 1
          fi
          if [ "${BROWSER_EXIT_CODE:-1}" -ne 0 ]; then
            echo "${BROWSER_SUMMARY:-Live browser verification failed}" >&2
            exit 1
          fi
