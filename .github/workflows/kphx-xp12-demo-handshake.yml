name: KPHX XP12 Lavapipe Demo Install

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp12-demo-handshake.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/kphx-xp12-demo-handshake.yml
            reports
          sparse-checkout-cone-mode: false

      - name: Install bounded OpenGL UI/network tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y \
            xvfb xauth x11-utils xdotool imagemagick strace \
            xfonts-base xfonts-75dpi xfonts-100dpi fontconfig \
            libgl1-mesa-dri libglx-mesa0 libglx0 libgl1 libglu1-mesa mesa-utils \
            libpangoxft-1.0-0 libgtk2.0-0t64 libxft2 libxi6 libxinerama1 \
            libxrandr2 libxcursor1 libasound2t64 >/dev/null
          sudo fc-cache -f >/dev/null

      - name: Download official XP12 installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xp12-installer /tmp/xp12-demo /tmp/handshake-artifact reports
          curl -L --fail --retry 4 --show-error             "https://lookup.x-plane.com/_lookup_12_/download/X-Plane12InstallerLinux.zip"             -o /tmp/xp12-installer.zip
          unzip -q /tmp/xp12-installer.zip -d /tmp/xp12-installer
          BIN="$(find /tmp/xp12-installer -maxdepth 3 -type f -iname '*Installer*Linux*' -print -quit)"
          test -n "$BIN"
          chmod +x "$BIN"
          echo "$BIN" >/tmp/xp12-bin.txt

      - name: Run exact demo handshake only
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          for i in $(seq 1 20); do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done

          export LIBGL_ALWAYS_SOFTWARE=1
          BIN="$(cat /tmp/xp12-bin.txt)"
          cat >/tmp/xp12.qa <<'QA'
          echo "RAMPREADY_DEMO_HANDSHAKE_START"
          dump buttons
          click "Install a Free Demo of X-Plane"
          wait 8
          dump buttons
          set_installer_destination "/tmp/xp12-demo"
          wait 2
          dump buttons
          click_if_exists "Continue"
          wait 4
          click_if_exists "Continue"
          wait 45
          dump buttons
          echo "RAMPREADY_DEMO_HANDSHAKE_STOP"
          quit
          QA

          BEFORE="$(date +%s)"
          set +e
          timeout 120s strace -ff -tt -s 4096             -e trace=network,openat,creat,rename,write             -o /tmp/xp12-handshake-strace             "$BIN"               --qa_script=/tmp/xp12.qa               --install_numeric=121212               --install_name="X-Plane 12.1.2-r4-0f2fea01"               --no_web_server               >/tmp/installer.out 2>/tmp/installer.err
          RC=$?
          set -e

          import -display :99 -window root /tmp/handshake-artifact/xp12-demo-handshake-screen.png || true

          DEMO_FILE_COUNT="$(find /tmp/xp12-demo -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "demo_file_count=$DEMO_FILE_COUNT"
          cp /home/runner/'X-Plane Installer Log.txt' /tmp/handshake-artifact/xplane-installer-log.txt 2>/dev/null || true

          {
            echo "installer_rc=$RC"
            echo "start_epoch=$BEFORE"
            echo "=== stdout ==="
            cat /tmp/installer.out || true
            echo
            echo "=== stderr relevant ==="
            grep -Ei 'https?://|server|session|auth|download|directory|demo|clearance|tower|desktop|lookup|error|failed' /tmp/installer.err | tail -2000 || true
            echo
            echo "=== installer logs ==="
            find "$HOME" /tmp/xp12-demo /tmp/xp12-installer -maxdepth 6 -type f               \( -iname '*installer*log*' -o -iname 'directory.txt' -o -iname 'server_list*' -o -iname '*.json' -o -iname '*.prf' \)               -print 2>/dev/null | sort
            while IFS= read -r LOG; do
              [ -f "$LOG" ] || continue
              echo "--- $LOG"
              grep -Ei 'https?://|server|session|auth|download|directory|demo|clearance|tower|desktop|lookup|token|checksum|error|failed' "$LOG" | tail -1500 || true
            done < <(find "$HOME" /tmp/xp12-demo /tmp/xp12-installer -maxdepth 6 -type f               \( -iname '*installer*log*' -o -iname 'directory.txt' -o -iname 'server_list*' -o -iname '*.json' -o -iname '*.prf' \)               -print 2>/dev/null | sort)
            echo
            echo "=== created demo files ==="
            find /tmp/xp12-demo -type f -printf '%s %p\n' 2>/dev/null | sort -n | head -500
            echo
            echo "=== network destinations ==="
            cat /tmp/xp12-handshake-strace* 2>/dev/null |               grep -E 'connect\(|sendto\(|recvfrom\(' | tail -3000 || true
          } > reports/kphx-xp12-demo-handshake.txt

          cp reports/kphx-xp12-demo-handshake.txt /tmp/handshake-artifact/
          cp /tmp/installer.out /tmp/handshake-artifact/installer.out || true
          cp /tmp/installer.err /tmp/handshake-artifact/installer.err || true
          cat /tmp/xp12-handshake-strace* > /tmp/handshake-artifact/network-strace.txt 2>/dev/null || true
          cat reports/kphx-xp12-demo-handshake.txt
          if [ "$DEMO_FILE_COUNT" -lt 1 ]; then
            echo "ERROR: XP12 demo installer produced no files."
            cat /home/runner/'X-Plane Installer Log.txt' 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kphx-xp12-demo-handshake
          path: /tmp/handshake-artifact/
          if-no-files-found: error

      - name: Commit demo handshake evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-xp12-demo-handshake.txt
          git commit -m "Capture XP12 authenticated demo handshake"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
