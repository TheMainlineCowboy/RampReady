name: KPHX Full Airport Verification Render

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - "reports/trigger-kphx-verifier-render.txt"

permissions:
  contents: write

concurrency:
  group: kphx-full-airport-verification-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install app and headless browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated KPHX verifier
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/kphx-vite.log 2>&1 &
          echo $! > /tmp/kphx-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kphx-vite.log
          exit 1

      - name: Capture exact KPHX verification render
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const consoleErrors = [];
          page.on("console", (message) => {
            if (message.type() === "error") consoleErrors.push(message.text());
          });
          page.on("pageerror", (error) => consoleErrors.push(String(error)));

          await page.goto("http://127.0.0.1:4173/RampReady/?kphxFullAirport=1", {
            waitUntil: "networkidle",
            timeout: 120000,
          });

          await page.waitForFunction(() => {
            const canvas = document.querySelector("canvas.kphxFullAirportVerifierCanvas");
            return canvas?.dataset?.kphxFullAirportVerifier === "ready";
          }, null, { timeout: 120000 });

          const evidence = await page.evaluate(() => {
            const canvas = document.querySelector("canvas.kphxFullAirportVerifierCanvas");
            return { ...canvas.dataset };
          });

          if (evidence.kphxPackagePlacements !== "655") throw new Error(`Expected 655 placements, got ${evidence.kphxPackagePlacements}`);
          if (evidence.kphxPackageResources !== "96") throw new Error(`Expected 96 resources, got ${evidence.kphxPackageResources}`);
          if (evidence.kphxPackagePolygons !== "13") throw new Error(`Expected 13 package polygons, got ${evidence.kphxPackagePolygons}`);
          if (evidence.kphxSourceVersion !== "1.75.1") throw new Error(`Wrong source version: ${evidence.kphxSourceVersion}`);
          if (consoleErrors.length) throw new Error(`Browser errors: ${consoleErrors.join(" | ")}`);

          await page.screenshot({
            path: "reports/kphx-full-airport-first-render.png",
            fullPage: true,
          });
          fs.writeFileSync(
            "reports/kphx-full-airport-first-render.json",
            JSON.stringify({ capturedAtUtc: new Date().toISOString(), evidence, consoleErrors }, null, 2) + "\n",
          );
          await browser.close();
          NODE

      - name: Commit verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git restore -- package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-full-airport-first-render.png reports/kphx-full-airport-first-render.json
          git commit -m "Capture first exact KPHX full-airport verification render"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
