name: KPHX Full Airport Verification Render

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - "reports/trigger-kphx-verifier-render.txt"

permissions:
  contents: write

concurrency:
  group: kphx-full-airport-verification-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install app and headless browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated KPHX verifier
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/kphx-vite.log 2>&1 &
          echo $! > /tmp/kphx-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kphx-vite.log
          exit 1

      - name: Capture exact KPHX verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const consoleMessages = [];
          const pageErrors = [];
          const failedRequests = [];
          const httpErrors = [];

          page.on("console", (message) => {
            consoleMessages.push({ type: message.type(), text: message.text() });
          });
          page.on("pageerror", (error) => pageErrors.push(String(error)));
          page.on("requestfailed", (request) => {
            failedRequests.push({
              url: request.url(),
              method: request.method(),
              failure: request.failure()?.errorText || "unknown",
            });
          });
          page.on("response", (response) => {
            if (response.status() >= 400) {
              httpErrors.push({ url: response.url(), status: response.status(), statusText: response.statusText() });
            }
          });

          let navigationError = null;
          let waitError = null;
          try {
            await page.goto("http://127.0.0.1:4173/RampReady/?kphxFullAirport=1", {
              waitUntil: "domcontentloaded",
              timeout: 60000,
            });
          } catch (error) {
            navigationError = String(error);
          }

          if (!navigationError) {
            try {
              await page.waitForFunction(() => {
                const canvas = document.querySelector("canvas.kphxFullAirportVerifierCanvas");
                const state = canvas?.dataset?.kphxFullAirportVerifier;
                return state === "ready" || state === "error";
              }, null, { timeout: 60000 });
            } catch (error) {
              waitError = String(error);
            }
          }

          const state = await page.evaluate(() => {
            const canvas = document.querySelector("canvas.kphxFullAirportVerifierCanvas");
            const overlay = [...document.querySelectorAll("div")]
              .map((node) => node.textContent?.trim() || "")
              .find((text) => text.startsWith("KPHX "));
            return {
              canvasPresent: Boolean(canvas),
              dataset: canvas ? { ...canvas.dataset } : {},
              overlayText: overlay || null,
              title: document.title,
              bodyText: document.body?.innerText?.slice(0, 4000) || "",
            };
          }).catch((error) => ({
            canvasPresent: false,
            dataset: {},
            overlayText: null,
            evaluationError: String(error),
          }));

          const payload = {
            capturedAtUtc: new Date().toISOString(),
            navigationError,
            waitError,
            state,
            consoleMessages,
            pageErrors,
            failedRequests,
            httpErrors,
          };

          await page.screenshot({
            path: "reports/kphx-full-airport-first-render.png",
            fullPage: true,
          }).catch((error) => {
            payload.screenshotError = String(error);
          });

          fs.writeFileSync(
            "reports/kphx-full-airport-first-render.json",
            JSON.stringify(payload, null, 2) + "\n",
          );

          const qaPage = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const qaConsoleMessages = [];
          const qaPageErrors = [];
          const qaFailedRequests = [];
          const qaHttpErrors = [];
          qaPage.on("console", (message) => qaConsoleMessages.push({ type: message.type(), text: message.text() }));
          qaPage.on("pageerror", (error) => qaPageErrors.push(String(error)));
          qaPage.on("requestfailed", (request) => qaFailedRequests.push({
            url: request.url(),
            method: request.method(),
            failure: request.failure()?.errorText || "unknown",
          }));
          qaPage.on("response", (response) => {
            if (response.status() >= 400) qaHttpErrors.push({
              url: response.url(),
              status: response.status(),
              statusText: response.statusText(),
            });
          });

          let qaNavigationError = null;
          let qaWaitError = null;
          try {
            await qaPage.goto("http://127.0.0.1:4173/RampReady/?kphxFullAirport=1&kphxQaObjectsOnly=1", {
              waitUntil: "domcontentloaded",
              timeout: 60000,
            });
          } catch (error) {
            qaNavigationError = String(error);
          }
          if (!qaNavigationError) {
            try {
              await qaPage.waitForFunction(() => {
                const canvas = document.querySelector("canvas.kphxFullAirportVerifierCanvas");
                const state = canvas?.dataset?.kphxFullAirportVerifier;
                return state === "ready" || state === "error";
              }, null, { timeout: 60000 });
            } catch (error) {
              qaWaitError = String(error);
            }
          }
          const qaState = await qaPage.evaluate(() => {
            const canvas = document.querySelector("canvas.kphxFullAirportVerifierCanvas");
            return {
              canvasPresent: Boolean(canvas),
              dataset: canvas ? { ...canvas.dataset } : {},
              bodyText: document.body?.innerText?.slice(0, 4000) || "",
            };
          }).catch((error) => ({ canvasPresent: false, dataset: {}, evaluationError: String(error) }));
          const qaPayload = {
            capturedAtUtc: new Date().toISOString(),
            navigationError: qaNavigationError,
            waitError: qaWaitError,
            state: qaState,
            consoleMessages: qaConsoleMessages,
            pageErrors: qaPageErrors,
            failedRequests: qaFailedRequests,
            httpErrors: qaHttpErrors,
          };
          await qaPage.screenshot({
            path: "reports/kphx-t4-objects-only-qa.png",
            fullPage: true,
          }).catch((error) => {
            qaPayload.screenshotError = String(error);
          });
          fs.writeFileSync(
            "reports/kphx-t4-objects-only-qa.json",
            JSON.stringify(qaPayload, null, 2) + "\n",
          );
          await qaPage.close();

          const jetwayPage = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
          const jetwayConsoleMessages = [];
          const jetwayPageErrors = [];
          const jetwayFailedRequests = [];
          const jetwayHttpErrors = [];
          jetwayPage.on("console", (message) => jetwayConsoleMessages.push({ type: message.type(), text: message.text() }));
          jetwayPage.on("pageerror", (error) => jetwayPageErrors.push(String(error)));
          jetwayPage.on("requestfailed", (request) => jetwayFailedRequests.push({
            url: request.url(),
            method: request.method(),
            failure: request.failure()?.errorText || "unknown",
          }));
          jetwayPage.on("response", (response) => {
            if (response.status() >= 400) jetwayHttpErrors.push({
              url: response.url(),
              status: response.status(),
              statusText: response.statusText(),
            });
          });

          let jetwayNavigationError = null;
          let jetwayWaitError = null;
          try {
            await jetwayPage.goto("http://127.0.0.1:4173/RampReady/?kphxT4Jetways=1&batch=ALL", {
              waitUntil: "domcontentloaded",
              timeout: 60000,
            });
          } catch (error) {
            jetwayNavigationError = String(error);
          }
          if (!jetwayNavigationError) {
            try {
              await jetwayPage.waitForFunction(() => {
                const canvas = document.querySelector("canvas.kphxT4JetwayBatchVerifierCanvas");
                const state = canvas?.dataset?.kphxT4JetwayBatchVerifier;
                return state === "ready" || state === "error";
              }, null, { timeout: 60000 });
            } catch (error) {
              jetwayWaitError = String(error);
            }
          }
          const jetwayState = await jetwayPage.evaluate(() => {
            const canvas = document.querySelector("canvas.kphxT4JetwayBatchVerifierCanvas");
            return {
              canvasPresent: Boolean(canvas),
              dataset: canvas ? { ...canvas.dataset } : {},
              bodyText: document.body?.innerText?.slice(0, 4000) || "",
            };
          }).catch((error) => ({ canvasPresent: false, dataset: {}, evaluationError: String(error) }));
          const jetwayPayload = {
            capturedAtUtc: new Date().toISOString(),
            navigationError: jetwayNavigationError,
            waitError: jetwayWaitError,
            state: jetwayState,
            consoleMessages: jetwayConsoleMessages,
            pageErrors: jetwayPageErrors,
            failedRequests: jetwayFailedRequests,
            httpErrors: jetwayHttpErrors,
          };
          await jetwayPage.screenshot({
            path: "reports/kphx-t4-jetways-all-qa.png",
            fullPage: true,
          }).catch((error) => {
            jetwayPayload.screenshotError = String(error);
          });
          fs.writeFileSync(
            "reports/kphx-t4-jetways-all-qa.json",
            JSON.stringify(jetwayPayload, null, 2) + "\n",
          );
          await jetwayPage.close();
          await browser.close();
          NODE

      - name: Commit verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git restore -- package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-full-airport-first-render.png reports/kphx-full-airport-first-render.json reports/kphx-t4-objects-only-qa.png reports/kphx-t4-objects-only-qa.json reports/kphx-t4-jetways-all-qa.png reports/kphx-t4-jetways-all-qa.json
          git commit -m "Capture exact KPHX full-airport verification evidence"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: Enforce KPHX verification result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result = JSON.parse(fs.readFileSync("reports/kphx-full-airport-first-render.json", "utf8"));
          const evidence = result.state?.dataset || {};
          const failures = [];
          if (evidence.kphxFullAirportVerifier !== "ready") failures.push(`verifier state=${evidence.kphxFullAirportVerifier || "missing"}`);
          if (evidence.kphxPackagePlacements !== "1634") failures.push(`placements=${evidence.kphxPackagePlacements || "missing"}`);
          if (evidence.kphxPackageResources !== "147") failures.push(`resources=${evidence.kphxPackageResources || "missing"}`);
          if (evidence.kphxT4MisterxPlacements !== "956") failures.push(`t4MisterxPlacements=${evidence.kphxT4MisterxPlacements || "missing"}`);
          if (evidence.kphxT4MisterxResources !== "50") failures.push(`t4MisterxResources=${evidence.kphxT4MisterxResources || "missing"}`);
          if (evidence.kphxT4CdbPlacements !== "23") failures.push(`t4CdbPlacements=${evidence.kphxT4CdbPlacements || "missing"}`);
          if (evidence.kphxT4CdbResources !== "1") failures.push(`t4CdbResources=${evidence.kphxT4CdbResources || "missing"}`);
          if (evidence.kphxPackagePolygons !== "13") failures.push(`polygons=${evidence.kphxPackagePolygons || "missing"}`);
          if (evidence.kphxSourceVersion !== "1.75.1") failures.push(`version=${evidence.kphxSourceVersion || "missing"}`);
          if (result.navigationError) failures.push(`navigation=${result.navigationError}`);
          if (result.waitError) failures.push(`wait=${result.waitError}`);
          if ((result.pageErrors || []).length) failures.push(`pageErrors=${result.pageErrors.join(" | ")}`);
          if ((result.failedRequests || []).length) failures.push(`failedRequests=${result.failedRequests.length}`);
          if ((result.httpErrors || []).length) failures.push(`httpErrors=${result.httpErrors.length}`);
          const browserErrors=(result.consoleMessages || []).filter((entry)=>entry.type==="error");
          if (browserErrors.length) failures.push(`consoleErrors=${browserErrors.map((entry)=>entry.text).join(" | ")}`);
          if (failures.length) throw new Error(`KPHX verification failed: ${failures.join("; ")}`);
          console.log(JSON.stringify({
            state:evidence.kphxFullAirportVerifier,
            placements:evidence.kphxPackagePlacements,
            resources:evidence.kphxPackageResources,
            t4MisterxPlacements:evidence.kphxT4MisterxPlacements,
            t4CdbPlacements:evidence.kphxT4CdbPlacements,
            polygons:evidence.kphxPackagePolygons,
            lineMeshes:evidence.kphxPackageLineMeshes,
            version:evidence.kphxSourceVersion,
            status:"PASS"
          },null,2));
          NODE

