name: KPHX XP12.1.2 Manifest Probe

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp12-121212-manifest-probe.yml"

concurrency:
  group: kphx-xp12-121212-manifest-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe historical Laminar 12.1.2-r4 manifests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/candidates.txt <<'EOF'
          X-Plane 12.1.2-r4-0f2fea01
          X-Plane 12.1.2-r4-2f2360bd
          X-Plane 12.1.2-r4
          EOF

          found=""
          while IFS= read -r name; do
            enc="$(printf '%s' "$name" | sed 's/ /%20/g')"
            url="https://desktop.x-plane.com/unsecured/$enc/directory.txt.zip"
            echo "=== $name ==="
            code="$(curl -L -sS -o /tmp/directory.txt.zip -w '%{http_code}' "$url" || true)"
            bytes="$(wc -c </tmp/directory.txt.zip 2>/dev/null || echo 0)"
            type="$(file -b /tmp/directory.txt.zip 2>/dev/null || true)"
            printf 'url=%s\nhttp=%s\nbytes=%s\ntype=%s\n\n' "$url" "$code" "$bytes" "$type"
            if [ "$code" = "200" ] && unzip -t /tmp/directory.txt.zip >/dev/null 2>&1; then
              found="$name"
              break
            fi
          done < /tmp/candidates.txt

          if [ -z "$found" ]; then
            echo "RESULT: no tested historical manifest path resolved"
            exit 0
          fi

          rm -rf /tmp/xp12-manifest
          mkdir -p /tmp/xp12-manifest
          unzip -q /tmp/directory.txt.zip -d /tmp/xp12-manifest
          manifest="$(find /tmp/xp12-manifest -type f -name 'directory.txt' -print -quit)"
          test -n "$manifest"
          echo "RESULT: FOUND $found"
          echo "MANIFEST_SHA256=$(sha256sum "$manifest" | awk '{print $1}')"
          echo "MANIFEST_BYTES=$(wc -c <"$manifest")"
          echo
          echo "=== manifest header ==="
          head -60 "$manifest"
          echo
          echo "=== KPHX resource spot checks ==="
          grep -F             -e "Opposing_Flood_Sm.obj"             -e "Jetway_1_solid.fac"             -e "roads.net"             -e "term_building_Levels_01.fac"             "$manifest" | head -80 || true
