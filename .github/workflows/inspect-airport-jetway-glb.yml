name: Inspect Untouched Airport Jetway GLB

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/inspect-airport-jetway-glb.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch only exact GLB from branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github.raw+json"             "/repos/TheMainlineCowboy/RampReady/contents/public/models/airport-jetway/Airport_Jetway.glb?ref=kphx-full-airport-import"             > Airport_Jetway.glb
          test "$(stat -c%s Airport_Jetway.glb)" = "31459796"
          echo "562e3144bd114cc41fad740c69e498d518797e198f301a9c1ea762657c33fed0  Airport_Jetway.glb" | sha256sum --check --strict

      - name: Inspect untouched GLB node hierarchy and transforms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, struct, hashlib
          p="Airport_Jetway.glb"
          b=open(p,"rb").read()
          magic,version,length=struct.unpack_from("<4sII",b,0)
          assert magic==b"glTF" and version==2 and length==len(b)
          off=12
          chunks=[]
          while off < len(b):
              ln,typ=struct.unpack_from("<II",b,off); off+=8
              data=b[off:off+ln]; off+=ln
              chunks.append((typ,data))
          js=next(data for typ,data in chunks if typ==0x4E4F534A)
          gltf=json.loads(js.decode("utf-8").rstrip("\x00 \t\r\n"))
          nodes=gltf.get("nodes",[])
          meshes=gltf.get("meshes",[])
          accessors=gltf.get("accessors",[])
          out={
            "sha256":hashlib.sha256(b).hexdigest(),
            "bytes":len(b),
            "scene":gltf.get("scene"),
            "scenes":gltf.get("scenes",[]),
            "nodes":[],
            "meshes":[{"index":i,"name":m.get("name"),"primitives":len(m.get("primitives",[]))} for i,m in enumerate(meshes)],
          }
          for i,n in enumerate(nodes):
              mesh=n.get("mesh")
              mesh_name=meshes[mesh].get("name") if isinstance(mesh,int) and mesh < len(meshes) else None
              out["nodes"].append({
                "index":i,
                "name":n.get("name"),
                "mesh":mesh,
                "meshName":mesh_name,
                "children":n.get("children",[]),
                "translation":n.get("translation"),
                "rotation":n.get("rotation"),
                "scale":n.get("scale"),
                "matrix":n.get("matrix"),
                "extras":n.get("extras"),
              })
          open("reports/airport-jetway-untouched-glb-structure.json","w").write(json.dumps(out,indent=2)+"\n")
          for n in out["nodes"]:
              print(n)
          PY

      - name: Commit small inspection report
        shell: bash
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -X PUT             "/repos/TheMainlineCowboy/RampReady/contents/reports/airport-jetway-untouched-glb-structure.json"             -f message="Inspect untouched Airport_Jetway ZIP model hierarchy"             -f branch="kphx-full-airport-import"             -f content="$(base64 -w0 reports/airport-jetway-untouched-glb-structure.json)"
        env:
          GH_TOKEN: ${{ github.token }}
