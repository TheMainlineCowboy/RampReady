name: Inspect Untouched Airport Jetway GLB

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/inspect-airport-jetway-glb.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            public/models/airport-jetway/Airport_Jetway.glb
          sparse-checkout-cone-mode: false

      - name: Verify exact ZIP GLB
        shell: bash
        run: |
          set -euo pipefail
          cp public/models/airport-jetway/Airport_Jetway.glb Airport_Jetway.glb
          test "$(stat -c%s Airport_Jetway.glb)" = "31459796"
          echo "562e3144bd114cc41fad740c69e498d518797e198f301a9c1ea762657c33fed0  Airport_Jetway.glb" | sha256sum --check --strict

      - name: Inspect untouched GLB node hierarchy and transforms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, struct, hashlib
          b=open("Airport_Jetway.glb","rb").read()
          magic,version,length=struct.unpack_from("<4sII",b,0)
          assert magic==b"glTF" and version==2 and length==len(b)
          off=12
          chunks=[]
          while off < len(b):
              ln,typ=struct.unpack_from("<II",b,off); off+=8
              data=b[off:off+ln]; off+=ln
              chunks.append((typ,data))
          js=next(data for typ,data in chunks if typ==0x4E4F534A)
          gltf=json.loads(js.decode("utf-8").rstrip("\x00 \t\r\n"))
          nodes=gltf.get("nodes",[]); meshes=gltf.get("meshes",[])
          out={"sha256":hashlib.sha256(b).hexdigest(),"bytes":len(b),"scene":gltf.get("scene"),"scenes":gltf.get("scenes",[]),"nodes":[]}
          for i,n in enumerate(nodes):
              mi=n.get("mesh")
              out["nodes"].append({
                "index":i,"name":n.get("name"),"mesh":mi,
                "meshName":meshes[mi].get("name") if isinstance(mi,int) and mi < len(meshes) else None,
                "children":n.get("children",[]),"translation":n.get("translation"),
                "rotation":n.get("rotation"),"scale":n.get("scale"),"matrix":n.get("matrix")
              })
          open("reports/airport-jetway-untouched-glb-structure.json","w").write(json.dumps(out,indent=2)+"\n")
          for n in out["nodes"]: print(n)
          PY

      - name: Commit small inspection report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/airport-jetway-untouched-glb-structure.json
          git commit -m "Inspect untouched Airport_Jetway ZIP model hierarchy"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
