name: KPHX T3 Exact GLB Inspection

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-kphx-t3-glb-inspection.txt

permissions:
  contents: write

concurrency:
  group: kphx-t3-glb-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Inspect exact Terminal 3 GLB
        shell: bash
        run: |
          set -euo pipefail
          node scripts/inspect-kphx-terminal3a-recovered-glb.mjs

      - name: Commit inspection evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-terminal3a-recovered-glb-inspection.json
          git commit -m "Inspect exact Terminal 3 recovered GLB"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
