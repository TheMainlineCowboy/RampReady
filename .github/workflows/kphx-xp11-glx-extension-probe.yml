name: KPHX XP11 GLX Extension Probe

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp11-glx-extension-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/kphx-xp11-glx-extension-probe.yml
            reports
          sparse-checkout-cone-mode: false

      - name: Probe XP11-required legacy GLX extensions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y xvfb xauth x11-utils libgl1-mesa-dri libglx-mesa0 libglx0 mesa-utils >/dev/null
          Xvfb :99 -screen 0 1280x800x24 +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          for i in $(seq 1 20); do
            if xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          {
            echo "=== renderer ==="
            LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B
            echo
            echo "=== XP11-required SGIX extension matches ==="
            LIBGL_ALWAYS_SOFTWARE=1 glxinfo | grep -E 'GLX_SGIX_fbconfig|GLX_SGIX_pbuffer' || true
            echo
            echo "=== GLX extension block ==="
            LIBGL_ALWAYS_SOFTWARE=1 glxinfo | sed -n '/GLX extensions:/,/OpenGL vendor string:/p' | head -500
            echo
            echo "=== visuals ==="
            LIBGL_ALWAYS_SOFTWARE=1 glxinfo -t | head -300
          } > reports/kphx-xp11-glx-extension-probe.txt
          grep -q 'GLX_SGIX_fbconfig' reports/kphx-xp11-glx-extension-probe.txt || true
          grep -q 'GLX_SGIX_pbuffer' reports/kphx-xp11-glx-extension-probe.txt || true

      - name: Commit extension evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-xp11-glx-extension-probe.txt
          git commit -m "Probe XP11 required SGIX GLX extensions"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
