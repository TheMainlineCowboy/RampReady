# rerun for 108-of-108 Laminar WED preview semantics
# rerun after stock OBJ A-header support
name: Materialize Exact XP11 KPHX Jetways

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/materialize-exact-xp11-kphx-jetways.yml"

permissions:
  contents: write

concurrency:
  group: materialize-exact-xp11-kphx-jetways
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 20

      - name: Verify exact stock source
        shell: bash
        run: |
          set -euo pipefail
          cd source/xplane11-stock/jetway-1-solid
          sha256sum --check --strict SHA256SUMS.txt

      - name: Prepare exact runtime textures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          rm -rf public/models/kphx-xp11-jetways
          mkdir -p public/models/kphx-xp11-jetways/textures
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib, json

          source = Path("source/xplane11-stock/jetway-1-solid/textures")
          out = Path("public/models/kphx-xp11-jetways/textures")
          report = {}
          for src_name, dst_name in [
              ("jetway_1_ALB.dds", "jetway_1_ALB.png"),
              ("jetway_1_LIT.dds", "jetway_1_LIT.png"),
              ("jetway_1_NML.png", "jetway_1_NML.png"),
          ]:
              src = source / src_name
              dst = out / dst_name
              image = Image.open(src).convert("RGBA")
              pixels = image.tobytes()
              pixel_sha = hashlib.sha256(pixels).hexdigest()
              if src.suffix.lower() == ".png":
                  dst.write_bytes(src.read_bytes())
              else:
                  image.save(dst, "PNG", optimize=False)
              check = Image.open(dst).convert("RGBA")
              check_sha = hashlib.sha256(check.tobytes()).hexdigest()
              if check_sha != pixel_sha:
                  raise RuntimeError(f"Pixel mismatch converting {src_name}")
              report[src_name] = {
                  "runtime": dst_name,
                  "width": image.width,
                  "height": image.height,
                  "rgbaPixelSha256": pixel_sha,
                  "sourceContainerSha256": hashlib.sha256(src.read_bytes()).hexdigest(),
                  "runtimeContainerSha256": hashlib.sha256(dst.read_bytes()).hexdigest(),
              }
          Path("public/models/kphx-xp11-jetways/texture-conversion.exact.json").write_text(
              json.dumps({
                  "policy": "decode-source-image-and-losslessly-reencode-container-only;rgba-pixels-must-match",
                  "textures": report,
              }, indent=2) + "\n"
          )
          PY

      - name: Convert exact stock OBJ8 geometry
        shell: bash
        run: |
          set -euo pipefail
          SRC=source/xplane11-stock/jetway-1-solid/Ramp_Equipment/jetways
          OUT=public/models/kphx-xp11-jetways/objects
          mkdir -p "$OUT"
          for OBJ in "$SRC"/*.obj; do
            NAME="$(basename "$OBJ" .obj)"
            DEST="$OUT/$NAME"
            node scripts/convert-kphx-obj8-to-gltf.mjs "$OBJ" "$DEST"               --name="$NAME"               --diffuse="../../textures/jetway_1_ALB.png"               --lit="../../textures/jetway_1_LIT.png"               --normal="../../textures/jetway_1_NML.png"               --normal-scale=1
          done
          test "$(find "$OUT" -mindepth 1 -maxdepth 1 -type d | wc -l)" = "18"

      - name: Compile WED-driven exact facade layout
        shell: bash
        run: |
          set -euo pipefail
          node scripts/compile-xp11-jetway-facade.mjs             source/xplane11-stock/jetway-1-solid/Ramp_Equipment/jetways/jetway_1_solid.fac             public/models/kphx/wed-jetways.exact.json             public/models/kphx-xp11-jetways/layout.exact.json             > reports/kphx-xp11-jetway-compile.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const layout = JSON.parse(fs.readFileSync("public/models/kphx-xp11-jetways/layout.exact.json","utf8"));
          const ready = layout.placements.filter((p) => !p.blockedExactCurve);
          const blocked = layout.placements.filter((p) => p.blockedExactCurve);
          const a1 = layout.placements.find((p) => p.wedObjectId === 104804);
          if (layout.isRing !== false) throw new Error("Stock jetway facade must remain RING 0/open chain");
          if (layout.placements.length !== 108) throw new Error(`Expected 108 stock jetway facades, got ${layout.placements.length}`);
          if (ready.length !== 108) throw new Error(`Expected 108 exact WED-preview facades, got ${ready.length}`);
          if (blocked.length !== 0) throw new Error(`Unexpected blocked facade set: ${blocked.map((p) => p.wedObjectId).join(",")}`);
          const bezierPlacements = layout.placements.filter((p) => (p.sourceBezierEdges || []).length);
          if (bezierPlacements.length !== 1 || bezierPlacements[0].wedObjectId !== 99713) {
            throw new Error("Authored Bezier metadata set changed");
          }
          if (bezierPlacements[0].visualCurvePolicy !== "Laminar-WED-FacadePreview-endpoint-chord-v1") {
            throw new Error("Laminar WED preview curve policy missing");
          }
          if (!a1 || a1.blockedExactCurve) throw new Error("A1 must be exact and unblocked");
          if (a1.nodeCount !== 7 || a1.wallCount !== 6 || a1.edges.length !== 6) throw new Error("A1 open-chain WED contract failed");
          const a1WallTypes = a1.edges.map((e) => e.wallType).join(",");
          if (a1WallTypes !== "Wall 1,Wall 1,Wall 1,Wall 1,Wall 5,Wall 4") {
            throw new Error(`A1 wall sequence mismatch: ${a1WallTypes}`);
          }
          if (!a1.objectInstances.length) throw new Error("A1 has no stock facade object instances");
          console.log(JSON.stringify({
            placementCount: layout.placements.length,
            readyPlacementCount: ready.length,
            blockedCurveWedObjectIds: blocked.map((p) => p.wedObjectId),
            authoredBezierWedObjectIds: layout.placements.filter((p) => (p.sourceBezierEdges || []).length).map((p) => p.wedObjectId),
            a1NodeCount: a1.nodeCount,
            a1WallCount: a1.wallCount,
            a1ObjectInstanceCount: a1.objectInstances.length,
            a1WallTypes,
          }, null, 2));
          NODE

      - name: Commit exact runtime materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/kphx-xp11-jetways reports/kphx-xp11-jetway-compile.json
          git commit -m "Materialize exact XP11 stock KPHX jetways"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
