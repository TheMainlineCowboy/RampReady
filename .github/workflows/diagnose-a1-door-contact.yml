name: Diagnose A1 Door Contact

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-a1-door-contact-diagnostic.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-a1-door-contact
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start RampReady
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/a1-door-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/a1-door-vite.log
          exit 1

      - name: Capture A1 contact state whether pass or fail
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          fs.mkdirSync("reports", { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          const pageErrors = [];
          const consoleErrors = [];
          page.on("pageerror", e => pageErrors.push(String(e)));
          page.on("console", m => { if (m.type() === "error") consoleErrors.push(m.text()); });
          let waitError = null;
          try {
            await page.goto("http://127.0.0.1:4173/RampReady/?inspectionPreset=a1", { waitUntil: "domcontentloaded", timeout: 30000 });
            await page.waitForFunction(() => {
              const d=document.querySelector("canvas.trainerCanvas")?.dataset||{};
              return d.kphxExactLiveT4==="ready" && d.aircraftSource==="user-painted-crj700";
            }, null, { timeout: 30000 });
            const returnToTraining = page.getByRole("button", { name: "Return to training", exact: true });
            if (await returnToTraining.isVisible().catch(() => false)) await returnToTraining.click();
            await page.waitForFunction(() => {
              const d=document.querySelector("canvas.trainerCanvas")?.dataset||{};
              return d.inspectionMode==="training";
            }, null, { timeout: 10000 });
            await page.waitForTimeout(4000);
          } catch (e) {
            waitError=String(e);
          }
          const dataset = await page.evaluate(() => ({ ...(document.querySelector("canvas.trainerCanvas")?.dataset || {}) })).catch(()=>({}));
          const report = {
            schemaVersion: 1,
            status: dataset.a1JetwayDoorContactReady === "true" ? "CONTACT_READY" : "CONTACT_NOT_READY",
            dataset,
            pageErrors,
            consoleErrors,
            waitError,
          };
          fs.writeFileSync("reports/a1-door-contact-diagnostic.json", JSON.stringify(report,null,2)+"\n");
          await page.screenshot({ path:"reports/a1-door-contact-diagnostic.jpg", type:"jpeg", quality:92, fullPage:true }).catch(()=>{});
          await browser.close();
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Commit diagnostic evidence
        if: always()
        run: |
          git restore -- package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/a1-door-contact-diagnostic.json reports/a1-door-contact-diagnostic.jpg 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture A1 door contact diagnostic"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
