name: Materialize A1 Jetway Animation

on:
  push:
    branches: [work/simulator-quality-inspection-pass]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampready-materialize-a1-jetway-animation
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/simulator-quality-inspection-pass
          fetch-depth: 0
      - name: Apply animated A1 departure preparation
        run: node scripts/prepare-a1-jetway-departure-animation.mjs
      - name: Verify exact generated scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(src/environment/sourcePlacedTerminal4Jetways\.js|src/environment/authoredTerminal4Visual\.js|src/components/RampReadyStandupTrainerTerminal4\.jsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected A1 animation files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test -n "$changed"
          node --check src/environment/sourcePlacedTerminal4Jetways.js
          node --check src/environment/authoredTerminal4Visual.js
          grep -q 'a1JetwayController' src/environment/sourcePlacedTerminal4Jetways.js
          grep -q 'Jetway departure sequence active' src/components/RampReadyStandupTrainerTerminal4.jsx
      - name: Commit animated A1 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/environment/sourcePlacedTerminal4Jetways.js src/environment/authoredTerminal4Visual.js src/components/RampReadyStandupTrainerTerminal4.jsx
          git commit -m "Materialize animated A1 jetway departure runtime"
          git push origin HEAD:work/simulator-quality-inspection-pass
