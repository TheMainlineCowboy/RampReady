name: KPHX XP12 Stock FOR NET Chunk

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - "reports/trigger-kphx-xp12-stock-for-net.txt"

permissions:
  contents: write

concurrency:
  group: kphx-xp12-stock-for-net-chunk
  cancel-in-progress: false

jobs:
  stage:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0
          sparse-checkout: |
            scripts/stage-kphx-xp12-lib.py
            reports/kphx-unresolved-dependency-audit.json
            reports/kphx-xp12-121212-directory.txt
            reports/trigger-kphx-xp12-stock-for-net.txt
          sparse-checkout-cone-mode: false

      - name: Download official XP12 installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xp12-installer /tmp/xp12-demo
          curl -L --fail --retry 4 --show-error \
            "https://lookup.x-plane.com/_lookup_12_/download/X-Plane12InstallerMac.zip" \
            -o /tmp/xp12-installer.zip
          ditto -x -k /tmp/xp12-installer.zip /tmp/xp12-installer
          BIN="$(find /tmp/xp12-installer -type f -path '*/Contents/MacOS/*' -iname '*Installer*' -print -quit)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/xp12-installer -type f -path '*/Contents/MacOS/*' -print -quit)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"
          echo "$BIN" >/tmp/xp12-bin.txt

      - name: Install pinned XP12.1.2 demo tree
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(cat /tmp/xp12-bin.txt)"
          cat >/tmp/xp12.qa <<'QA'
          click "Install a Free Demo of X-Plane"
          wait 8
          set_installer_destination "/tmp/xp12-demo"
          wait 2
          click_if_exists "Continue"
          wait 4
          click_if_exists "Continue"
          wait 150
          quit
          QA

          python3 - <<'PY'
          import subprocess
          cmd=[
              open("/tmp/xp12-bin.txt").read().strip(),
              "--lang=en",
              "--qa_script=/tmp/xp12.qa",
              "--install_numeric=121212",
              "--install_name=X-Plane 12.1.2-r4-0f2fea01",
              "--no_web_server",
          ]
          with open("/tmp/xp12-installer.out","wb") as out, open("/tmp/xp12-installer.err","wb") as err:
              try:
                  p=subprocess.run(cmd,stdout=out,stderr=err,timeout=190)
                  rc=p.returncode
              except subprocess.TimeoutExpired:
                  rc=124
          print(f"installer_rc={rc}")
          PY
          count="$(find /tmp/xp12-demo -type f 2>/dev/null | wc -l | tr -d ' ')"
          echo "demo_file_count=$count"
          test "$count" -gt 0

      - name: Stage exact FOR/NET resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/kphx-source/xp12-121212/for-net
          python3 scripts/stage-kphx-xp12-lib.py \
            /tmp/xp12-demo \
            reports/kphx-unresolved-dependency-audit.json \
            reports/kphx-xp12-121212-directory.txt \
            assets/kphx-source/xp12-121212/for-net \
            ".for,.net"
          python3 - <<'PY'
          import json
          p="assets/kphx-source/xp12-121212/for-net/kphx-xp12-lib-chunk-manifest.json"
          j=json.load(open(p))
          assert j["requestedVirtualCount"] == 6, j["requestedVirtualCount"]
          assert j["resolvedVirtualCount"] == 6, j["resolvedVirtualCount"]
          assert j["copiedPhysicalFileCount"] >= 6, j["copiedPhysicalFileCount"]
          print("verified exact XP12.1.2 FOR/NET chunk:", j["resolvedVirtualCount"], "virtual resources,", j["copiedPhysicalFileCount"], "physical files")
          PY

      - name: Commit exact XP12 FOR/NET checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kphx-source/xp12-121212/for-net
          git commit -m "Move exact XP12.1.2 KPHX FOR and NET stock resources"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
