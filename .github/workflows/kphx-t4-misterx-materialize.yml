name: KPHX T4 MisterX Exact Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-t4-misterx-materialize.yml"

permissions:
  contents: write

concurrency:
  group: kphx-t4-misterx-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install exact conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Materialize exact T4 MisterX objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kphx-t4-misterx-runtime
          node scripts/materialize-kphx-full-airport.mjs \
            . \
            .kphx-t4-misterx-runtime \
            --placement-report=reports/kphx-t4-misterx-wed-placements.json \
            --library-map=reports/kphx-t4-misterx-library-map.json \
            --include-external-prefixes=MisterX_Library \
            --batch-name=t4-misterx

      - name: Verify MisterX source contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync(".kphx-t4-misterx-runtime/manifest.json", "utf8"));
          if (manifest.failures?.length) throw new Error(`MisterX materialization failures: ${manifest.failures.length}`);
          if (manifest.resolvedExternal.materializedPlacementCount !== 956) {
            throw new Error(`Expected 956 MisterX placements, got ${manifest.resolvedExternal.materializedPlacementCount}`);
          }
          if (manifest.resolvedExternal.expectedUniqueResourceCount !== 50
              || manifest.resolvedExternal.materializedUniqueResourceCount !== 50) {
            throw new Error(`Expected 50 MisterX resources, got expected=${manifest.resolvedExternal.expectedUniqueResourceCount} materialized=${manifest.resolvedExternal.materializedUniqueResourceCount}`);
          }
          console.log("KPHX T4 MisterX exact materialization contract passed.");
          NODE

      - name: Install MisterX runtime batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models/kphx-full-airport/external public/models/kphx-full-airport/batches
          cp -a .kphx-t4-misterx-runtime/external/. public/models/kphx-full-airport/external/
          cp .kphx-t4-misterx-runtime/manifest.json public/models/kphx-full-airport/batches/t4-misterx.manifest.json

      - name: Commit exact MisterX runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/kphx-full-airport/external/MisterX_Library \
            public/models/kphx-full-airport/batches/t4-misterx.manifest.json \
            reports/kphx-full-airport-materialization-t4-misterx.json
          if git diff --cached --quiet; then
            echo "Exact T4 MisterX runtime already current."
            exit 0
          fi
          git commit -m "Materialize exact T4 MisterX runtime"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

# rerun after exact A320/shadow/conditional fixes

# rerun after exact ramps/people/vans/construction staging

# rerun after draped-only and keyframed GroundTraffic fixes
