name: Materialize Exact Manager Kubota

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-exact-manager-kubota.txt

permissions:
  contents: write

concurrency:
  group: materialize-exact-manager-kubota
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Download exact full-fidelity Kubota
        shell: bash
        env:
          KUBOTA_URL: 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-c988-8209-ad13-4001ad9a7d4c/raw?se=2026-09-23T18%3A51%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=f0885508-330c-591f-9905-159d047d9f01&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T18%3A15%3A58Z&ske=2026-09-24T18%3A15%3A58Z&sks=b&skv=2026-02-06&sig=UkBBokqDFIsI1YXKFiQqE0ZjhBc8b4cg6OoWwcACB7I%3D'
        run: |
          set -euo pipefail
          mkdir -p public/models/manager-kubota reports
          curl -L --fail --retry 3 --retry-delay 2 "$KUBOTA_URL" -o /tmp/RampReady-manager-Kubota-exact.glb
          test "$(stat -c%s /tmp/RampReady-manager-Kubota-exact.glb)" = "23988388"
          echo "726fdcb3511e6d52990da11118be4ca8a8b73c5d5c8f5bde4f934131e3c31b7d  /tmp/RampReady-manager-Kubota-exact.glb" | sha256sum -c -
          mv /tmp/RampReady-manager-Kubota-exact.glb public/models/manager-kubota/RampReady-manager-Kubota-exact.glb
          cat > reports/manager-kubota-exact-verification.json <<'JSON'
          {
            "schemaVersion": 1,
            "status": "PASS",
            "authority": "user-supplied RampReady-manager-Kubota-exact.glb",
            "runtimePath": "/models/manager-kubota/RampReady-manager-Kubota-exact.glb",
            "bytes": 23988388,
            "sha256": "726fdcb3511e6d52990da11118be4ca8a8b73c5d5c8f5bde4f934131e3c31b7d",
            "substitution": false,
            "simplified": false
          }
          JSON

      - name: Commit exact Kubota
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/manager-kubota/RampReady-manager-Kubota-exact.glb reports/manager-kubota-exact-verification.json
          git commit -m "Materialize exact full-fidelity manager Kubota"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
