name: Materialize Jetway V6 Contract

on:
  push:
    branches: [work/simulator-quality-inspection-pass]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampready-materialize-jetway-v6-contract
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/simulator-quality-inspection-pass
          fetch-depth: 0

      - name: Update visual v6 source contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const kphxPath = "scripts/verify-kphx-v181-source-contract.mjs";
          let kphx = fs.readFileSync(kphxPath, "utf8");
          kphx = kphx.replace(
            '  "M1DGJETWAY exact recovered original freeware texture and lightmap",\n  "usesExactRecoveredJetwayTexture",',
            '  "M1DGJETWAY exact recovered original freeware atlas regions and lightmap",\n  "usesExactRecoveredJetwayTexture",\n  "jetwayTextureMappingAuthority",\n  "exactJetwayAtlasRegions",\n  "THREE.ClampToEdgeWrapping",\n  "const facadeRampOffset = 0.95",\n  "scale: [6.4, 3.36, 0.68]",',
          );
          kphx = kphx.replace(
            '  "scale: [2.24, 2.12, wallConnectorLength]",\n]) {',
            '  "scale: [2.24, 2.12, wallConnectorLength]",\n  "map.repeat.set(repeatX, repeatY)",\n  "map.wrapS = map.wrapT = THREE.RepeatWrapping",\n  "scale: [5.72, 2.58, 0.42]",\n]) {',
          );
          kphx = kphx.replace(
            "source-scale jetway textures and articulation contract, source-qualified service bays",
            "source-atlas-region jetway textures and articulation contract, full-height facade closures, source-qualified service bays",
          );
          for (const token of [
            "M1DGJETWAY exact recovered original freeware atlas regions and lightmap",
            "jetwayTextureMappingAuthority",
            "exactJetwayAtlasRegions",
            "THREE.ClampToEdgeWrapping",
            "const facadeRampOffset = 0.95",
            "scale: [6.4, 3.36, 0.68]",
            "map.repeat.set(repeatX, repeatY)",
          ]) if (!kphx.includes(token)) throw new Error(`KPHX visual v6 contract missing ${token}`);
          fs.writeFileSync(kphxPath, kphx, "utf8");

          const jetwayPath = "scripts/verify-terminal4-jetway-crj-v5.mjs";
          let jetway = fs.readFileSync(jetwayPath, "utf8");
          jetway = jetway.replace(
            '    if (!command.includes("prepare-terminal4-jetway-crj-v5.mjs")) throw new Error(`${scriptName} does not run the source-scale jetway protection pass`);',
            '    if (!command.includes("prepare-terminal4-jetway-crj-v5.mjs")) throw new Error(`${scriptName} does not run the source-scale jetway protection pass`);\n    if (!command.includes("prepare-terminal4-jetway-visual-v6.mjs")) throw new Error(`${scriptName} does not run the non-striped source-atlas visual pass`);',
          );
          jetway = jetway.replace(
            '  "group.userData.requiredPrePushSequence",\n]);',
            '  "group.userData.requiredPrePushSequence",\n  "exactJetwayAtlasRegions",\n  "group.userData.jetwayTextureMappingAuthority",\n  "const facadeRampOffset = 0.95",\n  "scale: [6.4, 3.36, 0.68]",\n]);',
          );
          jetway = jetway.replace(
            '  "scale: [2.24, 2.12, wallConnectorLength]",\n]) if',
            '  "scale: [2.24, 2.12, wallConnectorLength]",\n  "map.repeat.set(repeatX, repeatY)",\n  "map.wrapS = map.wrapT = THREE.RepeatWrapping",\n  "scale: [5.72, 2.58, 0.42]",\n]) if',
          );
          jetway = jetway.replace(
            "exact textures and placement remain active, fallback geometry is disclosed",
            "exact atlas regions and placement remain active without whole-sheet repetition, full-height facade closures are enforced, fallback geometry is disclosed",
          );
          for (const token of [
            "prepare-terminal4-jetway-visual-v6.mjs",
            "exactJetwayAtlasRegions",
            "group.userData.jetwayTextureMappingAuthority",
            "const facadeRampOffset = 0.95",
            "scale: [6.4, 3.36, 0.68]",
            "map.repeat.set(repeatX, repeatY)",
          ]) if (!jetway.includes(token)) throw new Error(`Terminal 4 visual v6 contract missing ${token}`);
          fs.writeFileSync(jetwayPath, jetway, "utf8");
          NODE

      - name: Verify exact contract scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'scripts/verify-kphx-v181-source-contract.mjs\nscripts/verify-terminal4-jetway-crj-v5.mjs'
          test "$changed" = "$expected"
          node --check scripts/verify-kphx-v181-source-contract.mjs
          node --check scripts/verify-terminal4-jetway-crj-v5.mjs

      - name: Commit visual v6 contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-kphx-v181-source-contract.mjs scripts/verify-terminal4-jetway-crj-v5.mjs
          git commit -m "Enforce non-striped jetway and facade visual contract"
          git push origin HEAD:work/simulator-quality-inspection-pass
