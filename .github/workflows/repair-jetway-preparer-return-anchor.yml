name: Repair jetway preparer return anchor

on:
  push:
    branches:
      - fix/live-experience-cdp-capture
    paths:
      - .github/workflows/repair-jetway-preparer-return-anchor.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-experience-cdp-capture
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Make bridge-axis return migration preserve measured radius
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/prepare-terminal4-jetway-rendered-cleanup-v1.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''const oldOffsetReturn = `    horizontalMagnitude,\\n    authority: ROOT_OFFSET_AUTHORITY,`;'''
          new = '''const oldOffsetReturn = `    horizontalMagnitude,\\n    radiusMeters,\\n    authority: ROOT_OFFSET_AUTHORITY,`;'''
          old2 = '''const measuredOffsetReturn = `    horizontalMagnitude,\\n    bridgeAxisHeadingRadians,\\n    authority: ROOT_OFFSET_AUTHORITY,`;'''
          new2 = '''const measuredOffsetReturn = `    horizontalMagnitude,\\n    radiusMeters,\\n    bridgeAxisHeadingRadians,\\n    authority: ROOT_OFFSET_AUTHORITY,`;'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('old offset-return anchor contract was not found')
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit('measured offset-return anchor contract was not found')
          path.write_text(text, encoding='utf-8')
      - name: Commit preparer repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/prepare-terminal4-jetway-rendered-cleanup-v1.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(jetway): preserve measured radius in cleanup preparer'
          git push origin HEAD:fix/live-experience-cdp-capture
