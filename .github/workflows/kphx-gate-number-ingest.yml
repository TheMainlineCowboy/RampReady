name: KPHX Exact Gate Number Ingest

on:
  workflow_dispatch:
  push:
    branches:
      - feat/source-kphx-airport
    paths:
      - '.github/workflows/kphx-gate-number-ingest.yml'
      - 'tools/kphx/combine-draped-obj-group-to-glb.py'
      - 'assets/kphx-source/exact-gate-numbers.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kphx-gate-number-ingest.yml'
      - 'tools/kphx/combine-draped-obj-group-to-glb.py'
      - 'assets/kphx-source/exact-gate-numbers.json'
      - 'public/models/kphx/GateNumbers.exact.glb'

permissions:
  contents: write

jobs:
  ingest-gate-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-kphx-airport
          fetch-depth: 0

      - name: Install deterministic converter dependency
        run: python -m pip install --disable-pip-version-check pillow==12.3.0

      - name: Download exact gate-number source from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kphx-drive/GateNumbers public/models/kphx
          download() {
            local id="$1" out="$2"
            curl -L --fail --silent --show-error "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" -o "$out"
          }
          download '1jbkZQg3rA4Te0iCOGP6B-BCJqMvRIplV' '.kphx-drive/GateNumbers/GateNumbers.dds'
          download '1RdAwROEMUrZbiPRH8_cCiQ-8uxmfLpnE' '.kphx-drive/GateNumbers/A.obj'
          download '1am0-oag8OnfSZdTzbL8xuw8cvN23P38t' '.kphx-drive/GateNumbers/B.obj'
          download '1VrZBMm2ZJ2qqSvWk_2GFz4O9D8IuivOr' '.kphx-drive/GateNumbers/D.obj'
          download '15gKPHEgbWYpiOTHQQeYCljsIUQnJSA4R' '.kphx-drive/GateNumbers/Empty.obj'
          download '16ZsoJblpZ3INnMotNBo68eoOHU9ZWg4N' '.kphx-drive/GateNumbers/EmptyLarge.obj'
          download '1ejehFHAFRmJRKV8yR58_ePM616lLWnwg' '.kphx-drive/GateNumbers/single0.obj'
          download '1Rwz9V3_KlUDG3c3rKsobxcWVUOChCNF-' '.kphx-drive/GateNumbers/single1.obj'
          download '1W9nEoFQHYAwYUjXsVypgEgW61HJqIhjW' '.kphx-drive/GateNumbers/single2.obj'
          download '1MsWSSK2whHKIXfL7qRD1wrroh87WEGz6' '.kphx-drive/GateNumbers/single3.obj'
          download '1PcWMD7vs51On-xOcw9gUEm5iHSaJsDIk' '.kphx-drive/GateNumbers/single4.obj'
          download '1rsvjaHA7-b93PgzyrLNQ84Jg8yVObJM5' '.kphx-drive/GateNumbers/single5.obj'
          download '1YbxD6iOIvYdLOSnc-5Y28pojDyaDngEV' '.kphx-drive/GateNumbers/single6.obj'
          download '1zhBEA6x2XyJgUP0HDEwbzPwu8dZpejL2' '.kphx-drive/GateNumbers/single7.obj'
          download '1bO_-ysZ67KhNILYG3Z9jc8MxshLcbopk' '.kphx-drive/GateNumbers/single8.obj'
          download '1v2NrIMmFGu7C_WYbOIjScZoE5msbKhnp' '.kphx-drive/GateNumbers/single9.obj'

          echo 'ef8788656770b336ec1a9a30533c8d2242fb062881b0d2d29a786d2b3961f6ac  .kphx-drive/GateNumbers/GateNumbers.dds' | sha256sum --check --strict
          echo '909f4f65b9debb03ab653ea3655bbc00a26185732d654835a66e8e3247988846  .kphx-drive/GateNumbers/A.obj' | sha256sum --check --strict
          echo 'b5bee8eb2e5744b0834c20015a14f046041d6af976c23324953999b644bcba73  .kphx-drive/GateNumbers/B.obj' | sha256sum --check --strict
          echo 'ced82cb71cc2d1fcd9e890fe1dc8882d83df630589818177e8241a1f00c2ce9f  .kphx-drive/GateNumbers/D.obj' | sha256sum --check --strict
          echo 'ab43c96ab89dad899a05a6531e49f36715f07febcc0a355eb508c5943b5935f2  .kphx-drive/GateNumbers/Empty.obj' | sha256sum --check --strict
          echo '2e66224a0eab4b3b24567236265fc589ad4d8e81e0496a5ea66e246a936e1485  .kphx-drive/GateNumbers/EmptyLarge.obj' | sha256sum --check --strict
          echo '2db84dc5d36712d96da0a4723c41dcdade2abf28b819b79c93aea5f10e0adc30  .kphx-drive/GateNumbers/single0.obj' | sha256sum --check --strict
          echo 'd6921290be4c25b5bb368af1ab79c37466b8de1d9c56db65e3b0c5a3e7460c91  .kphx-drive/GateNumbers/single1.obj' | sha256sum --check --strict
          echo 'b8e28d2f1b9a8bcc4ecd239a19e818263b1187d54cb3afea45b776e142ca50b8  .kphx-drive/GateNumbers/single2.obj' | sha256sum --check --strict
          echo '5460ebbf72b8c10dd5bde7cf2fa2bf7fd39703ae1406dcc12833260c13751e96  .kphx-drive/GateNumbers/single3.obj' | sha256sum --check --strict
          echo '85291de86afd1b695057bfee2fefaeb879ac59697d0ab61b146eba2caad7dd8d  .kphx-drive/GateNumbers/single4.obj' | sha256sum --check --strict
          echo 'a183427eeb73125bd87b3008b86b8b36a9c3f9cbb33f8a1536e65f9654dbcca1  .kphx-drive/GateNumbers/single5.obj' | sha256sum --check --strict
          echo 'e0e296809a5da3888f3c47ce7b5ffc7a1666625d53d0616882050b3232589e12  .kphx-drive/GateNumbers/single6.obj' | sha256sum --check --strict
          echo '47f732fb1d963aadaecf9afd9ba2169e6bb5a27c74fe4a1667c573005027f18a  .kphx-drive/GateNumbers/single7.obj' | sha256sum --check --strict
          echo '8a61bde66dce6212e663df9fe17b5c47b774a5cd1e329d8f89477a209316b052  .kphx-drive/GateNumbers/single8.obj' | sha256sum --check --strict
          echo '7cc3be565a405c01434492fb1022241c386d408c57f3b6a1812ed4d9fa93fa1c  .kphx-drive/GateNumbers/single9.obj' | sha256sum --check --strict

      - name: Package exact draped gate-number meshes with shared atlas
        shell: bash
        run: |
          python tools/kphx/combine-draped-obj-group-to-glb.py \
            --texture .kphx-drive/GateNumbers/GateNumbers.dds \
            --resource-prefix GateNumbers \
            --out public/models/kphx/GateNumbers.exact.glb \
            .kphx-drive/GateNumbers/A.obj \
            .kphx-drive/GateNumbers/B.obj \
            .kphx-drive/GateNumbers/D.obj \
            .kphx-drive/GateNumbers/Empty.obj \
            .kphx-drive/GateNumbers/EmptyLarge.obj \
            .kphx-drive/GateNumbers/single0.obj \
            .kphx-drive/GateNumbers/single1.obj \
            .kphx-drive/GateNumbers/single2.obj \
            .kphx-drive/GateNumbers/single3.obj \
            .kphx-drive/GateNumbers/single4.obj \
            .kphx-drive/GateNumbers/single5.obj \
            .kphx-drive/GateNumbers/single6.obj \
            .kphx-drive/GateNumbers/single7.obj \
            .kphx-drive/GateNumbers/single8.obj \
            .kphx-drive/GateNumbers/single9.obj

      - name: Verify exact gate-number runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/models/kphx/GateNumbers.exact.glb)" -eq 687456
          echo 'b0fc28b14882935685bbb72a4e10a5c649a5c493c9ca187b8b25457e70357c07  public/models/kphx/GateNumbers.exact.glb' | sha256sum --check --strict

      - name: Commit exact gate-number runtime asset to private source-airport branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/models/kphx/GateNumbers.exact.glb)" ]; then
            echo 'Exact gate-number runtime asset is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/kphx/GateNumbers.exact.glb
          git commit -m 'Materialize exact KPHX gate-number meshes'
          git pull --rebase origin feat/source-kphx-airport
          git push origin HEAD:feat/source-kphx-airport
