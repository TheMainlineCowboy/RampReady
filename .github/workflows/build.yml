name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampready-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-draft-visuals:
    if: github.event_name == 'pull_request' && github.head_ref == 'work/simulator-quality-inspection-pass' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: work/simulator-quality-inspection-pass
          fetch-depth: 0

      - name: Materialize facade v7 and mobile HUD
        run: |
          node scripts/prepare-terminal4-facade-visual-v7.mjs
          node scripts/prepare-mobile-inspection-hud.mjs

      - name: Update stable browser evidence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const crjPath = "tests/browser/crj700-runtime.spec.js";
          let crj = fs.readFileSync(crjPath, "utf8");
          crj = crj.replaceAll("{ timeout: 40_000, intervals:", "{ timeout: 90_000, intervals:");
          if (!crj.includes("layout.title?.text")) {
            const layoutAnchor = '      inspectionToggle: rect(".rr-inspection-toggle"),\n    };';
            const layoutReplacement = '      inspectionToggle: rect(".rr-inspection-toggle"),\n      title: (() => {\n        const element = document.querySelector(".rr-hud h1");\n        return element ? { text: element.textContent, clientWidth: element.clientWidth, scrollWidth: element.scrollWidth } : null;\n      })(),\n    };';
            if (!crj.includes(layoutAnchor)) throw new Error("CRJ mobile title layout anchor is missing");
            crj = crj.replace(layoutAnchor, layoutReplacement);
            const assertionAnchor = '  expect(layout.slider.width).toBeGreaterThanOrEqual(120);\n  const before';
            const assertionReplacement = '  expect(layout.slider.width).toBeGreaterThanOrEqual(120);\n  expect(layout.title?.text).toBe("Complete visual equipment check");\n  expect(layout.title?.scrollWidth).toBeLessThanOrEqual((layout.title?.clientWidth || 0) + 1);\n  const before';
            if (!crj.includes(assertionAnchor)) throw new Error("CRJ mobile title assertion anchor is missing");
            crj = crj.replace(assertionAnchor, assertionReplacement);
          }
          for (const token of ["timeout: 90_000", "layout.title?.text", "Complete visual equipment check"]) {
            if (!crj.includes(token)) throw new Error(`CRJ browser evidence missing ${token}`);
          }
          fs.writeFileSync(crjPath, crj, "utf8");

          const kphxPath = "tests/browser/kphx-ground-runtime.spec.js";
          let kphx = fs.readFileSync(kphxPath, "utf8");
          kphx = kphx.replace('test.setTimeout(210_000);', 'test.setTimeout(300_000);');
          const captureAnchor = `  await page.addStyleTag({
    content: \`
      .rr-hud, .rr-metrics, .rr-score-float, .rr-guidance, .rr-diagnostics,
      .rr-steer, .rr-throttle { display: none !important; }
      .rr-shell, .rr-scene, canvas { width: 100vw !important; height: 100vh !important; }
    \`,
  });`;
          if (!kphx.includes("PHX evidence framing")) {
            const framedCapture = `  await page.evaluate(() => {
    const canvas = document.querySelector("canvas.trainerCanvas");
    if (!canvas) throw new Error("Three.js canvas is missing for PHX evidence framing");
    canvas.dispatchEvent(new WheelEvent("wheel", { deltaY: 1600, bubbles: true, cancelable: true }));
    const box = canvas.getBoundingClientRect();
    const x = box.left + box.width / 2;
    const y = box.top + box.height / 2;
    const held = { bubbles: true, cancelable: true, pointerId: 81, pointerType: "mouse", button: 0, buttons: 1 };
    canvas.dispatchEvent(new PointerEvent("pointerdown", { ...held, clientX: x, clientY: y }));
    window.dispatchEvent(new PointerEvent("pointermove", { ...held, clientX: x + 180, clientY: y - 25 }));
    window.dispatchEvent(new PointerEvent("pointerup", { ...held, clientX: x + 180, clientY: y - 25, buttons: 0 }));
  });
  await page.waitForTimeout(1_000);
${captureAnchor}`;
            if (!kphx.includes(captureAnchor)) throw new Error("KPHX evidence framing anchor is missing");
            kphx = kphx.replace(captureAnchor, framedCapture);
          }
          for (const token of ["test.setTimeout(300_000)", "PHX evidence framing", "deltaY: 1600"]) {
            if (!kphx.includes(token)) throw new Error(`KPHX browser evidence missing ${token}`);
          }
          fs.writeFileSync(kphxPath, kphx, "utf8");
          NODE

      - name: Verify exact generated scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          expected=$'src/components/RampReadyTrainer.css\nsrc/environment/sourcePlacedTerminal4Jetways.js\ntests/browser/crj700-runtime.spec.js\ntests/browser/kphx-ground-runtime.spec.js'
          test "$changed" = "$expected"
          node --check src/environment/sourcePlacedTerminal4Jetways.js
          node --check tests/browser/crj700-runtime.spec.js
          node --check tests/browser/kphx-ground-runtime.spec.js
          grep -q 'facadeOuterWallFit' src/environment/sourcePlacedTerminal4Jetways.js
          grep -q 'mobile inspection HUD title polish' src/components/RampReadyTrainer.css

      - name: Commit exact generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RampReadyTrainer.css src/environment/sourcePlacedTerminal4Jetways.js tests/browser/crj700-runtime.spec.js tests/browser/kphx-ground-runtime.spec.js
          git commit -m "Materialize outer-plane facade and stable visual evidence"
          git push origin HEAD:work/simulator-quality-inspection-pass

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and verify production output
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee rampready-build.log

      - name: Capture tracked source mutation diff
        if: always()
        shell: bash
        run: git diff --binary -- . ':!dist' > rampready-source-diff.patch

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rampready-build-diagnostics-${{ github.sha }}
          path: |
            rampready-build.log
            rampready-source-diff.patch
          if-no-files-found: warn
          retention-days: 1

      - name: Verify build did not mutate tracked source
        if: always()
        shell: bash
        run: |
          if ! git diff --exit-code -- . ':!dist'; then
            echo "Production build left tracked repository files modified."
            echo "Runtime preparation must restore the trainer and all verification inputs even after failure."
            echo "Download rampready-build-diagnostics-${{ github.sha }} for the exact source diff."
            exit 1
          fi

      - name: Verify deploy artifact
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -print -quit)"

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: rampready-production-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
