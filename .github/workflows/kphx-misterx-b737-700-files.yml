name: KPHX MisterX Boeing 737-700 Exact Files

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-misterx-b737-700-files.yml"

permissions:
  contents: write

concurrency:
  group: kphx-misterx-b737-700-files
  cancel-in-progress: false

jobs:
  move-files:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Move exact Southwest 737-700 source files
        shell: bash
        run: |
          set -euo pipefail
          DIR="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Aircraft/Boeing_737_700"
          mkdir -p "$DIR"
          gdown "https://drive.google.com/uc?id=1UOJppbSUJYYR-1964pDxSrbUZp6WHJJA" -O "$DIR/Southwest_Airlines.dds"
          gdown "https://drive.google.com/uc?id=19PphBppuPH8RTyFhrxzHzOX0xmBKBzYU" -O "$DIR/Southwest_Airlines_LIT.png"
          gdown "https://drive.google.com/uc?id=1SlGQviy3GTkY-bggqBC3w-6pkMF0Xvxh" -O "$DIR/Normal.png"
          gdown "https://drive.google.com/uc?id=1JighL9iXjzOvlRIeYaFBg0_EAqBNkqBj" -O "$DIR/Southwest_Airlines.obj"
          sha256sum             "$DIR/Southwest_Airlines.dds"             "$DIR/Southwest_Airlines_LIT.png"             "$DIR/Normal.png"             "$DIR/Southwest_Airlines.obj"             > assets/kphx-source/dependencies/MisterX_Library_2.0c/B737-700-SOUTHWEST-SHA256SUMS.txt

      - name: Commit exact 737-700 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Aircraft/Boeing_737_700             assets/kphx-source/dependencies/MisterX_Library_2.0c/B737-700-SOUTHWEST-SHA256SUMS.txt
          git commit -m "Move exact MisterX Southwest Boeing 737-700 source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
