          DIR="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Aircraft/Boeing_737_800"
          gdown "https://drive.google.com/uc?id=1cjw_RCL7FQlCklMQacCKkiL0BMoQqwsA" -O "$DIR/Southwest_Airlines.dds"
          gdown "https://drive.google.com/uc?id=1Yh-fgm5OTY5E_8NN5A-Y4P07Ghpl4E3F" -O "$DIR/Southwest_Airlines_LIT.png"
          gdown "https://drive.google.com/uc?id=1B8SFvqvmTvm_UtLtbF1MZrQjYI4CAE2j" -O "$DIR/Southwest_Airlines_S.obj"
          sha256sum "$DIR/Southwest_Airlines.dds" "$DIR/Southwest_Airlines_LIT.png" "$DIR/Southwest_Airlines_S.obj" > "$DIR/Southwest_Airlines.sha256"
          git add "$DIR/Southwest_Airlines.dds" "$DIR/Southwest_Airlines_LIT.png" "$DIR/Southwest_Airlines_S.obj" "$DIR/Southwest_Airlines.sha256"
          git commit -m "Move exact MisterX Southwest 737-800 source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: 737-800 United exact files
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin kphx-full-airport-import
          DIR="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Aircraft/Boeing_737_800"
          gdown "https://drive.google.com/uc?id=1OXeSzQjM13aqvD0zmsH-VWbVQhvJubhW" -O "$DIR/United_Airlines.dds"
          gdown "https://drive.google.com/uc?id=1dHx4xrXPhZvyAFNIv9mCl1bbeIofbx1k" -O "$DIR/United_Airlines_LIT.png"
          gdown "https://drive.google.com/uc?id=1XpeEzMpKo-bwLZKKc7akRpE6lU54IpSI" -O "$DIR/United_Airlines_S.obj"
          sha256sum "$DIR/United_Airlines.dds" "$DIR/United_Airlines_LIT.png" "$DIR/United_Airlines_S.obj" > "$DIR/United_Airlines.sha256"
          git add "$DIR/United_Airlines.dds" "$DIR/United_Airlines_LIT.png" "$DIR/United_Airlines_S.obj" "$DIR/United_Airlines.sha256"
          git commit -m "Move exact MisterX United 737-800 source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: 737-900ER United exact files
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin kphx-full-airport-import
          DIR="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Aircraft/Boeing_737_900ER"
          mkdir -p "$DIR"
          gdown "https://drive.google.com/uc?id=1tNQM078CaWTemImQLAZNm0jU2TbcBiIQ" -O "$DIR/Normal.png"
          gdown "https://drive.google.com/uc?id=1KsxBPc0SdhthwNxdjZDAstNwDCwahuzJ" -O "$DIR/United_Airlines.dds"
          gdown "https://drive.google.com/uc?id=1GlCXvWlpLAUu87E8oj3S_2zymA8IOFsz" -O "$DIR/United_Airlines_LIT.png"
          gdown "https://drive.google.com/uc?id=1TB-Sq6KWV9ORVZrHs3x_rYM1urFcm4NG" -O "$DIR/United_Airlines_S.obj"
          sha256sum "$DIR/Normal.png" "$DIR/United_Airlines.dds" "$DIR/United_Airlines_LIT.png" "$DIR/United_Airlines_S.obj" > "$DIR/United_Airlines.sha256"
          git add "$DIR"
          git commit -m "Move exact MisterX United 737-900ER source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
