name: Inspect CRJ700 Door Geometry

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-crj700-door-inspection.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect CRJ700 door geometry
        run: node scripts/inspect-crj700-door-geometry.mjs

      - name: Commit inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/crj700-door-geometry-inspection.json
          git commit -m "Inspect CRJ700 door geometry"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
