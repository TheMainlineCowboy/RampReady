# current exact-source A1 stock jetway verification
name: KPHX A1 Exact XP11 Stock Jetway

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-a1-xp11-stock-jetway.yml"

permissions:
  contents: write

concurrency:
  group: kphx-a1-xp11-stock-jetway
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            package.json
            package-lock.json
            index.html
            vite.config.js
            src
            reports/kphx-a1-source-jetway-authority.json
            scripts/convert-kphx-obj8-to-gltf.mjs
            scripts/materialize-xp11-stock-jetway-facade.mjs
            source/xplane11-stock/jetways
            public/models/kphx/Terminal4b.exact.glb
          sparse-checkout-cone-mode: false

      - name: Verify exact source ZIPs
        shell: bash
        run: |
          set -euo pipefail
          echo "b64fe7f83e2a286bb52c5b4255953eda46f04b1b5c0d9928faffe4b9371f595f  source/xplane11-stock/jetways/XP11_Jetways.zip" | sha256sum --check --strict
          echo "a1d5d6c1e6066394d68ed09b513b22c85b1260715858c878b2096102d6327aa3  source/xplane11-stock/jetways/XP11_Jetway_Textures.zip" | sha256sum --check --strict

      - name: Extract exact stock facade dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xp11-jw /tmp/xp11-jwtex /tmp/xp11-browser-textures public/models/kphx-stock-jetways
          mkdir -p /tmp/xp11-jw /tmp/xp11-jwtex /tmp/xp11-browser-textures
          unzip -q source/xplane11-stock/jetways/XP11_Jetways.zip -d /tmp/xp11-jw
          unzip -q source/xplane11-stock/jetways/XP11_Jetway_Textures.zip -d /tmp/xp11-jwtex
          JETWAY_DIR="$(dirname "$(find /tmp/xp11-jw -type f -iname 'jetway_1_solid.fac' -print -quit)")"
          TEXTURE_DIR="$(dirname "$(find /tmp/xp11-jwtex -type f -iname 'jetway_1_NML.png' -print -quit)")"
          test -n "$JETWAY_DIR"
          test -n "$TEXTURE_DIR"
          echo "a98a61b6de28a0db6548f748163494fc24513267dee40322502d5800eff8feb5  $JETWAY_DIR/jetway_1_solid.fac" | sha256sum --check --strict
          echo "fa988bfd30807376113aa0c9075e173ae9c2f9b5f5e75f01828e1c8279bbf59e  $TEXTURE_DIR/jetway_1_ALB.dds" | sha256sum --check --strict
          echo "64e28d9546c0b9884a11d0555b3ab5287ceec3f248d3d9da4dbfdf0e87edf127  $TEXTURE_DIR/jetway_1_LIT.dds" | sha256sum --check --strict
          echo "ded40b58230e1c0cbcef8f4e126ee97733f03f02ac52aebce53a1b12ed16e233  $TEXTURE_DIR/jetway_1_NML.png" | sha256sum --check --strict
          printf '%s\n' "$JETWAY_DIR" > /tmp/xp11-jw-dir.txt
          printf '%s\n' "$TEXTURE_DIR" > /tmp/xp11-jwtex-dir.txt

      - name: Decode exact stock DDS textures for browser sampling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path(open("/tmp/xp11-jwtex-dir.txt").read().strip())
          dst=Path("/tmp/xp11-browser-textures")
          for stem in ("jetway_1_ALB","jetway_1_LIT"):
              Image.open(src/f"{stem}.dds").save(dst/f"{stem}.png", format="PNG", optimize=False)
          (dst/"jetway_1_NML.png").write_bytes((src/"jetway_1_NML.png").read_bytes())
          PY

      - name: Materialize exact FAC and referenced OBJ8 pieces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-xp11-stock-jetway-facade.mjs             "$(cat /tmp/xp11-jw-dir.txt)"             /tmp/xp11-browser-textures             public/models/kphx-stock-jetways
          node - <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("public/models/kphx-stock-jetways/manifest.json","utf8"));
          const failures=[];
          if(m.sourceFacadeSha256!=="a98a61b6de28a0db6548f748163494fc24513267dee40322502d5800eff8feb5") failures.push("facade SHA");
          if(m.ringMode!==0) failures.push(`RING=${m.ringMode}`);
          if(m.objects?.length!==18) failures.push(`objects=${m.objects?.length}`);
          if(m.segments?.length!==24) failures.push(`segments=${m.segments?.length}`);
          if(m.walls?.length!==10) failures.push(`walls=${m.walls?.length}`);
          if(failures.length) throw new Error(failures.join("; "));
          console.log(JSON.stringify({ringMode:m.ringMode,objects:m.objects.length,segments:m.segments.length,walls:m.walls.map(w=>w.name)},null,2));
          NODE

      - name: Install verifier browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start verifier
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/a1-stock-vite.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/a1-stock-vite.log
          exit 1

      - name: Capture exact A1 stock jetway evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000}});
          const errors=[],failed=[],httpErrors=[];
          page.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
          page.on("pageerror",e=>errors.push(String(e)));
          page.on("requestfailed",r=>failed.push({url:r.url(),error:r.failure()?.errorText||"unknown"}));
          page.on("response",r=>{if(r.status()>=400)httpErrors.push({url:r.url(),status:r.status()})});
          let waitError=null;
          await page.goto("http://127.0.0.1:4173/RampReady/?kphxA1Jetway=1",{waitUntil:"domcontentloaded",timeout:60000});
          try{
            await page.waitForFunction(()=>{
              const c=document.querySelector("canvas.kphxA1StockJetwayVerifierCanvas");
              return ["ready","error"].includes(c?.dataset?.kphxA1StockJetwayVerifier);
            },null,{timeout:120000});
          }catch(e){waitError=String(e)}
          const evidence=await page.evaluate(()=>{
            const c=document.querySelector("canvas.kphxA1StockJetwayVerifierCanvas");
            return c?{dataset:{...c.dataset}}:{dataset:{}};
          });
          await page.screenshot({path:"reports/kphx-a1-xp11-stock-jetway.png",fullPage:true});
          fs.writeFileSync("reports/kphx-a1-xp11-stock-jetway.json",JSON.stringify({evidence,errors,failed,httpErrors,waitError},null,2)+"\n");
          await browser.close();
          NODE

      - name: Enforce exact A1 contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("reports/kphx-a1-xp11-stock-jetway.json","utf8"));
          const d=r.evidence?.dataset||{};
          const f=[];
          if(d.kphxA1StockJetwayVerifier!=="ready")f.push(d.kphxA1StockJetwayError||`state=${d.kphxA1StockJetwayVerifier}`);
          if(d.kphxA1StockResource!=="lib/airport/Ramp_Equipment/Jetways/Jetway_1_solid.fac")f.push(`resource=${d.kphxA1StockResource}`);
          if(d.kphxA1StockFacadeWedObjectId!=="104804")f.push(`facade=${d.kphxA1StockFacadeWedObjectId}`);
          if(d.kphxA1StockNodeCount!=="7")f.push(`nodes=${d.kphxA1StockNodeCount}`);
          if(d.kphxA1StockEdgeCount!=="6")f.push(`edges=${d.kphxA1StockEdgeCount}`);
          if(d.kphxA1StockRingMode!=="0")f.push(`ring=${d.kphxA1StockRingMode}`);
          if(d.kphxA1OldUploadedGlbUsed!=="false")f.push("old substitute GLB loaded");
          if(d.kphxA1StockFacadeSha256!=="a98a61b6de28a0db6548f748163494fc24513267dee40322502d5800eff8feb5")f.push("FAC SHA mismatch");
          if(r.waitError)f.push(r.waitError);
          if(r.errors?.length)f.push(`browser=${r.errors.join(" | ")}`);
          if(r.failed?.length)f.push(`failed=${JSON.stringify(r.failed)}`);
          if(r.httpErrors?.length)f.push(`http=${JSON.stringify(r.httpErrors)}`);
          if(f.length)throw new Error(f.join("; "));
          console.log(JSON.stringify(d,null,2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kphx-a1-xp11-stock-jetway
          path: |
            reports/kphx-a1-xp11-stock-jetway.png
            reports/kphx-a1-xp11-stock-jetway.json
          if-no-files-found: warn
          compression-level: 0

      - name: Commit exact stock runtime assets
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse public/models/kphx-stock-jetways reports/kphx-a1-xp11-stock-jetway.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize exact XP11 stock A1 jetway facade"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
