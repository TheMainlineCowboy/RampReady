name: KPHX Exact WED Ground Ingest

on:
  workflow_dispatch:
  push:
    branches:
      - feat/source-kphx-airport
    paths:
      - '.github/workflows/kphx-wed-ground-ingest.yml'
      - 'tools/kphx/extract-wed-ground.py'
      - 'assets/kphx-source/exact-kphx-manifest.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/kphx-wed-ground-ingest.yml'
      - 'tools/kphx/extract-wed-ground.py'
      - 'assets/kphx-source/exact-kphx-manifest.json'
      - 'public/models/kphx/wed-ground.exact.json'

permissions:
  contents: write

jobs:
  ingest-wed-ground:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-kphx-airport
          fetch-depth: 0

      - name: Download exact KPHX WED source from Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kphx-drive public/models/kphx
          curl -L --fail --silent --show-error \
            'https://drive.usercontent.google.com/download?id=1oUuiZQiWbqIMXtqSQMklZ9E_jbsg_T2d&export=download&confirm=t' \
            -o .kphx-drive/earth.wed.xml
          test "$(wc -c < .kphx-drive/earth.wed.xml)" -eq 24885640
          echo '59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498  .kphx-drive/earth.wed.xml' | sha256sum --check --strict

      - name: Extract exact ground geometry and markings
        run: |
          python tools/kphx/extract-wed-ground.py \
            .kphx-drive/earth.wed.xml \
            public/models/kphx/wed-ground.exact.json

      - name: Verify exact extracted ground identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/models/kphx/wed-ground.exact.json)" -eq 6837207
          echo 'd13538a2504cfe953004c32486f690e5e415e07cd0b557769c44c2eeb88315fb  public/models/kphx/wed-ground.exact.json' | sha256sum --check --strict
          python - <<'PY'
          import json
          p=json.load(open('public/models/kphx/wed-ground.exact.json'))
          expected={'WED_PolygonPlacement':302,'WED_LinePlacement':1158,'WED_DrapedOrthophoto':955,'WED_Taxiway':5,'WED_Runway':3}
          assert p['authority']=='KPHX-1.75.1-earth.wed.xml-ground'
          assert p['counts']==expected, (p['counts'], expected)
          print('Verified exact WED ground counts:', p['counts'])
          PY

      - name: Commit exact WED ground artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add public/models/kphx/wed-ground.exact.json
          if git diff --cached --quiet; then
            echo 'Exact WED ground artifact is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize exact KPHX WED ground geometry'
          git push origin HEAD:feat/source-kphx-airport
