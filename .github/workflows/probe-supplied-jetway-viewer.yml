name: Probe supplied jetway viewer source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-supplied-jetway-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture public viewer metadata and source texture URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request
          uid = '6067e855917e498abee3d98076293cc6'
          headers = {
              'User-Agent': 'Mozilla/5.0',
              'Referer': f'https://sketchfab.com/models/{uid}/embed',
          }
          request = urllib.request.Request(f'https://sketchfab.com/i/models/{uid}', headers=headers)
          with urllib.request.urlopen(request, timeout=45) as response:
              data = json.load(response)
          pathlib.Path('viewer-model.json').write_text(json.dumps(data, indent=2, sort_keys=True))

          urls = []
          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f'{path}[{index}]')
              elif isinstance(value, str) and value.startswith('http'):
                  if 'media.sketchfab.com' in value or 'media.sketchfabusercontent.com' in value:
                      urls.append({'path': path, 'url': value})
          walk(data)
          pathlib.Path('viewer-media-urls.json').write_text(json.dumps(urls, indent=2, sort_keys=True))
          print('viewer metadata bytes=', pathlib.Path('viewer-model.json').stat().st_size)
          print('media URL count=', len(urls))
          for entry in urls:
              print(entry['path'], entry['url'])
          PY
      - name: Upload viewer source metadata
        uses: actions/upload-artifact@v4
        with:
          name: supplied-jetway-viewer-metadata
          path: |
            viewer-model.json
            viewer-media-urls.json
          if-no-files-found: error
          retention-days: 1
