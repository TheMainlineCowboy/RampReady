name: Probe supplied jetway viewer source

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-supplied-jetway-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public viewer metadata for the supplied model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          uid='6067e855917e498abee3d98076293cc6'
          req=urllib.request.Request(f'https://sketchfab.com/i/models/{uid}', headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          print('top-level keys:', sorted(data.keys()))
          def walk(value, path='root'):
              if isinstance(value, dict):
                  for key, child in value.items():
                      lower=key.lower()
                      if any(token in lower for token in ('url','file','archive','model')) and isinstance(child, (str,int,float,bool,type(None))):
                          print(f'{path}.{key}={child}')
                      walk(child, f'{path}.{key}')
              elif isinstance(value, list):
                  for i, child in enumerate(value[:50]): walk(child, f'{path}[{i}]')
          walk(data)
          PY
