name: Validate simulator-quality branch

on:
  push:
    branches:
      - work/simulator-quality-inspection-pass
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rampready-simulator-quality-branch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete verification
        run: npm run verify

      - name: Build production site
        run: npm run build

      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/models/kphx-ground/kphx-ground.gltf
          test -s dist/models/phx-terminal4/terminal4.gltf
          grep -Eq 'src="/RampReady/assets/[^" ]+\.js"' dist/index.html
