name: Build PHX source aerial

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/build-phx-photo-mosaic.py'
      - 'scripts/extract-phx-photo.cpp'
      - '.github/workflows/debug-phx-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-phx-source-aerial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-aerial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: TheMainlineCowboy/SkyHarborPhx
          ref: 2e6642778c9c88eac6a82b21063763cc78be7cfe
          path: skyharbor-source
      - uses: actions/checkout@v4
        with:
          repository: seanisom/flightsimlib
          ref: fc17bec8e20770da3344eea10f25ecac281ee09f
          path: flightsimlib-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build terrain-photo decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/phx-photo/objects .cache/phx-photo/tiles
          for source in flightsimlib-source/external/PTC/*.c; do
            gcc -O2 -fPIC -Iflightsimlib-source/external/PTC -c "$source" \
              -o ".cache/phx-photo/objects/$(basename "${source%.c}").o"
          done
          g++ -std=c++20 -O2 \
            -Iflightsimlib-source/include \
            -Iflightsimlib-source/external \
            -Iflightsimlib-source/external/PTC \
            scripts/extract-phx-photo.cpp \
            flightsimlib-source/src/BglDecompressor.cpp \
            .cache/phx-photo/objects/*.o \
            -o .cache/phx-photo/extract-phx-photo
      - name: Decode full-resolution PHX airport imagery
        shell: bash
        run: |
          set -euo pipefail
          .cache/phx-photo/extract-phx-photo \
            skyharbor-source/scenery/PHXPhoto.bgl \
            .cache/phx-photo/tiles
      - name: Build native-resolution browser aerial tiles
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          rm -rf public/models/kphx-photo
          python scripts/build-phx-photo-mosaic.py \
            .cache/phx-photo/tiles \
            skyharbor-source/scenery/PHXPhoto.bgl \
            public/models/kphx-photo
          find public/models/kphx-photo -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - name: Commit generated source aerial tiles
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'RampReady Airport Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add public/models/kphx-photo
          if git diff --cached --quiet; then
            echo 'PHX source aerial tiles are already current.'
          else
            git commit -m 'Tile PHX source aerial at native WebGL resolution'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
