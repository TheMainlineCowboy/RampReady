name: Audit exact PHX source package

on:
  push:
    branches:
      - agent/exact-skyharbor-source-only
    paths:
      - '.github/workflows/debug-phx-source.yml'
      - 'scripts/fetch-phx-freeware-source.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Resolve the public freeware package and preserve diagnostics
        run: node scripts/fetch-phx-freeware-source.mjs source-download
      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-phx-source-audit-${{ github.sha }}
          path: source-download/
          if-no-files-found: warn
          retention-days: 7
