name: Verify source-first A1 repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/PushbackTrainer.jsx'
      - 'src/components/equipment-selection.css'
      - 'src/components/inspection-compact-v30.css'
      - 'src/environment/terminal4JetwayVisualUpgradeV35.js'
      - 'scripts/prepare-a1-terminal-connector-v11.mjs'
      - 'scripts/prepare-terminal4-facade-visual-v7.mjs'
      - 'scripts/prepare-terminal4-facade-continuity-v8.mjs'
      - 'scripts/prepare-terminal4-source-facade-selection-v27.mjs'
      - 'scripts/prepare-terminal4-facade-splitter-runtime-v33.mjs'
      - 'scripts/prepare-terminal4-facade-variant-safety-v34.mjs'
      - 'scripts/prepare-terminal4-jetway-visual-upgrade-v35.mjs'
      - 'scripts/prepare-direct-inspection-launch-v28.mjs'
      - 'scripts/prepare-phx-runtime-evidence.mjs'
      - 'tests/source-first-a1-repair-contract.test.mjs'
      - 'tests/terminal4-jetway-visual-upgrade-contract.test.mjs'
      - 'tests/browser/source-first-a1-repair.spec.js'
      - '.github/workflows/verify-source-first-a1-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-first-a1-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify repair contracts
        run: |
          node tests/source-first-a1-repair-contract.test.mjs
          node tests/terminal4-jetway-visual-upgrade-contract.test.mjs

      - name: Run complete source verification
        run: npm run verify

      - name: Build exact production artifact
        run: npm run build

      - name: Install browser verifier
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture focused A1 and tug-launch evidence
        run: npx playwright test tests/browser/source-first-a1-repair.spec.js --reporter=line --workers=1

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-first-a1-repair-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 3
