name: Verify source-first A1 repair

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  verify-source-first-a1-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify repair contracts
        run: |
          node tests/source-first-a1-repair-contract.test.mjs
          node tests/terminal4-jetway-visual-upgrade-contract.test.mjs
          node tests/terminal4-fixed-walkway-source-contract.test.mjs
          node tests/kphx-source-aerial-priority-contract.test.mjs

      - name: Run complete source verification
        run: npm run verify

      - name: Reset generated runtime before production build
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Build exact production artifact
        run: npm run build

      - name: Install browser verifier
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture focused A1, mode-pose, tug-launch and physical-collision evidence
        run: npx playwright test tests/browser/a1-mode-pose-regression.spec.js tests/browser/source-first-a1-repair.spec.js --reporter=line --workers=1

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-first-a1-repair-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 1
