name: Verify source-first A1 repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/PushbackTrainer.jsx'
      - 'src/components/equipment-selection.css'
      - 'src/components/inspection-compact-v30.css'
      - 'src/environment/a1TerminalPortalSealV37.js'
      - 'src/environment/terminal4JetwayVisualUpgradeV35.js'
      - 'src/environment/terminal4FixedWalkwaySourceSkinV38.js'
      - 'src/environment/uploadedAirportJetwayExactModelGuard.js'
      - 'src/environment/uploadedAirportJetwayFleetReadyV2.js'
      - 'scripts/build-production-simulator-quality.mjs'
      - 'scripts/materialize-terminal4-package-first.mjs'
      - 'scripts/verify-package-first-simulator-quality.mjs'
      - 'scripts/verify-uploaded-airport-jetway-fleet.mjs'
      - 'scripts/normalize-terminal4-source-alpha-input-v29.mjs'
      - 'scripts/prepare-a1-terminal-connector-v11.mjs'
      - 'scripts/prepare-a1-terminal-portal-seal-v37.mjs'
      - 'scripts/prepare-full-airport-inspection-route.mjs'
      - 'scripts/prepare-airport-collision-guard-v45.mjs'
      - 'scripts/prepare-kphx-source-aerial-priority-v41.mjs'
      - 'scripts/prepare-terminal4-facade-visual-v7.mjs'
      - 'scripts/prepare-terminal4-facade-continuity-v8.mjs'
      - 'scripts/prepare-terminal4-source-facade-selection-v27.mjs'
      - 'scripts/prepare-terminal4-facade-splitter-runtime-v33.mjs'
      - 'scripts/prepare-terminal4-facade-variant-safety-v34.mjs'
      - 'scripts/prepare-terminal4-jetway-source-uv-v36.mjs'
      - 'scripts/prepare-terminal4-jetway-visual-upgrade-v35.mjs'
      - 'scripts/prepare-terminal4-jetway-simulator-polish.mjs'
      - 'scripts/prepare-simulator-render-quality.mjs'
      - 'scripts/prepare-direct-inspection-launch-v28.mjs'
      - 'scripts/prepare-phx-runtime-evidence.mjs'
      - 'scripts/prepare-source-first-a1-photo-route-verifier-v1.mjs'
      - 'tests/source-first-a1-repair-contract.test.mjs'
      - 'tests/terminal4-jetway-visual-upgrade-contract.test.mjs'
      - 'tests/terminal4-fixed-walkway-source-contract.test.mjs'
      - 'tests/kphx-source-aerial-priority-contract.test.mjs'
      - 'tests/browser/source-first-a1-repair.spec.js'
      - 'tests/browser/a1-mode-pose-regression.spec.js'
      - '.github/workflows/verify-source-first-a1-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-first-a1-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact repair commit
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify repair contracts
        run: |
          node tests/source-first-a1-repair-contract.test.mjs
          node tests/terminal4-jetway-visual-upgrade-contract.test.mjs
          node tests/terminal4-fixed-walkway-source-contract.test.mjs
          node tests/kphx-source-aerial-priority-contract.test.mjs

      - name: Run complete source verification
        run: npm run verify

      - name: Reset generated runtime before production build
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Build exact production artifact
        run: npm run build

      - name: Install browser verifier
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture photo-authoritative A1, mode-pose, tug-launch and physical-collision evidence
        run: |
          node scripts/prepare-source-first-a1-photo-route-verifier-v1.mjs
          grep -q 'Number(data?.a1ExactRotundaToWallWorldMeters) > 18' tests/browser/source-first-a1-repair.spec.js
          grep -q 'expect(finalRotundaToWallDistance).toBeGreaterThan(18)' tests/browser/source-first-a1-repair.spec.js
          if grep -q 'Math.abs(Number(data?.a1ExactRotundaToWallWorldMeters) - Number(data?.terminal4A1JetwayWallDistance)) <= 0.05' tests/browser/source-first-a1-repair.spec.js; then
            echo 'Stale compact A1 wall equality survived immediately before Playwright' >&2
            exit 1
          fi
          npx playwright test tests/browser/a1-mode-pose-regression.spec.js tests/browser/source-first-a1-repair.spec.js --reporter=line --workers=1

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-first-a1-repair-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 1
