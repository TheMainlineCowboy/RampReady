name: Verify A1 AutoGate Static Contract

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-a1-autogate-static.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify A1 AutoGate source contract
        run: node scripts/verify-a1-autogate-controller-static.mjs

      - name: Commit static verification evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/a1-autogate-static-verification.json
          git commit -m "Verify A1 AutoGate static contract"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
