name: KPHX Full Exact CDB and ZDP Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-full-cdb-zdp-materialize.yml"

permissions:
  contents: write

concurrency:
  group: kphx-full-cdb-zdp-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Mark full dependency job started
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin kphx-full-airport-import
          mkdir -p reports
          printf 'started\n' > reports/kphx-full-cdb-zdp-status.txt
          git add reports/kphx-full-cdb-zdp-status.txt
          if git diff --cached --quiet; then
            echo "Full KPHX CDB/ZDP start marker already current."
          else
            git commit -m "Record full KPHX CDB ZDP materialization start"
            git push origin HEAD:kphx-full-airport-import
          fi

      - name: Install exact conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick git-lfs
          python -m pip install --quiet gdown
          git lfs install
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Fetch exact KPHX WED authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kphx-source reports
          gdown "https://drive.google.com/uc?id=1oUuiZQiWbqIMXtqSQMklZ9E_jbsg_T2d" -O .kphx-source/earth.wed.xml
          test "$(sha256sum .kphx-source/earth.wed.xml | awk '{print $1}')" = "59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498"
          node scripts/extract-kphx-wed-object-placements.mjs \
            .kphx-source/earth.wed.xml \
            reports/kphx-full-airport-wed-placements-exact.json

      - name: Build exact CDB and ZDP placement reports
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const input=JSON.parse(fs.readFileSync("reports/kphx-full-airport-wed-placements-exact.json","utf8"));
          const wedSha256="59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498";
          const make=(prefix,label)=>{
            const selected=(input.placements.externalLibraries||[]).filter((p)=>p.resourcePrefix===prefix);
            const resources={};
            for(const p of selected) resources[p.resource]=(resources[p.resource]||0)+1;
            const payload={
              schemaVersion:1,
              authority:`KPHX 1.75.1 earth.wed.xml exact ${label} object placements`,
              source:{...input.source,wedSha256,authority:"user-supplied expanded X-Plane package"},
              selection:{policy:`all WED_ObjPlacement entries with resourcePrefix ${prefix}; no radius/area selection`},
              masterAnchor:input.masterAnchor,
              totals:{
                objectPlacementCount:selected.length,
                uniqueResourceCount:Object.keys(resources).length,
                packageOwnedPlacementCount:0,
                externalLibraryPlacementCount:selected.length,
              },
              packageOwned:{placementCount:0,uniqueResourceCount:0,resources:{}},
              externalLibraries:{
                placementCount:selected.length,
                uniqueResourceCount:Object.keys(resources).length,
                prefixCounts:{[prefix]:selected.length},
                resources,
              },
              placements:{packageOwned:[],externalLibraries:selected},
              rampStarts:[],
            };
            const slug=prefix==="CDB-Library"?"cdb":"zdp";
            fs.writeFileSync(`reports/kphx-full-${slug}-wed-placements.json`,JSON.stringify(payload,null,2)+"\n");
            fs.writeFileSync(`reports/kphx-full-${slug}-object-resources.json`,JSON.stringify({
              authority:`reports/kphx-full-${slug}-wed-placements.json`,
              dependency:prefix,
              resources:Object.keys(resources).sort(),
            },null,2)+"\n");
            return {placements:selected.length,resources:Object.keys(resources).length};
          };
          const cdb=make("CDB-Library","CDB");
          const zdp=make("ZDP_Library","ZDP");
          if(cdb.placements!==53||cdb.resources!==7) throw new Error(`CDB authority changed: ${JSON.stringify(cdb)}`);
          if(zdp.placements!==346||zdp.resources!==47) throw new Error(`ZDP authority changed: ${JSON.stringify(zdp)}`);
          console.log(JSON.stringify({cdb,zdp},null,2));
          NODE

      - name: Fetch exact supplied CDB source subset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            .cdb/Airport/GSE/others \
            .cdb/Airport/GSE/stairs \
            .cdb/shared_texture \
            .cdb/Cars/BICI \
            .cdb/Cars/camion \
            .cdb/Cars/cars/Landrover_Mercedez

          gdown "https://drive.google.com/uc?id=1LHUUCD9K3Qf9Y1I7eIRtLVTN16sV8Ocm" -O .cdb/library.txt

          gdown "https://drive.google.com/uc?id=1JWBWq8Xu0QNgHYKC6-pXEvdCvpCAI0Oa" -O .cdb/Airport/GSE/others/objects_airConditionerBig.obj
          gdown "https://drive.google.com/uc?id=17_sKfFz5pV1A33abAW_gBcVUfDS93jky" -O .cdb/Airport/GSE/others/objects_scaffolding_wood.obj
          gdown "https://drive.google.com/uc?id=118YNinSlLcz4FYRpgJLZ7vgF96kkH2Z4" -O .cdb/Airport/GSE/stairs/GSE_A320_stairs.obj
          gdown "https://drive.google.com/uc?id=1JFUyDHngYKIWkYqXUe1mzTeB7UT5F-uG" -O .cdb/Cars/BICI/car_golfcar2.obj
          gdown "https://drive.google.com/uc?id=10CyyfgHkP1MDMum0USHusMHnCINUm27Y" -O .cdb/Cars/camion/GSE_mini_aerialLift_.obj
          gdown "https://drive.google.com/uc?id=1LGvyBJMnMcdD_kqg6wGfQ7Y-Oi9S2abT" -O .cdb/Cars/cars/Landrover_Mercedez/car_mercedes_old_gray.obj
          gdown "https://drive.google.com/uc?id=1UTi92SiFH4-tArAF1t4eT9TcWMOOAYbW" -O .cdb/Cars/cars/Landrover_Mercedez/car_rangeRoverE.obj

          gdown "https://drive.google.com/uc?id=1crJ_3RJnSsf6X7u1u0UVbYFi8od-X2Wd" -O .cdb/Airport/GSE/others/cdb_others.dds
          gdown "https://drive.google.com/uc?id=1_5BuTrHdKq-1XVpY-buqdnLpATziyhaS" -O .cdb/Airport/GSE/others/cdb_others_LIT.dds
          gdown "https://drive.google.com/uc?id=1GlNdGuMM90DVHa1ZDo4MV5sCv9gPlWgg" -O .cdb/Airport/GSE/others/cdb_others_NORM.png
          gdown "https://drive.google.com/uc?id=1ymBcmUlOPU4Uxhs-I9tFkYHLIRkx_uPv" -O .cdb/Airport/GSE/others/cdb_others2.dds
          gdown "https://drive.google.com/uc?id=18OJOBISH18NBsY3fiPajRGhpWWy3AokT" -O .cdb/Airport/GSE/others/cdb_others2_LIT.dds
          gdown "https://drive.google.com/uc?id=1n8GM44imYVGZLvKLonZmXsfxhNBhbJr1" -O .cdb/Airport/GSE/others/cdb_others2_NORM.png
          gdown "https://drive.google.com/uc?id=1ue75p9I4k12RYOPZqm2cnWIaMQXI_xMS" -O .cdb/shared_texture/escadas.dds
          gdown "https://drive.google.com/uc?id=1jZI1utsm6dAoIDtXUipfisxKvprD8b_d" -O .cdb/shared_texture/escadas_LIT.dds
          gdown "https://drive.google.com/uc?id=1_mVWPBzpQ_1uxHse8_mbt5W1pFEjs8Ij" -O .cdb/shared_texture/escadas_NORM.png
          gdown "https://drive.google.com/uc?id=18HsUSwsDyyTOM9CgUc7NPUXW1q63juGo" -O .cdb/Cars/BICI/GolfCart01.dds
          gdown "https://drive.google.com/uc?id=1F8m-8cVcYem_ev7KO4r0sRz7V0UwJef8" -O .cdb/Cars/camion/MobileElevator01.dds
          gdown "https://drive.google.com/uc?id=1usAVnKfZn55FxAvXMwf3hP30vTP2Nsld" -O .cdb/Cars/cars/Landrover_Mercedez/mercedes_gray.dds
          gdown "https://drive.google.com/uc?id=15iceQtgz4OuIQmZbixSqT2xV8W0XP3DL" -O .cdb/Cars/cars/Landrover_Mercedez/mercedes_Normal.png
          gdown "https://drive.google.com/uc?id=1ZESuc4FF1nZhjpfRHsPOecanM6EHLLg2" -O .cdb/Cars/cars/Landrover_Mercedez/rangeRover.dds

          node scripts/resolve-xplane-library.mjs \
            .cdb \
            reports/kphx-full-cdb-object-resources.json \
            reports/kphx-full-cdb-library-map.json \
            --virtual-prefix=CDB-Library

          printf 'cdb-source-ready\n' > reports/kphx-full-cdb-zdp-status.txt
          git add reports/kphx-full-cdb-zdp-status.txt reports/kphx-full-cdb-library-map.json
          git commit -m "Record exact full CDB source readiness"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: Materialize full exact CDB objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime-cdb
          node scripts/materialize-kphx-full-airport.mjs \
            .cdb \
            .runtime-cdb \
            --placement-report=reports/kphx-full-cdb-wed-placements.json \
            --library-map=reports/kphx-full-cdb-library-map.json \
            --include-external-prefixes=CDB-Library \
            --batch-name=full-cdb

      - name: Verify and commit full exact CDB runtime checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const c=JSON.parse(fs.readFileSync(".runtime-cdb/manifest.json","utf8"));
          if(c.failures?.length) throw new Error(`CDB failures=${c.failures.length}`);
          if(c.resolvedExternal.materializedPlacementCount!==53||c.resolvedExternal.materializedUniqueResourceCount!==7){
            throw new Error(`CDB exact contract mismatch ${c.resolvedExternal.materializedPlacementCount}/${c.resolvedExternal.materializedUniqueResourceCount}`);
          }
          console.log(JSON.stringify({cdb:{placements:53,resources:7},status:"PASS"},null,2));
          NODE

          mkdir -p public/models/kphx-full-airport/external public/models/kphx-full-airport/batches
          cp -a .runtime-cdb/external/. public/models/kphx-full-airport/external/
          cp .runtime-cdb/manifest.json public/models/kphx-full-airport/batches/full-cdb.manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/kphx-full-airport/external/CDB-Library \
            public/models/kphx-full-airport/batches/full-cdb.manifest.json \
            reports/kphx-full-airport-wed-placements-exact.json \
            reports/kphx-full-cdb-wed-placements.json \
            reports/kphx-full-cdb-object-resources.json \
            reports/kphx-full-cdb-library-map.json \
            reports/kphx-full-airport-materialization-full-cdb.json
          git commit -m "Materialize full exact KPHX CDB objects"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: Fetch pinned exact ZDP dependency subset
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          rm -rf .zdp
          git clone --depth 1 --branch 1.2.0 https://gitlab.com/StableSystem/zdp-library.git .zdp
          test "$(git -C .zdp rev-parse HEAD)" = "4b44b673ac023bac67f92a1c991a28df1b1da82c"

          node scripts/resolve-xplane-library.mjs \
            .zdp \
            reports/kphx-full-zdp-object-resources.json \
            reports/kphx-full-zdp-library-map.json \
            --virtual-prefix=ZDP_Library

          node --input-type=module <<'NODE' > /tmp/zdp-objects.txt
          import fs from "node:fs";
          const m=JSON.parse(fs.readFileSync("reports/kphx-full-zdp-library-map.json","utf8"));
          console.log([...new Set(Object.values(m.resources).map((x)=>x.physicalResource))].join(","));
          NODE
          ZDP_OBJECTS="$(cat /tmp/zdp-objects.txt)"
          git -C .zdp lfs pull --include="$ZDP_OBJECTS"

          node --input-type=module <<'NODE' > /tmp/zdp-textures.txt
          import fs from "node:fs";
          import path from "node:path";
          const m=JSON.parse(fs.readFileSync("reports/kphx-full-zdp-library-map.json","utf8"));
          const refs=new Set();
          const commands=new Set(["TEXTURE","TEXTURE_DRAPED","TEXTURE_LIT","WEATHER","TEXTURE_NORMAL","TEXTURE_DRAPED_NORMAL"]);
          for(const entry of Object.values(m.resources)){
            const obj=entry.physicalResource.replaceAll("\\","/");
            const abs=path.join(".zdp",obj);
            const source=fs.readFileSync(abs,"utf8");
            for(const raw of source.split(/\r?\n/)){
              const line=raw.trim();
              if(!line||line.startsWith("#")) continue;
              const p=line.split(/\s+/);
              if(!commands.has(p[0])) continue;
              let requested;
              if(p[0]==="TEXTURE_NORMAL"||p[0]==="TEXTURE_DRAPED_NORMAL"){
                const maybe=Number(p[1]);
                requested=Number.isFinite(maybe)&&p.length>=3?p.slice(2).join(" "):p.slice(1).join(" ");
              }else{
                requested=p.slice(1).join(" ");
              }
              if(!requested||/^none$/i.test(requested)) continue;
              const base=path.posix.normalize(path.posix.join(path.posix.dirname(obj),requested.replaceAll("\\","/")));
              const parsed=path.posix.parse(base);
              const candidates=[base,
                path.posix.join(parsed.dir,`${parsed.name}.dds`),
                path.posix.join(parsed.dir,`${parsed.name}.DDS`),
                path.posix.join(parsed.dir,`${parsed.name}.png`),
                path.posix.join(parsed.dir,`${parsed.name}.PNG`)
              ];
              const found=[...new Set(candidates)].find((x)=>fs.existsSync(path.join(".zdp",x)));
              if(!found) throw new Error(`Missing exact ZDP texture for ${obj}: ${requested}`);
              refs.add(found);
            }
          }
          console.log([...refs].sort().join(","));
          NODE
          ZDP_TEXTURES="$(cat /tmp/zdp-textures.txt)"
          if [ -n "$ZDP_TEXTURES" ]; then
            git -C .zdp lfs pull --include="$ZDP_TEXTURES"
          fi

      - name: Materialize full exact ZDP objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime-zdp
          node scripts/materialize-kphx-full-airport.mjs \
            .zdp \
            .runtime-zdp \
            --placement-report=reports/kphx-full-zdp-wed-placements.json \
            --library-map=reports/kphx-full-zdp-library-map.json \
            --include-external-prefixes=ZDP_Library \
            --batch-name=full-zdp

      - name: Verify and commit full exact ZDP runtime checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const z=JSON.parse(fs.readFileSync(".runtime-zdp/manifest.json","utf8"));
          if(z.failures?.length) throw new Error(`ZDP failures=${z.failures.length}`);
          if(z.resolvedExternal.materializedPlacementCount!==346||z.resolvedExternal.materializedUniqueResourceCount!==47){
            throw new Error(`ZDP exact contract mismatch ${z.resolvedExternal.materializedPlacementCount}/${z.resolvedExternal.materializedUniqueResourceCount}`);
          }
          console.log(JSON.stringify({zdp:{placements:346,resources:47},status:"PASS"},null,2));
          NODE

          mkdir -p public/models/kphx-full-airport/external public/models/kphx-full-airport/batches
          cp -a .runtime-zdp/external/. public/models/kphx-full-airport/external/
          cp .runtime-zdp/manifest.json public/models/kphx-full-airport/batches/full-zdp.manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/kphx-full-airport/external/ZDP_Library \
            public/models/kphx-full-airport/batches/full-zdp.manifest.json \
            reports/kphx-full-zdp-wed-placements.json \
            reports/kphx-full-zdp-object-resources.json \
            reports/kphx-full-zdp-library-map.json \
            reports/kphx-full-airport-materialization-full-zdp.json
          git commit -m "Materialize full exact KPHX ZDP objects"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
