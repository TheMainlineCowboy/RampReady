name: Recover Authored Aircraft

on:
  push:
    branches: [fix/authored-aircraft-live]
    paths:
      - .github/workflows/recover-authored-aircraft.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authored-aircraft-live
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Search retained workflow artifacts for exact authored source or runtime binary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_GLB_SHA: 01383b502fa9a5e0aca3b5cc4a90b5ffe82d52160778bc309e2de73579b1056b
          TARGET_BR_SHA: f4124a1ca343b6aaeb961f6bfcd970d09de3945088b08b06052f333f3ac788ae
          TARGET_ZIP_SHA: 5987a2b1d29617ff1f1941ec57d5aa655c70d51058d2086439e4cc5523e2633e
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/downloads recovery/unpacked public/models assets/aircraft

          # Known aircraft/evidence artifacts are checked first, then other retained
          # CRJ/aircraft/model/payload artifacts are searched without trusting names.
          python <<'PY' > recovery/artifact-ids.txt
          import json, os, subprocess
          repo=os.environ['REPO']
          known=[8520317438,8568733523]
          found=[]
          page=1
          while page <= 10:
              raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts','-f','per_page=100','-f',f'page={page}'], text=True)
              data=json.loads(raw)
              arts=data.get('artifacts',[])
              if not arts: break
              for a in arts:
                  if a.get('expired'): continue
                  name=(a.get('name') or '').lower()
                  if any(k in name for k in ('aircraft','crj','model','payload','runtime','production')):
                      found.append(a['id'])
              page += 1
          ordered=[]
          for i in known+found:
              if i not in ordered: ordered.append(i)
          print('\n'.join(map(str,ordered)))
          PY

          found=0
          while read -r id; do
            [ -z "$id" ] && continue
            zip="recovery/downloads/${id}.zip"
            if ! gh api -H 'Accept: application/vnd.github+json' "repos/${REPO}/actions/artifacts/${id}/zip" > "$zip" 2>/dev/null; then
              continue
            fi
            dir="recovery/unpacked/${id}"
            mkdir -p "$dir"
            unzip -qq -o "$zip" -d "$dir" || continue

            while IFS= read -r -d '' f; do
              sha=$(sha256sum "$f" | awk '{print $1}')
              case "$sha" in
                "$TARGET_GLB_SHA")
                  cp "$f" public/models/crj700-user.glb
                  found=1
                  break 2
                  ;;
                "$TARGET_BR_SHA")
                  cp "$f" assets/aircraft/crj700-user.glb.br
                  node - "$f" <<'NODE'
                  const fs=require('fs'); const zlib=require('zlib');
                  fs.writeFileSync('public/models/crj700-user.glb',zlib.brotliDecompressSync(fs.readFileSync(process.argv[2])));
                  NODE
                  test "$(sha256sum public/models/crj700-user.glb | awk '{print $1}')" = "$TARGET_GLB_SHA"
                  found=1
                  break 2
                  ;;
                "$TARGET_ZIP_SHA")
                  src=recovery/source
                  rm -rf "$src"; mkdir -p "$src"
                  unzip -qq -o "$f" -d "$src"
                  node tools/aircraft/convert-authored-crj900.mjs "$src" public/models/crj700-user.glb
                  test "$(sha256sum public/models/crj700-user.glb | awk '{print $1}')" = "$TARGET_GLB_SHA"
                  found=1
                  break 2
                  ;;
              esac
            done < <(find "$dir" -type f -print0)
          done < recovery/artifact-ids.txt

          test "$found" = 1
          test "$(stat -c%s public/models/crj700-user.glb)" = 1873128
          test "$(sha256sum public/models/crj700-user.glb | awk '{print $1}')" = "$TARGET_GLB_SHA"
          printf glTF | cmp -n 4 - public/models/crj700-user.glb

          # Generate authoritative metadata from the existing source contract fields.
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('docs/crj900-authored-aircraft-source.json','utf8'));
          const v=c.validatedCandidate;
          const n=c.normalizationContract;
          const metadata={
            contractVersion:1,
            aircraftType:n.runtimeAircraftType,
            sourceAircraftType:c.sourceModel.aircraftType,
            sha256:v.sha256,
            orientation:n.orientation,
            dimensionsMeters:n.dimensionsMeters,
            noseGearCaptureOrigin:n.noseGearCaptureOrigin,
            preserveMaterials:true,
            materialCount:v.materialCount,
            textureCount:v.textureCount,
            vertexCount:v.vertexCount,
            triangleCount:v.triangleCount,
            normalsGeneratedAtRuntime:v.normalsGeneratedAtRuntime
          };
          fs.writeFileSync('public/models/crj700-user.asset.json',JSON.stringify(metadata,null,2)+'\n');
          NODE

      - name: Verify exact asset and repository before commit
        run: |
          set -euo pipefail
          test "$(stat -c%s public/models/crj700-user.glb)" = 1873128
          test "$(sha256sum public/models/crj700-user.glb | awk '{print $1}')" = 01383b502fa9a5e0aca3b5cc4a90b5ffe82d52160778bc309e2de73579b1056b
          npm ci
          npm run verify
          npm run build

      - name: Commit recovered exact aircraft to integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RampReady aircraft recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add public/models/crj700-user.glb public/models/crj700-user.asset.json assets/aircraft/crj700-user.glb.br || true
          if git diff --cached --quiet; then
            echo 'Exact authored aircraft was already present.'
            exit 0
          fi
          git commit -m 'Recover exact authored American Eagle aircraft binary'
          git push origin HEAD:fix/authored-aircraft-live
