name: KPHX XP11 Official Server List

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp11-server-list.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1

      - name: Fetch official XP11 server list
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          curl -L --fail --retry 5 --show-error             "https://lookup.x-plane.com/_lookup_11_/server_list_11.txt"             -o reports/kphx-xp11-server-list.txt
          test -s reports/kphx-xp11-server-list.txt
          sha256sum reports/kphx-xp11-server-list.txt             > reports/kphx-xp11-server-list.sha256
          echo "=== server list ==="
          cat reports/kphx-xp11-server-list.txt

      - name: Commit server list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-xp11-server-list.txt reports/kphx-xp11-server-list.sha256
          if git diff --cached --quiet; then
            echo "Server list unchanged."
          else
            git commit -m "Record official XP11 server list for exact stock ingestion"
            git pull --rebase origin kphx-full-airport-import
            git push origin HEAD:kphx-full-airport-import
          fi
