name: Verify KPHX v1.8.1 Runtime

on:
  pull_request:
    paths:
      - '.github/workflows/verify-kphx-v181.yml'
      - 'src/environment/**'
      - 'scripts/prepare-terminal4-runtime.mjs'
      - 'scripts/prepare-full-airport-inspection-route.mjs'
      - 'scripts/prepare-a14-static-fleet-camera-v1.mjs'
      - 'scripts/prepare-terminal4-jetway-source-registration-v1.mjs'
      - 'scripts/build-production-simulator-quality.mjs'
      - 'scripts/run-production-with-a1-cleanup.mjs'
      - 'scripts/verify-terminal4-runtime-integration.mjs'
      - 'scripts/prepare-kphx-post-build-current-head-v1.mjs'
      - 'tests/browser/kphx-ground-runtime.spec.js'
      - 'tests/browser/full-airport-inspection.spec.js'
      - 'tests/browser/a1-terminal-joint-bogie-subviews.spec.js'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kphx-v181-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-kphx-v181-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build updated PHX runtime
        run: npm run build

      - name: Reapply exact-head KPHX browser acceptance gates
        run: node scripts/prepare-kphx-post-build-current-head-v1.mjs

      - name: Install browser verifier and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify A1, B15, Terminal 4 and full-airport free drive in exact production artifact
        env:
          # dist/ is already built and the current-head browser gates were just
          # reapplied. Do not let Playwright run npm run build a second time,
          # because that production wrapper intentionally restores tracked specs.
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run preview -- --port 4173 --strictPort
        run: npx playwright test tests/browser/kphx-ground-runtime.spec.js tests/browser/full-airport-inspection.spec.js tests/browser/a1-terminal-joint-bogie-subviews.spec.js --reporter=line --workers=1

      - name: Upload updated KPHX runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kphx-v181-runtime-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 1
