name: KPHX 1.75.1 Exact Full Airport Ingest

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-full-airport-ingest.yml"
      - "scripts/convert-kphx-obj8-to-gltf.mjs"
      - "scripts/extract-kphx-wed-object-placements.mjs"
      - "scripts/extract-kphx-wed-surface-network.mjs"
      - "scripts/materialize-kphx-full-airport.mjs"
      - "scripts/materialize-kphx-surface-resources.mjs"
      - "scripts/verify-kphx-full-airport-source-authority.mjs"
      - "scripts/verify-kphx-surface-source-contract.mjs"
      - "src/environment/kphxFullAirport/**"

permissions:
  contents: write

concurrency:
  group: kphx-1751-exact-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KPHX_ARCHIVE_ID: 1Zias_t4NlXQprjcV9TQlBIL75jiH2J0I
      KPHX_WED_SHA256: 59d9676dbccdaed24f2308e0597aacf846c8244cbadaefd8558af1e5c0dda498
      KPHX_RELEASE_TAG: kphx-source-1.75.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install exact-ingest tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full imagemagick git-lfs
          git lfs install
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download untouched KPHX 1.75.1 source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .kphx-source .kphx-extracted
          curl -L --fail --retry 5 --retry-delay 5 --show-error             "https://drive.usercontent.google.com/download?id=${KPHX_ARCHIVE_ID}&export=download&confirm=t"             -o ".kphx-source/KPHX - Phoenix Sky Harbor Intl_V1.75.1.7z"
          test -s ".kphx-source/KPHX - Phoenix Sky Harbor Intl_V1.75.1.7z"
          7z t ".kphx-source/KPHX - Phoenix Sky Harbor Intl_V1.75.1.7z"

      - name: Extract source and verify WED authority
        id: source
        shell: bash
        run: |
          set -euo pipefail
          7z x -y ".kphx-source/KPHX - Phoenix Sky Harbor Intl_V1.75.1.7z" -o.kphx-extracted >/dev/null
          WED="$(find .kphx-extracted -type f -name earth.wed.xml -print -quit)"
          if [ -z "$WED" ]; then
            echo "earth.wed.xml was not found after extraction" >&2
            exit 1
          fi
          SOURCE_ROOT="$(dirname "$WED")"
          printf '%s  %s\n' "${KPHX_WED_SHA256}" "$WED" | sha256sum --check --strict
          echo "source_root=$SOURCE_ROOT" >> "$GITHUB_OUTPUT"
          echo "wed=$WED" >> "$GITHUB_OUTPUT"
          mkdir -p assets/kphx-source/KPHX-1.75.1
          cp "$WED" assets/kphx-source/KPHX-1.75.1/earth.wed.xml
          if [ -f "$SOURCE_ROOT/Earth nav data/apt.dat" ]; then
            mkdir -p "assets/kphx-source/KPHX-1.75.1/Earth nav data"
            cp "$SOURCE_ROOT/Earth nav data/apt.dat" "assets/kphx-source/KPHX-1.75.1/Earth nav data/apt.dat"
          fi
          if [ -f "$SOURCE_ROOT/sam.xml" ]; then
            cp "$SOURCE_ROOT/sam.xml" assets/kphx-source/KPHX-1.75.1/sam.xml
          fi

      - name: Extract WED dependency requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/extract-kphx-wed-object-placements.mjs             "${{ steps.source.outputs.wed }}"             reports/kphx-full-airport-wed-placements.json
          node scripts/extract-kphx-wed-surface-network.mjs             "${{ steps.source.outputs.wed }}"             reports/kphx-wed-surface-network.json             reports/kphx-zdp-requested-resources.json             reports/kphx-zdp-library-map.json             assets/kphx-source/dependencies/ZDP_Library-1.2.0
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const objects = JSON.parse(fs.readFileSync("reports/kphx-full-airport-wed-placements.json", "utf8"));
          const surfaces = JSON.parse(fs.readFileSync("reports/kphx-wed-surface-network.json", "utf8"));
          const requested = new Set();
          for (const placement of objects.placements.externalLibraries) {
            if (placement.resourcePrefix === "ZDP_Library") requested.add(placement.resource);
          }
          for (const group of ["polygons", "lines", "drapedOrthophotos", "strings"]) {
            for (const placement of surfaces[group] || []) {
              if (placement.resourcePrefix === "ZDP_Library") requested.add(placement.resource);
            }
          }
          const resources = [...requested].sort();
          fs.writeFileSync("reports/kphx-zdp-requested-resources.json", JSON.stringify({
            authority: "KPHX-1.75.1-earth.wed.xml",
            dependency: "ZDP_Library",
            tag: "1.2.0",
            commitPrefix: "4b44b673",
            resources,
          }, null, 2) + "\n");
          console.log(`KPHX requests ${resources.length} unique ZDP virtual resources.`);
          NODE

      - name: Fetch exact ZDP Library 1.2.0 dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kphx-deps/zdp-library
          mkdir -p .kphx-deps
          git clone --depth 1 --branch 1.2.0             https://gitlab.com/StableSystem/zdp-library.git             .kphx-deps/zdp-library
          (
            cd .kphx-deps/zdp-library
            git lfs pull
            COMMIT="$(git rev-parse HEAD)"
            case "$COMMIT" in
              4b44b673*) ;;
              *) echo "Unexpected ZDP 1.2.0 commit: $COMMIT" >&2; exit 1 ;;
            esac
          )
          mkdir -p assets/kphx-source/dependencies/ZDP_Library-1.2.0
          find .kphx-deps/zdp-library -maxdepth 1 -type f \(             -iname 'license*' -o -iname 'readme*' -o -iname 'library.txt'           \) -exec cp '{}' assets/kphx-source/dependencies/ZDP_Library-1.2.0/ \;
          cat > assets/kphx-source/dependencies/ZDP_Library-1.2.0/SOURCE.json <<'JSON'
          {
            "name": "Zero Dollar Payware Library",
            "virtualPrefix": "ZDP_Library",
            "version": "1.2.0",
            "tag": "1.2.0",
            "commitPrefix": "4b44b673",
            "source": "https://gitlab.com/StableSystem/zdp-library",
            "license": "CC BY-NC 4.0",
            "purpose": "Exact KPHX 1.75.1 WED dependency; no substitute assets"
          }
          JSON

      - name: Resolve exact ZDP virtual resources used by KPHX
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-xplane-library.mjs             .kphx-deps/zdp-library             reports/kphx-zdp-requested-resources.json             reports/kphx-zdp-library-map.json             --virtual-prefix=ZDP_Library

      - name: Materialize all package-owned WED object resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/models/kphx-full-airport
          node scripts/materialize-kphx-full-airport.mjs             "${{ steps.source.outputs.source_root }}"             public/models/kphx-full-airport             --library-map=reports/kphx-zdp-library-map.json             --include-external-prefixes=ZDP_Library

      - name: Materialize exact WED pavement and painted-line resources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-kphx-surface-resources.mjs             "${{ steps.source.outputs.source_root }}"             public/models/kphx-full-airport/surfaces             --library-map=reports/kphx-zdp-library-map.json             --include-external-prefixes=ZDP_Library

      - name: Verify exact source contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-kphx-full-airport-source-authority.mjs
          node scripts/verify-kphx-surface-source-contract.mjs             public/models/kphx-full-airport/surfaces/manifest.json             public/models/kphx-full-airport/surfaces/surface-network.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const objectManifest = JSON.parse(fs.readFileSync("public/models/kphx-full-airport/manifest.json", "utf8"));
          if (objectManifest.failures?.length) throw new Error(`Object materialization failures: ${objectManifest.failures.length}`);
          if (objectManifest.packageOwned.materializedPlacementCount !== objectManifest.packageOwned.expectedPlacementCount) {
            throw new Error("Package-owned WED placement count is incomplete");
          }
          if (objectManifest.packageOwned.materializedUniqueResourceCount !== objectManifest.packageOwned.expectedUniqueResourceCount) {
            throw new Error("Package-owned WED resource count is incomplete");
          }
          NODE

      - name: Preserve exact ZDP dependency source in GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZDP_ARCHIVE=".kphx-source/ZDP_Library-1.2.0.tar.gz"
          tar --exclude='.git' -czf "$ZDP_ARCHIVE" -C .kphx-deps zdp-library
          if ! gh release view "kphx-dependency-zdp-1.2.0" >/dev/null 2>&1; then
            gh release create "kphx-dependency-zdp-1.2.0"               --target kphx-full-airport-import               --title "KPHX dependency: ZDP Library 1.2.0"               --notes "Exact ZDP Library 1.2.0 source dependency used by KPHX 1.75.1. Upstream license: CC BY-NC 4.0. Upstream: https://gitlab.com/StableSystem/zdp-library"
          fi
          gh release upload "kphx-dependency-zdp-1.2.0" "$ZDP_ARCHIVE" --clobber

      - name: Preserve untouched source archive in GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE=".kphx-source/KPHX - Phoenix Sky Harbor Intl_V1.75.1.7z"
          if ! gh release view "${KPHX_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${KPHX_RELEASE_TAG}"               --target kphx-full-airport-import               --title "KPHX 1.75.1 exact source authority"               --notes "Untouched user-supplied KPHX 1.75.1 source archive used to materialize RampReady's exact Sky Harbor runtime assets."
          fi
          gh release upload "${KPHX_RELEASE_TAG}" "$ARCHIVE" --clobber

      - name: Commit exact KPHX runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             assets/kphx-source/KPHX-1.75.1             public/models/kphx-full-airport             reports/kphx-full-airport-wed-placements.json             reports/kphx-full-airport-materialization.json             reports/kphx-wed-surface-network.json
          if git diff --cached --quiet; then
            echo "Exact KPHX runtime assets are already current."
            exit 0
          fi
          git commit -m "Materialize exact KPHX 1.75.1 full airport runtime"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
