name: Inspectable Actions storage purge

on:
  pull_request:
    branches:
      - maintenance/actions-storage-purge-review-base
    types: [opened, synchronize, reopened]
    paths:
      - .storage-purge-trigger
      - .github/workflows/purge-actions-storage-review.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: rampready-actions-storage-purge-review
  cancel-in-progress: true

jobs:
  purge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Purge and verify obsolete artifacts, caches, and runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail

          get_json() {
            local endpoint="$1" paginated="${2:-false}" attempt=1 output
            while (( attempt <= 30 )); do
              if [[ "${paginated}" == "true" ]]; then
                output="$(gh api --paginate --slurp "${endpoint}" 2>&1)"
              else
                output="$(gh api "${endpoint}" 2>&1)"
              fi
              if jq -e . >/dev/null 2>&1 <<<"${output}"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "GET ${endpoint} failed on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            return 1
          }

          delete_one() {
            local endpoint="$1" attempt=1 output
            while (( attempt <= 30 )); do
              if output="$(gh api --method DELETE "${endpoint}" 2>&1)"; then
                sleep 0.25
                return 0
              fi
              [[ "${output}" == *"HTTP 404"* ]] && return 0
              echo "DELETE ${endpoint} failed on attempt ${attempt}: ${output}" >&2
              sleep $((attempt < 6 ? attempt * 10 : 60))
              attempt=$((attempt + 1))
            done
            return 1
          }

          cancel_one() {
            local endpoint="$1" output
            if output="$(gh api --method POST "${endpoint}/cancel" 2>&1)"; then
              return 0
            fi
            [[ "${output}" == *"HTTP 404"* || "${output}" == *"HTTP 409"* ]] && return 0
            echo "CANCEL ${endpoint} failed: ${output}" >&2
            return 1
          }

          main_sha="$(get_json "repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')" || exit 1
          open_prs="$(get_json "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")" || exit 1
          accepted_pr="$(jq -c '[.[] | select((.head.ref | startswith("maintenance/")) | not)] | if length == 0 then empty else max_by(.number) end' <<<"${open_prs}")"
          accepted_pr_number=""
          accepted_sha=""
          if [[ -n "${accepted_pr}" ]]; then
            accepted_pr_number="$(jq -r '.number // empty' <<<"${accepted_pr}")"
            accepted_sha="$(jq -r '.head.sha // empty' <<<"${accepted_pr}")"
          fi
          [[ -n "${accepted_sha}" ]] || accepted_sha="${main_sha}"
          keep_json="$(printf '%s\n' "${main_sha}" "${accepted_sha}" | jq -R . | jq -s 'map(select(length > 0)) | unique')"
          echo "Preserving deployed main ${main_sha} and latest PR #${accepted_pr_number:-none} head ${accepted_sha}: ${keep_json}"

          deleted_artifacts=0
          deleted_artifact_bytes=0
          while true; do
            pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)" || exit 1
            mapfile -t rows < <(jq -r --argjson keep "${keep_json}" '.[] | .artifacts[] | (.workflow_run.head_sha // "") as $sha | select(($keep | index($sha)) == null) | [.id, (.size_in_bytes // 0)] | @tsv' <<<"${pages}")
            (( ${#rows[@]} == 0 )) && break
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r id bytes <<<"${row}"
              delete_one "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || exit 1
              deleted_artifacts=$((deleted_artifacts + 1))
              deleted_artifact_bytes=$((deleted_artifact_bytes + bytes))
            done
            echo "Deleted ${deleted_artifacts} obsolete artifacts (${deleted_artifact_bytes} bytes)."
            sleep 3
          done

          deleted_caches=0
          deleted_cache_bytes=0
          while true; do
            pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)" || exit 1
            mapfile -t rows < <(jq -r '.[] | .actions_caches[]? | [.id, (.size_in_bytes // 0)] | @tsv' <<<"${pages}")
            (( ${#rows[@]} == 0 )) && break
            for row in "${rows[@]}"; do
              IFS=$'\t' read -r id bytes <<<"${row}"
              delete_one "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" || exit 1
              deleted_caches=$((deleted_caches + 1))
              deleted_cache_bytes=$((deleted_cache_bytes + bytes))
            done
            echo "Deleted ${deleted_caches} caches (${deleted_cache_bytes} bytes)."
            sleep 3
          done

          cancelled_runs=0
          for attempt in $(seq 1 30); do
            run_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)" || exit 1
            mapfile -t active_ids < <(jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '.[] | .workflow_runs[] | select((.id | tostring) != $current) | select(.status != "completed") | (.head_sha // "") as $sha | select(($keep | index($sha)) == null) | .id' <<<"${run_pages}")
            (( ${#active_ids[@]} == 0 )) && break
            for id in "${active_ids[@]}"; do
              cancel_one "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || exit 1
              cancelled_runs=$((cancelled_runs + 1))
            done
            echo "Requested cancellation of obsolete active runs; waiting for terminal state (attempt ${attempt}/30)."
            sleep 5
          done

          deleted_runs=0
          while true; do
            run_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)" || exit 1
            mapfile -t run_ids < <(jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '.[] | .workflow_runs[] | select((.id | tostring) != $current) | select(.status == "completed") | (.head_sha // "") as $sha | select(($keep | index($sha)) == null) | .id' <<<"${run_pages}")
            (( ${#run_ids[@]} == 0 )) && break
            for id in "${run_ids[@]}"; do
              delete_one "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || exit 1
              deleted_runs=$((deleted_runs + 1))
            done
            echo "Deleted ${deleted_runs} obsolete completed workflow runs."
            sleep 3
          done

          artifact_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" true)" || exit 1
          obsolete_artifacts="$(jq -r --argjson keep "${keep_json}" '[.[] | .artifacts[] | (.workflow_run.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${artifact_pages}")"
          preserved_artifacts="$(jq -r '[.[] | .artifacts[]] | length' <<<"${artifact_pages}")"
          preserved_bytes="$(jq -r '[.[] | .artifacts[].size_in_bytes // 0] | add // 0' <<<"${artifact_pages}")"
          cache_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" true)" || exit 1
          caches="$(jq -r '[.[] | .actions_caches[]?] | length' <<<"${cache_pages}")"
          run_pages="$(get_json "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" true)" || exit 1
          obsolete_completed_runs="$(jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '[.[] | .workflow_runs[] | select((.id | tostring) != $current) | select(.status == "completed") | (.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${run_pages}")"
          obsolete_active_runs="$(jq -r --argjson keep "${keep_json}" --arg current "${GITHUB_RUN_ID}" '[.[] | .workflow_runs[] | select((.id | tostring) != $current) | select(.status != "completed") | (.head_sha // "") as $sha | select(($keep | index($sha)) == null)] | length' <<<"${run_pages}")"

          echo "STORAGE PURGE VERIFIED: latest PR #${accepted_pr_number:-none}=${accepted_sha}, main=${main_sha}; deleted artifacts=${deleted_artifacts} (${deleted_artifact_bytes} bytes), caches=${deleted_caches} (${deleted_cache_bytes} bytes), cancelled obsolete runs=${cancelled_runs}, deleted obsolete completed runs=${deleted_runs}; remaining obsolete artifacts=${obsolete_artifacts}, caches=${caches}, obsolete completed runs=${obsolete_completed_runs}, obsolete active runs=${obsolete_active_runs}; preserved current evidence=${preserved_artifacts} artifacts (${preserved_bytes} bytes)."
          (( obsolete_artifacts == 0 && caches == 0 && obsolete_completed_runs == 0 && obsolete_active_runs == 0 ))

      - name: Check out current main policy source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify every upload-artifact retention is one day
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          upload = re.compile(r'^\s*uses:\s*actions/upload-artifact@')
          retention_line = re.compile(r'retention-days:\s*(\d+)')
          failures = []

          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines = path.read_text(encoding='utf-8').splitlines()
              for index, line in enumerate(lines):
                  if not upload.match(line):
                      continue
                  base_indent = len(line) - len(line.lstrip())
                  retention = None
                  for candidate in lines[index + 1:]:
                      stripped = candidate.strip()
                      indent = len(candidate) - len(candidate.lstrip())
                      if stripped.startswith('- ') and indent <= base_indent:
                          break
                      match = retention_line.search(stripped)
                      if match:
                          retention = int(match.group(1))
                          break
                  if retention != 1:
                      failures.append(f'{path}:{index + 1}: retention-days={retention!r}, expected 1')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('POLICY VERIFIED: every actions/upload-artifact step on main retains evidence for exactly one day.')
