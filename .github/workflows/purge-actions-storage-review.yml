name: Inspectable Actions storage purge

on:
  pull_request:
    branches:
      - maintenance/actions-storage-purge-review-base
    types: [opened, synchronize, reopened]
    paths:
      - .storage-purge-trigger
      - .github/workflows/purge-actions-storage-review.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: rampready-actions-storage-purge-review
  cancel-in-progress: true

jobs:
  purge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Purge and verify obsolete artifacts, caches, and runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          api() { gh api --paginate --slurp "$1"; }
          main_sha="$(gh api "$repo/commits/main" --jq .sha)"
          prs="$(gh api "$repo/pulls?state=open&base=main&per_page=100")"
          accepted="$(jq -c '[.[] | select((.head.ref|startswith("maintenance/"))|not)] | if length==0 then empty else max_by(.number) end' <<<"$prs")"
          pr_num="$(jq -r '.number // empty' <<<"${accepted:-{}}")"
          pr_sha="$(jq -r '.head.sha // empty' <<<"${accepted:-{}}")"
          [[ -n "$pr_sha" ]] || pr_sha="$main_sha"
          keep="$(printf '%s\n%s\n' "$main_sha" "$pr_sha" | jq -R . | jq -s 'unique')"
          echo "Preserving main=$main_sha and PR #${pr_num:-none}=$pr_sha"

          deleted_artifacts=0; deleted_artifact_bytes=0
          while :; do
            pages="$(api "$repo/actions/artifacts?per_page=100")"
            mapfile -t rows < <(jq -r --argjson keep "$keep" '.[]|.artifacts[]|(.workflow_run.head_sha//"") as $s|select(($keep|index($s))==null)|[.id,(.size_in_bytes//0)]|@tsv' <<<"$pages")
            ((${#rows[@]})) || break
            for row in "${rows[@]}"; do IFS=$'\t' read -r id bytes <<<"$row"; gh api --method DELETE "$repo/actions/artifacts/$id" || true; ((deleted_artifacts+=1)); ((deleted_artifact_bytes+=bytes)); done
          done

          deleted_caches=0; deleted_cache_bytes=0
          while :; do
            pages="$(api "$repo/actions/caches?per_page=100")"
            mapfile -t rows < <(jq -r '.[]|.actions_caches[]?|[.id,(.size_in_bytes//0)]|@tsv' <<<"$pages")
            ((${#rows[@]})) || break
            for row in "${rows[@]}"; do IFS=$'\t' read -r id bytes <<<"$row"; gh api --method DELETE "$repo/actions/caches/$id" || true; ((deleted_caches+=1)); ((deleted_cache_bytes+=bytes)); done
          done

          cancelled_runs=0
          for _ in $(seq 1 30); do
            pages="$(api "$repo/actions/runs?per_page=100")"
            mapfile -t ids < <(jq -r --argjson keep "$keep" --arg cur "$GITHUB_RUN_ID" '.[]|.workflow_runs[]|select((.id|tostring)!=$cur)|select(.status!="completed")|(.head_sha//"") as $s|select(($keep|index($s))==null)|.id' <<<"$pages")
            ((${#ids[@]})) || break
            for id in "${ids[@]}"; do gh api --method POST "$repo/actions/runs/$id/cancel" >/dev/null 2>&1 || true; ((cancelled_runs+=1)); done
            sleep 5
          done

          deleted_runs=0
          while :; do
            pages="$(api "$repo/actions/runs?per_page=100")"
            mapfile -t ids < <(jq -r --argjson keep "$keep" --arg cur "$GITHUB_RUN_ID" '.[]|.workflow_runs[]|select((.id|tostring)!=$cur)|select(.status=="completed")|(.head_sha//"") as $s|select(($keep|index($s))==null)|.id' <<<"$pages")
            ((${#ids[@]})) || break
            for id in "${ids[@]}"; do gh api --method DELETE "$repo/actions/runs/$id" || true; ((deleted_runs+=1)); done
          done

          artifacts="$(api "$repo/actions/artifacts?per_page=100")"
          caches="$(api "$repo/actions/caches?per_page=100")"
          runs="$(api "$repo/actions/runs?per_page=100")"
          obsolete_artifacts="$(jq --argjson keep "$keep" '[.[]|.artifacts[]|(.workflow_run.head_sha//"") as $s|select(($keep|index($s))==null)]|length' <<<"$artifacts")"
          cache_count="$(jq '[.[]|.actions_caches[]?]|length' <<<"$caches")"
          obsolete_completed="$(jq --argjson keep "$keep" --arg cur "$GITHUB_RUN_ID" '[.[]|.workflow_runs[]|select((.id|tostring)!=$cur)|select(.status=="completed")|(.head_sha//"") as $s|select(($keep|index($s))==null)]|length' <<<"$runs")"
          obsolete_active="$(jq --argjson keep "$keep" --arg cur "$GITHUB_RUN_ID" '[.[]|.workflow_runs[]|select((.id|tostring)!=$cur)|select(.status!="completed")|(.head_sha//"") as $s|select(($keep|index($s))==null)]|length' <<<"$runs")"
          preserved_artifacts="$(jq '[.[]|.artifacts[]]|length' <<<"$artifacts")"
          preserved_bytes="$(jq '[.[]|.artifacts[].size_in_bytes//0]|add//0' <<<"$artifacts")"
          echo "STORAGE PURGE VERIFIED: latest PR #${pr_num:-none}=$pr_sha, main=$main_sha; deleted artifacts=$deleted_artifacts ($deleted_artifact_bytes bytes), caches=$deleted_caches ($deleted_cache_bytes bytes), cancelled obsolete runs=$cancelled_runs, deleted obsolete completed runs=$deleted_runs; remaining obsolete artifacts=$obsolete_artifacts, caches=$cache_count, obsolete completed runs=$obsolete_completed, obsolete active runs=$obsolete_active; preserved current evidence=$preserved_artifacts artifacts ($preserved_bytes bytes)."
          ((obsolete_artifacts==0 && cache_count==0 && obsolete_completed==0 && obsolete_active==0))

      - name: Check out current main policy source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify every upload-artifact retention is one day
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          upload = re.compile(r'^\s*uses:\s*actions/upload-artifact@')
          retention = re.compile(r'retention-days:\s*(\d+)')
          bad=[]
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              lines=path.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines):
                  if not upload.match(line): continue
                  base=len(line)-len(line.lstrip()); value=None
                  for candidate in lines[i+1:]:
                      stripped=candidate.strip(); indent=len(candidate)-len(candidate.lstrip())
                      if stripped.startswith('- ') and indent<=base: break
                      m=retention.search(stripped)
                      if m: value=int(m.group(1)); break
                  if value!=1: bad.append(f'{path}:{i+1}: retention-days={value!r}, expected 1')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('POLICY VERIFIED: every actions/upload-artifact step on main retains evidence for exactly one day.')
