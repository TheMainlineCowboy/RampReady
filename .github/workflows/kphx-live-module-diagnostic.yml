name: KPHX Live Module Diagnostic

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-kphx-live-module-diagnostic.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          sparse-checkout: |
            package.json
            package-lock.json
            index.html
            src
            scripts/prepare-terminal4-runtime.mjs
          sparse-checkout-cone-mode: false

      - name: Install
        run: npm ci

      - name: Regenerate and probe live modules
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-terminal4-runtime.mjs
          grep -q 't4-a1-zdp-surfaces/manifest.json' src/components/RampReadyStandupTrainerTerminal4.jsx
          grep -q 'loadLines: false' src/components/RampReadyStandupTrainerTerminal4.jsx
          grep -q 'lektro-ap88-tvo914-r187a' src/tug/lektroRig.js
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null && break
            sleep 1
          done

          echo "=== trainer module ==="
          curl -sS -i http://127.0.0.1:4173/RampReady/src/components/RampReadyStandupTrainerTerminal4.jsx || true
          echo
          echo "=== exact live installer ==="
          curl -sS -i http://127.0.0.1:4173/RampReady/src/environment/kphxFullAirport/installLiveTerminal4Exact.js || true
          echo
          echo "=== object loader ==="
          curl -sS -i http://127.0.0.1:4173/RampReady/src/environment/kphxFullAirport/installPackageOwnedObjectLayer.js || true
          echo
          echo "=== VITE LOG ==="
          cat /tmp/vite.log
