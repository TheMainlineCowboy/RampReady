name: KPHX T4 ZDP Exact Object Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-t4-zdp-object-materialize.yml"

permissions:
  contents: write

concurrency:
  group: kphx-t4-zdp-object-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install exact conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick git-lfs
          git lfs install
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clone pinned exact ZDP dependency
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --branch 1.2.0 https://gitlab.com/StableSystem/zdp-library.git .zdp
          test "$(git -C .zdp rev-parse HEAD)" = "4b44b673ac023bac67f92a1c991a28df1b1da82c"

          node --input-type=module <<'NODE' > /tmp/zdp-object-path.txt
          import fs from "node:fs";
          const target="ZDP_Library/markings/aircraft_stop_markers/SDF_code_C_AAL.obj";
          const src=fs.readFileSync(".zdp/library.txt","utf8");
          for (const raw of src.split(/\r?\n/)) {
            const line=raw.replace(/#.*/,"").trim();
            if (!line) continue;
            const p=line.split(/\s+/);
            const cmd=p[0];
            let virtual=null, physical=null;
            if (cmd==="EXPORT_RATIO" && p.length>=4) {
              virtual=p[2];
              physical=p.slice(3).join(" ");
            } else if (["EXPORT","EXPORT_EXCLUDE","EXPORT_BACKUP"].includes(cmd) && p.length>=3) {
              virtual=p[1];
              physical=p.slice(2).join(" ");
            }
            if (virtual===target) {
              console.log(physical);
              process.exit(0);
            }
          }
          throw new Error("Exact ZDP stop-marker export not found");
          NODE

          ZDP_OBJ="$(cat /tmp/zdp-object-path.txt)"
          git -C .zdp lfs pull --include="$ZDP_OBJ"

          ZDP_OBJ="$ZDP_OBJ" node --input-type=module <<'NODE' > /tmp/zdp-texture-paths.txt
          import fs from "node:fs";
          import path from "node:path";
          const obj=process.env.ZDP_OBJ;
          const abs=path.join(".zdp",obj);
          const src=fs.readFileSync(abs,"utf8");
          const refs=[];
          for (const raw of src.split(/\r?\n/)) {
            const line=raw.trim();
            if (!line) continue;
            const p=line.split(/\s+/);
            const cmd=p[0];
            let requested=null;
            if (["TEXTURE","TEXTURE_DRAPED","TEXTURE_LIT","WEATHER"].includes(cmd)) {
              requested=p.slice(1).join(" ");
            } else if (["TEXTURE_NORMAL","TEXTURE_DRAPED_NORMAL"].includes(cmd)) {
              const n=Number(p[1]);
              requested=Number.isFinite(n) && p.length>=3 ? p.slice(2).join(" ") : p.slice(1).join(" ");
            }
            if (!requested || /^none$/i.test(requested)) continue;
            const base=path.normalize(path.join(path.dirname(obj),requested)).replaceAll("\\","/");
            const parsed=path.posix.parse(base);
            const candidates=[base,`${parsed.dir}/${parsed.name}.dds`,`${parsed.dir}/${parsed.name}.DDS`,`${parsed.dir}/${parsed.name}.png`,`${parsed.dir}/${parsed.name}.PNG`];
            const found=[...new Set(candidates)].find((x)=>fs.existsSync(path.join(".zdp",x)));
            if (!found) throw new Error(`Texture source not found for ${requested}`);
            refs.push(found);
          }
          console.log([...new Set(refs)].join(","));
          NODE

          ZDP_TEXTURES="$(cat /tmp/zdp-texture-paths.txt)"
          if [ -n "$ZDP_TEXTURES" ]; then
            git -C .zdp lfs pull --include="$ZDP_TEXTURES"
          fi

      - name: Resolve exact ZDP stop-marker resource
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve-xplane-library.mjs \
            .zdp \
            reports/kphx-t4-zdp-object-resources.json \
            reports/kphx-t4-zdp-library-map.json \
            --virtual-prefix=ZDP_Library

      - name: Materialize exact authored T4 stop markers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kphx-t4-zdp-runtime
          node scripts/materialize-kphx-full-airport.mjs \
            .zdp \
            .kphx-t4-zdp-runtime \
            --placement-report=reports/kphx-t4-zdp-wed-placements.json \
            --library-map=reports/kphx-t4-zdp-library-map.json \
            --include-external-prefixes=ZDP_Library \
            --batch-name=t4-zdp

      - name: Verify exact ZDP object contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest=JSON.parse(fs.readFileSync(".kphx-t4-zdp-runtime/manifest.json","utf8"));
          if (manifest.failures?.length) throw new Error(`ZDP materialization failures: ${manifest.failures.length}`);
          if (manifest.resolvedExternal.materializedPlacementCount !== 13) {
            throw new Error(`Expected 13 exact ZDP placements, got ${manifest.resolvedExternal.materializedPlacementCount}`);
          }
          if (manifest.resolvedExternal.expectedUniqueResourceCount !== 1
              || manifest.resolvedExternal.materializedUniqueResourceCount !== 1) {
            throw new Error("Expected exactly one exact ZDP object resource");
          }
          const expected="ZDP_Library/markings/aircraft_stop_markers/SDF_code_C_AAL.obj";
          const placements=manifest.resolvedExternal.placements || [];
          if (!placements.every((p)=>p.resource===expected)) throw new Error("Unexpected ZDP object resource");
          console.log(JSON.stringify({placements:13,resources:1,status:"PASS"},null,2));
          NODE

      - name: Install exact ZDP runtime batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models/kphx-full-airport/external public/models/kphx-full-airport/batches
          cp -a .kphx-t4-zdp-runtime/external/. public/models/kphx-full-airport/external/
          cp .kphx-t4-zdp-runtime/manifest.json public/models/kphx-full-airport/batches/t4-zdp.manifest.json

      - name: Commit exact ZDP runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/kphx-full-airport/external/ZDP_Library \
            public/models/kphx-full-airport/batches/t4-zdp.manifest.json \
            reports/kphx-t4-zdp-library-map.json \
            reports/kphx-full-airport-materialization-t4-zdp.json
          if git diff --cached --quiet; then
            echo "Exact T4 ZDP runtime already current."
            exit 0
          fi
          git commit -m "Materialize exact T4 ZDP stop-marker runtime"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

# targeted-LFS retrigger
