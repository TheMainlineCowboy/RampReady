name: Deploy vehicle preview to GitHub Pages

on:
  push:
    branches: [fix/a1-real-fixed-corridor]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rampready-pages-vehicle-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact preview commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize supplied vehicle models
        run: node scripts/materialize-authored-equipment-models.mjs

      - name: Stamp exact preview commit
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > public/release-commit.txt
          mkdir -p public/releases
          printf '%s\n' "${GITHUB_SHA}" > "public/releases/${GITHUB_SHA}.txt"

      - name: Build complete RampReady runtime
        run: npm run build

      - name: Restore authored vehicles into completed artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-authored-equipment-models.mjs
          npm run materialize:standup-tug
          mkdir -p dist/models dist/releases
          cp public/models/lektro-88.glb dist/models/lektro-88.glb
          cp public/models/manager-kubota.glb dist/models/manager-kubota.glb
          cp public/models/standup-tug.glb dist/models/standup-tug.glb
          printf '%s\n' "${GITHUB_SHA}" > dist/release-commit.txt
          printf '%s\n' "${GITHUB_SHA}" > "dist/releases/${GITHUB_SHA}.txt"

      - name: Verify preview artifact and vehicle models
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/release-commit.txt
          test "$(tr -d '\r\n' < dist/release-commit.txt)" = "${GITHUB_SHA}"
          for model in lektro-88 manager-kubota standup-tug; do
            echo "Checking dist/models/${model}.glb"
            ls -l "dist/models/${model}.glb"
            test -s "dist/models/${model}.glb"
            printf 'glTF' | cmp -n 4 - "dist/models/${model}.glb"
          done
          test -s dist/models/kphx-photo/photo-manifest.json
          echo "Full KPHX artifact and all three authored vehicle files are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload preview Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: vehicle-preview-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy vehicle preview
        id: deployment
        uses: actions/deploy-pages@v4
