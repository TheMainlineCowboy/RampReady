name: Inventory AIR Jetway Source

on:
  push:
    branches: [work/simulator-quality-inspection-pass]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampready-air-jetway-source-inventory
  cancel-in-progress: true

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: work/simulator-quality-inspection-pass
          fetch-depth: 0

      - name: Inventory RampReady and pinned Sky Harbor source
        shell: bash
        run: |
          set -euo pipefail
          report="reports/air-jetway01-source-inventory.txt"
          mkdir -p reports .cache/source-inventory
          source_commit="2e6642778c9c88eac6a82b21063763cc78be7cfe"
          rm -rf .cache/source-inventory/SkyHarborPhx
          git clone --quiet --filter=blob:none https://github.com/TheMainlineCowboy/SkyHarborPhx.git .cache/source-inventory/SkyHarborPhx
          git -C .cache/source-inventory/SkyHarborPhx checkout --quiet "$source_commit"
          {
            echo "RampReady AIR_Jetway01 source inventory"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "rampready_head=$(git rev-parse HEAD)"
            echo "skyharbor_commit=$source_commit"
            echo
            echo "== RampReady candidate files =="
            find . -path './.git' -prune -o -path './node_modules' -prune -o -path './dist' -prune -o -path './.cache' -prune -o -type f \( -iname '*jetway*' -o -iname 'M1DG*' -o -iname '*.mdl' -o -iname '*.bgl' -o -iname '*.glb' -o -iname '*.gltf' \) -printf '%p|%s bytes\n' | sort
            echo
            echo "== SkyHarborPhx candidate files =="
            find .cache/source-inventory/SkyHarborPhx -path '*/.git' -prune -o -type f \( -iname '*jetway*' -o -iname 'M1DG*' -o -iname '*.mdl' -o -iname '*.bgl' -o -iname '*.glb' -o -iname '*.gltf' \) -printf '%p|%s bytes\n' | sort
            echo
            echo "== AIR_Jetway01 / GUID string matches =="
            while IFS= read -r -d '' file; do
              matches="$(strings -a "$file" 2>/dev/null | grep -Eai 'AIR_Jetway01|bfcdf52b-9142-415c-8318-03c1b92ca9d9|M1DGJETWAY' | head -20 || true)"
              if [ -n "$matches" ]; then
                echo "-- $file"
                printf '%s\n' "$matches"
              fi
            done < <(find .cache/source-inventory/SkyHarborPhx -type f -print0)
            echo
            echo "== Exact texture identity =="
            find . .cache/source-inventory/SkyHarborPhx -type f \( -iname 'M1DGJETWAY.BMP' -o -iname 'M1DGJETWAY_LM.BMP' \) -print0 | while IFS= read -r -d '' file; do sha256sum "$file"; done
          } > "$report"

      - name: Commit inventory report to draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/air-jetway01-source-inventory.txt
          git diff --cached --quiet && exit 0
          git commit -m "Inventory original AIR_Jetway01 source payload"
          git push origin HEAD:work/simulator-quality-inspection-pass
