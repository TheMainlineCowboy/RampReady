# rerun after stale A1 report import removal
name: KPHX T4 All Exact XP11 Jetways

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-t4-jetways-all.yml"

permissions:
  contents: read

concurrency:
  group: kphx-t4-jetways-all
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            package.json
            package-lock.json
            index.html
            vite.config.js
            src
            public/models/kphx
            public/models/xplane11-stock/jetway1
          sparse-checkout-cone-mode: false

      - name: Verify committed stock source authority
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const stock=JSON.parse(fs.readFileSync("public/models/xplane11-stock/jetway1/manifest.json","utf8"));
          const map=JSON.parse(fs.readFileSync("public/models/kphx/terminal4-wed-jetways.exact.json","utf8"));
          if(stock.sourceJetwaysZipSha256!=="b64fe7f83e2a286bb52c5b4255953eda46f04b1b5c0d9928faffe4b9371f595f")throw new Error("stock jetway source ZIP mismatch");
          if(stock.facade!=="jetway_1_solid.fac")throw new Error("stock facade mismatch");
          if(map.placements.length!==76)throw new Error("T4 WED placement count="+map.placements.length);
          const d7=map.placements.filter(x=>x.gate==="D7");
          if(d7.length!==2)throw new Error("D7 authored placement count="+d7.length);
          NODE

      - name: Install browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start verifier
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 >/tmp/t4-all-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/t4-all-vite.log
          exit 1

      - name: Capture all 76 exact stock jetways
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:2200,height:1400}});
          const errors=[],failed=[],httpErrors=[];
          page.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
          page.on("pageerror",e=>errors.push(String(e)));
          page.on("requestfailed",r=>failed.push({url:r.url(),error:r.failure()?.errorText||"unknown"}));
          page.on("response",r=>{if(r.status()>=400)httpErrors.push({url:r.url(),status:r.status()})});
          let waitError=null;
          await page.goto("http://127.0.0.1:4173/RampReady/?kphxT4Jetways=1&batch=ALL",{waitUntil:"domcontentloaded",timeout:60000});
          try{
            await page.waitForFunction(()=>{
              const c=document.querySelector("canvas.kphxT4JetwayBatchVerifierCanvas");
              return ["ready","error"].includes(c?.dataset?.kphxT4JetwayBatchVerifier);
            },null,{timeout:180000});
          }catch(e){waitError=String(e)}
          const evidence=await page.evaluate(()=>{
            const c=document.querySelector("canvas.kphxT4JetwayBatchVerifierCanvas");
            return c?{dataset:{...c.dataset}}:{dataset:{}};
          });
          await page.screenshot({path:"reports/kphx-t4-all-exact-jetways.png",fullPage:true});
          fs.writeFileSync("reports/kphx-t4-all-exact-jetways.json",JSON.stringify({evidence,errors,failed,httpErrors,waitError},null,2)+"\n");
          await browser.close();
          NODE

      - name: Enforce all-76 WED source contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const result=JSON.parse(fs.readFileSync("reports/kphx-t4-all-exact-jetways.json","utf8"));
          const map=JSON.parse(fs.readFileSync("public/models/kphx/terminal4-wed-jetways.exact.json","utf8"));
          const d=result.evidence?.dataset||{};
          const failures=[];
          if(d.kphxT4JetwayBatchVerifier!=="ready")failures.push(d.kphxT4JetwayBatchError||"not ready");
          if(d.kphxT4JetwayBatchName!=="ALL")failures.push("batch="+d.kphxT4JetwayBatchName);
          if(d.kphxT4JetwayBatchCount!=="76")failures.push("count="+d.kphxT4JetwayBatchCount);
          if(d.kphxT4JetwayBatchResource!=="lib/airport/Ramp_Equipment/Jetways/Jetway_1_solid.fac")failures.push("resource="+d.kphxT4JetwayBatchResource);
          if(d.kphxT4JetwayBatchOldAirportJetwayGlbLoaded!=="false")failures.push("old substitute GLB loaded");
          let ev=[];
          try{ev=JSON.parse(d.kphxT4JetwayBatchEvidence||"[]")}catch{failures.push("evidence JSON invalid")}
          if(ev.length!==map.placements.length)failures.push(`evidence=${ev.length} map=${map.placements.length}`);
          let expectedEdges=0;
          for(const p of map.placements){
            expectedEdges+=p.facadeNodeCount-1;
            const e=ev.find(x=>x.gate===p.gate && x.facadeWedObjectId===p.facadeWedObjectId);
            if(!e){failures.push(`missing ${p.gate}/${p.facadeWedObjectId}`);continue}
            if(e.rampWedObjectId!==p.rampWedObjectId)failures.push(`${p.gate}/${p.facadeWedObjectId} ramp=${e.rampWedObjectId}`);
            if(e.nodeCount!==p.facadeNodeCount)failures.push(`${p.gate}/${p.facadeWedObjectId} nodes=${e.nodeCount}`);
            if(e.ringMode!==0)failures.push(`${p.gate}/${p.facadeWedObjectId} ring=${e.ringMode}`);
            if(e.renderedEdgeCount!==p.facadeNodeCount-1)failures.push(`${p.gate}/${p.facadeWedObjectId} edges=${e.renderedEdgeCount}`);
          }
          if(Number(d.kphxT4JetwayBatchTotalEdges)!==expectedEdges)failures.push(`totalEdges=${d.kphxT4JetwayBatchTotalEdges} expected=${expectedEdges}`);
          if(result.waitError)failures.push("wait="+result.waitError);
          if(result.errors?.length)failures.push("browser="+result.errors.join(" | "));
          if(result.failed?.length)failures.push("failed="+JSON.stringify(result.failed));
          if(result.httpErrors?.length)failures.push("http="+JSON.stringify(result.httpErrors));
          if(failures.length)throw new Error("All-T4 exact jetway verification failed: "+failures.join("; "));
          console.log(JSON.stringify({
            placements:ev.length,
            totalEdges:expectedEdges,
            d7Placements:ev.filter(x=>x.gate==="D7").map(x=>x.facadeWedObjectId),
          },null,2));
          NODE

      - name: Upload all-T4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kphx-t4-all-exact-jetways
          path: |
            reports/kphx-t4-all-exact-jetways.png
            reports/kphx-t4-all-exact-jetways.json
          if-no-files-found: warn
          compression-level: 0
