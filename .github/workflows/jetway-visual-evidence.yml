name: Terminal 4 Jetway Visual Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "src/environment/**"
      - "src/components/**"
      - "scripts/**"
      - "playwright.jetway-visual.config.js"
      - ".github/workflows/jetway-visual-evidence.yml"
  push:
    branches: [fix/a1-live-terminal-joint-evidence-v1]
    paths:
      - "src/environment/**"
      - "src/components/**"
      - "scripts/**"
      - "playwright.jetway-visual.config.js"
      - ".github/workflows/jetway-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal4-jetway-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-jetways:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fail closed if tracked static fleet can relocate or re-aim supplied jetways
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'MAXIMUM_REGISTRATION_DISPLACEMENT_METERS = 44' src/environment/registerStaticJetwayFleetToFacadeV1.js; then
            echo 'Tracked runtime still permits up to 44 m of static jetway relocation.' >&2
            exit 1
          fi
          if grep -Fq 'const rotundaX = wallX - ux * resolvedRotundaCenterToWallMeters;' src/environment/registerStaticJetwayFleetToFacadeV1.js; then
            echo 'Tracked runtime still relocates supplied static Rotundas toward the terminal wall.' >&2
            exit 1
          fi
          if grep -Fq 'const targetHeading = bridgeDistance > 2 ? Math.atan2(bridgeDx, bridgeDz) : sourceYaw;' src/environment/registerStaticJetwayFleetToFacadeV1.js; then
            echo 'Tracked runtime still re-aims supplied static jetways from a synthetic aircraft target.' >&2
            exit 1
          fi

      - name: Fail closed unless prepared static fleet is source-pose locked
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-static-jetway-source-placement-integrity-v1.mjs
          grep -Fq '57-static-bgl-pose-locked-short-real-wall-registration-v7' src/environment/registerStaticJetwayFleetToFacadeV1.js
          grep -Fq 'const rotundaX = sourceX;' src/environment/registerStaticJetwayFleetToFacadeV1.js
          grep -Fq 'const rotundaZ = sourceZ;' src/environment/registerStaticJetwayFleetToFacadeV1.js
          grep -Fq 'const yaw = sourceYaw;' src/environment/registerStaticJetwayFleetToFacadeV1.js
          if grep -Fq 'const targetHeading = bridgeDistance > 2 ? Math.atan2(bridgeDx, bridgeDz) : sourceYaw;' src/environment/registerStaticJetwayFleetToFacadeV1.js; then
            echo 'Unsafe target-derived static jetway yaw survived preparation.' >&2
            exit 1
          fi
          if grep -Fq 'const rotundaX = wallX - ux * resolvedRotundaCenterToWallMeters;' src/environment/registerStaticJetwayFleetToFacadeV1.js; then
            echo 'Unsafe static jetway relocation survived preparation.' >&2
            exit 1
          fi

      - name: Build proposed RampReady site
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee jetway-build.log

      - name: Install visual test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local production preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jetway-visual-evidence
          npm run preview -- --host 127.0.0.1 --port 4173 > jetway-visual-evidence/preview.log 2>&1 &
          echo $! > jetway-visual-evidence/preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/RampReady/ >/dev/null; then
              echo "RampReady preview ready after attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          cat jetway-visual-evidence/preview.log
          exit 1

      - name: Render A1 and representative Terminal 4 jetways in one loaded scene
        env:
          PAGE_URL: http://127.0.0.1:4173/RampReady/
          EVIDENCE_DIR: jetway-visual-evidence
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-terminal4-fleet-visual.cjs 2>&1 | tee jetway-visual-evidence/workflow.log

      - name: Upload one-day jetway visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal4-jetway-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            jetway-visual-evidence/
            jetway-build.log
          if-no-files-found: warn
          retention-days: 1
