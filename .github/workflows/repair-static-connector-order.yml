name: Repair static connector ordering

on:
  push:
    branches:
      - fix/live-experience-cdp-capture
    paths:
      - .github/workflows/repair-static-connector-order.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-experience-cdp-capture
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Defer static vestibules until measured facade registration exists
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/environment/uploadedAirportJetwayFleet.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '''import {\n  addUploadedAirportJetwayStaticTerminalConnectors,\n  addUploadedAirportJetwayTerminalConnector,\n} from "./uploadedAirportJetwayTerminalConnector.js";''',
              '''import { addUploadedAirportJetwayTerminalConnector } from "./uploadedAirportJetwayTerminalConnector.js";''',
              1,
          )
          call = '''      const staticConnectors = addUploadedAirportJetwayStaticTerminalConnectors(THREE, fleet, placements);\n'''
          replacement = '''      // Static terminal vestibules are intentionally deferred until\n      // registerStaticJetwayFleetToFacade has measured each supplied Rotunda\n      // against its real terminal wall. Raw source placements do not yet carry\n      // staticAuthoredRotundaRadiusMeters/staticVisibleTerminalLegMeters.\n'''
          if call not in text:
              raise SystemExit('early static connector construction call is missing')
          text = text.replace(call, replacement, 1)
          old = '''      group.userData.uploadedJetwayStaticConnectorGateCount = staticConnectors.staticGateCount;\n      group.userData.uploadedJetwayStaticConnectorBatchCount = staticConnectors.batchCount;\n      group.userData.uploadedJetwayStaticConnectorInstanceCount = staticConnectors.instanceCount;\n      group.userData.uploadedJetwayStaticConnectorBatchAuthority = staticConnectors.authority;'''
          new = '''      // Measured facade registration owns these final values. Mark this\n      // pre-registration phase explicitly instead of fabricating connectors.\n      group.userData.uploadedJetwayStaticConnectorGateCount = 0;\n      group.userData.uploadedJetwayStaticConnectorBatchCount = 0;\n      group.userData.uploadedJetwayStaticConnectorInstanceCount = 0;\n      group.userData.uploadedJetwayStaticConnectorBatchAuthority = "waiting-for-measured-static-facade-registration";'''
          if old not in text:
              raise SystemExit('early static connector telemetry block is missing')
          text = text.replace(old, new, 1)
          for forbidden in [
              'addUploadedAirportJetwayStaticTerminalConnectors(THREE, fleet, placements)',
              'staticConnectors.staticGateCount',
              'staticConnectors.batchCount',
              'staticConnectors.instanceCount',
          ]:
              if forbidden in text:
                  raise SystemExit(f'early static connector dependency survived: {forbidden}')
          for required in [
              'waiting-for-measured-static-facade-registration',
              'registerStaticJetwayFleetToFacade has measured each supplied Rotunda',
              'addUploadedAirportJetwayTerminalConnector(THREE, fleet, placement)',
          ]:
              if required not in text:
                  raise SystemExit(f'missing ordering repair token: {required}')
          path.write_text(text, encoding='utf-8')
      - name: Commit ordering repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/environment/uploadedAirportJetwayFleet.js
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(jetway): defer static vestibules until measured registration'
          git push origin HEAD:fix/live-experience-cdp-capture
