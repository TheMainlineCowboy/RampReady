name: Materialize Marking Evidence

on:
  push:
    branches: [work/simulator-quality-inspection-pass]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/simulator-quality-inspection-pass
          fetch-depth: 0
      - run: node scripts/prepare-kphx-marking-contact.mjs
      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "src/environment/authoredKphxGround.js"
          grep -q 'authoredGroundMarkingContactMode = "pavement-coincident-decals"' src/environment/authoredKphxGround.js
          ! grep -q 'pavement-relative-millimeter-offset' src/environment/authoredKphxGround.js
      - name: Commit normalized evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/environment/authoredKphxGround.js
          git commit -m "Materialize pavement-coincident marking evidence"
          git push origin HEAD:work/simulator-quality-inspection-pass
