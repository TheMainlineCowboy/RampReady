name: KPHX MisterX Raw Batch 02 GSE

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-misterx-raw-batch-02.yml"

permissions:
  contents: write

concurrency:
  group: kphx-misterx-raw-batch-02
  cancel-in-progress: false

jobs:
  move-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Configure checkpoint commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cargo Dollies exact source
        shell: bash
        run: |
          set -euo pipefail
          BASE="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Vehicles"
          mkdir -p "$BASE"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1Gs2bxkYBXhGHSiYg3M2eVpVpQ29tB9C7" -O "$BASE/Cargo_Dollies"
          find "$BASE/Cargo_Dollies" -type f -print0 | sort -z | xargs -0 sha256sum > assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02A-SHA256SUMS.txt
          git add "$BASE/Cargo_Dollies" assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02A-SHA256SUMS.txt
          git commit -m "Move exact MisterX Cargo Dollies source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: GPUs exact source
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin kphx-full-airport-import
          BASE="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Vehicles"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1EjrUa1Bu9NxNqXrxWM6IMQf8EGdKc9_V" -O "$BASE/GPUs"
          find "$BASE/GPUs" -type f -print0 | sort -z | xargs -0 sha256sum > assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02B-SHA256SUMS.txt
          git add "$BASE/GPUs" assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02B-SHA256SUMS.txt
          git commit -m "Move exact MisterX GPU source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import

      - name: Pushback Trucks exact source
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin kphx-full-airport-import
          BASE="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Vehicles"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1hk1hDfgooevN4rpzQA2M3aTQYboy_P_0" -O "$BASE/Pushback_Trucks"
          find "$BASE/Pushback_Trucks" -type f -print0 | sort -z | xargs -0 sha256sum > assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02C-SHA256SUMS.txt
          git add "$BASE/Pushback_Trucks" assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02C-SHA256SUMS.txt
          git commit -m "Move exact MisterX Pushback Trucks source"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
