name: KPHX MisterX Raw Batch 02 GSE

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-misterx-raw-batch-02.yml"

permissions:
  contents: write

concurrency:
  group: kphx-misterx-raw-batch-02
  cancel-in-progress: false

jobs:
  move-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Install Drive downloader
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Download exact MisterX GSE folders
        shell: bash
        run: |
          set -euo pipefail
          BASE="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library/Airport/Vehicles"
          mkdir -p "$BASE"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1Gs2bxkYBXhGHSiYg3M2eVpVpQ29tB9C7" -O "$BASE/Cargo_Dollies"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1EjrUa1Bu9NxNqXrxWM6IMQf8EGdKc9_V" -O "$BASE/GPUs"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1hk1hDfgooevN4rpzQA2M3aTQYboy_P_0" -O "$BASE/Pushback_Trucks"
          gdown --folder --remaining-ok "https://drive.google.com/drive/folders/1losEzRx0AEgzHznM5CaddhID-kKKGtYl" -O "$BASE/Fuel_Trucks"

      - name: Record exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="assets/kphx-source/dependencies/MisterX_Library_2.0c/MisterX_Library"
          find "$ROOT/Airport/Vehicles/Cargo_Dollies" "$ROOT/Airport/Vehicles/GPUs" "$ROOT/Airport/Vehicles/Pushback_Trucks" "$ROOT/Airport/Vehicles/Fuel_Trucks"             -type f -print0 | sort -z | xargs -0 sha256sum > assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02-SHA256SUMS.txt
          find "$ROOT/Airport/Vehicles/Cargo_Dollies" "$ROOT/Airport/Vehicles/GPUs" "$ROOT/Airport/Vehicles/Pushback_Trucks" "$ROOT/Airport/Vehicles/Fuel_Trucks"             -type f | sort > assets/kphx-source/dependencies/MisterX_Library_2.0c/BATCH-02-FILES.txt

      - name: Commit exact raw MisterX batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kphx-source/dependencies/MisterX_Library_2.0c
          git commit -m "Move exact MisterX GSE raw batch 02"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
