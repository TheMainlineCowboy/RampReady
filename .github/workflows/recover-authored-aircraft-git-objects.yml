name: Recover Authored Aircraft Git Objects

on:
  push:
    branches: [fix/authored-aircraft-live]
    paths:
      - .github/workflows/recover-authored-aircraft-git-objects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-git-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authored-aircraft-live
          fetch-depth: 0

      - name: Fetch every branch and pull-request head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force origin '+refs/pull/*/head:refs/remotes/pull/*' || true

      - name: Recover exact legacy payload blobs by immutable Git object identity
        shell: bash
        run: |
          set -euo pipefail
          dir=assets/aircraft/crj700-user.glb.br.parts
          mkdir -p "$dir"
          cat > /tmp/exact-tail.txt <<'EOF'
          057 861c2371a193fde9db84338472aa529785d1e63d
          058 35312bcfbc428c382e976749634dd5aea5c74bac
          059 125f79dd59aa393f89b402959a1e5d8cd38bdb2b
          060 8dfea0bdfa35ea1b074256fdd49b4428547c1c8b
          061 74518e73d1b5bb0fb98a1e28c0a19dd687953d43
          062 d20fd2dae97baba25742f70b28724a284c26f277
          063 39cba571d920f08aa5087c2eeac5a845ce858162
          064 19b76fbacf61e7cf3de7fd585d3d13f8d2552310
          065 0a7ae8a0ca6d71ac72095371e05387087f877293
          066 cd8b45b8ff2f2d2b7801a63b5a30001a571e2e36
          067 5f83812f695898b3ad8e1ab8e12efec7ffe46e17
          068 efecf1a2efb1f4aa2df9f13f2505f874e59c9f23
          069 3f623dede4cb0e977b94c6922295ebac9e2052fc
          070 e90e5f3a5ce3cb54bcad96029e4d938eabfd7895
          071 0b59d71e5e4ce97f4b848b333991183317e671a8
          072 f1f8e68f4077ea95b134a89252dc599f16bd5ba5
          073 228f5a98d23ee1d87b43f908f7e36d41c2f403a
          074 f9e32cf842b1ca38c6f042296e62a0c28a79fb6a
          075 2fc6062942ffc48df6955872444d49c81a78b579
          076 756abae0dfe52bdc54623e1fbf286bdd90719ddf
          077 584b0a31e9262dd8a9596203567b8cc2c9a7739c
          078 efeccebf5013aa6123e5fa3ff785117e7f2c0b8f
          EOF
          missing=0
          while read -r idx sha; do
            if git cat-file -e "${sha}^{blob}" 2>/dev/null; then
              git cat-file blob "$sha" > "$dir/part-${idx}.b64"
              actual=$(git hash-object "$dir/part-${idx}.b64")
              test "$actual" = "$sha"
              echo "Recovered exact part ${idx} ${sha}"
            else
              echo "MISSING exact Git blob part ${idx} ${sha}"
              missing=$((missing+1))
            fi
          done < /tmp/exact-tail.txt
          test "$missing" = 0

      - name: Materialize and verify exact authored aircraft
        run: |
          set -euo pipefail
          node scripts/materialize-authored-aircraft.mjs
          test "$(stat -c%s public/models/crj700-user.glb)" = 1873128
          test "$(sha256sum public/models/crj700-user.glb | awk '{print $1}')" = 01383b502fa9a5e0aca3b5cc4a90b5ffe82d52160778bc309e2de73579b1056b
          printf glTF | cmp -n 4 - public/models/crj700-user.glb
          npm ci
          npm run verify
          npm run build

      - name: Commit exact recovered payload and runtime aircraft
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RampReady aircraft recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/aircraft/crj700-user.glb.br.parts public/models/crj700-user.glb public/models/crj700-user.asset.json assets/aircraft/crj700-user.glb.br || true
          if git diff --cached --quiet; then
            echo 'Exact payload already present.'
            exit 0
          fi
          git commit -m 'Recover exact authored aircraft payload tail'
          git push origin HEAD:fix/authored-aircraft-live
