name: KPHX XP12 macOS Installer UI Probe

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp12-macos-ui-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            reports
          sparse-checkout-cone-mode: false

      - name: Launch official installer and capture main menu
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/xp12-installer reports
          curl -L --fail --retry 4 --show-error             "https://lookup.x-plane.com/_lookup_12_/download/X-Plane12InstallerMac.zip"             -o /tmp/xp12-installer.zip
          ditto -x -k /tmp/xp12-installer.zip /tmp/xp12-installer
          BIN="$(find /tmp/xp12-installer -type f -path '*/Contents/MacOS/*' -iname '*Installer*' -print -quit)"
          if [ -z "$BIN" ]; then
            BIN="$(find /tmp/xp12-installer -type f -path '*/Contents/MacOS/*' -print -quit)"
          fi
          test -n "$BIN"
          chmod +x "$BIN"

          "$BIN" --lang=en --install_numeric=121212             --install_name="X-Plane 12.1.2-r4-0f2fea01"             --no_web_server >/tmp/xp12-ui.out 2>/tmp/xp12-ui.err &
          PID=$!
          echo "$PID" >/tmp/xp12-ui.pid
          sleep 12

          swift - "$PID" <<'SWIFT' > /tmp/window-id.txt
          import AppKit
          import CoreGraphics
          import Foundation

          let pid = pid_t(Int(CommandLine.arguments[1])!)
          NSRunningApplication(processIdentifier: pid)?.activate(options: [.activateIgnoringOtherApps])
          usleep(1_000_000)
          let options: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
          if let info = CGWindowListCopyWindowInfo(options, kCGNullWindowID) as? [[String: Any]] {
              for w in info {
                  let ownerPid = (w[kCGWindowOwnerPID as String] as? NSNumber)?.int32Value ?? -1
                  let layer = (w[kCGWindowLayer as String] as? NSNumber)?.intValue ?? -1
                  if ownerPid == pid && layer == 0 {
                      let number = (w[kCGWindowNumber as String] as? NSNumber)?.intValue ?? 0
                      print(number)
                      break
                  }
              }
          }
          SWIFT
          WINID="$(tail -1 /tmp/window-id.txt | tr -d '[:space:]')"
          test -n "$WINID"
          test "$WINID" -gt 0
          screencapture -x -l "$WINID" reports/kphx-xp12-macos-main-menu.png

          swift - "$PID" "$WINID" <<'SWIFT' > reports/kphx-xp12-macos-window-info.txt
          import CoreGraphics
          import Foundation
          let pid = pid_t(Int(CommandLine.arguments[1])!)
          let win = Int(CommandLine.arguments[2])!
          let options: CGWindowListOption = [.optionIncludingWindow]
          if let info = CGWindowListCopyWindowInfo(options, CGWindowID(win)) as? [[String: Any]] {
              for w in info { print(w) }
          }
          SWIFT

          swift - reports/kphx-xp12-macos-main-menu.png <<'SWIFT' > reports/kphx-xp12-macos-menu-text.txt
          import Foundation
          import Vision
          import AppKit
          let url = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let image = NSImage(contentsOf: url),
                let cg = image.cgImage(forProposedRect: nil, context: nil, hints: nil) else { fatalError("image") }
          let width=Double(cg.width), height=Double(cg.height)
          let request=VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.recognitionLanguages = ["en-US"]
          let handler=VNImageRequestHandler(cgImage: cg, options: [:])
          try handler.perform([request])
          print("image_width=\(Int(width))")
          print("image_height=\(Int(height))")
          for obs in request.results ?? [] {
              guard let top=obs.topCandidates(1).first else { continue }
              let b=obs.boundingBox
              let x=b.origin.x*width
              let y=(1.0-b.origin.y-b.size.height)*height
              let w=b.size.width*width
              let h=b.size.height*height
              print(String(format:"TEXT|%.1f|%.1f|%.1f|%.1f|%.1f|%.1f|%@",x,y,w,h,x+w/2,y+h/2,top.string))
          }
          SWIFT

          {
            echo "pid=$PID"
            ps -p "$PID" -o pid,ppid,stat,etime,command || true
            echo "=== stdout ==="
            cat /tmp/xp12-ui.out || true
            echo "=== stderr ==="
            cat /tmp/xp12-ui.err || true
            echo "=== installer log tail ==="
            tail -300 "$HOME/X-Plane Installer Log.txt" 2>/dev/null || true
          } > reports/kphx-xp12-macos-ui-probe.txt

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          test -s reports/kphx-xp12-macos-main-menu.png
          test -s reports/kphx-xp12-macos-window-info.txt
          test -s reports/kphx-xp12-macos-menu-text.txt
          cat reports/kphx-xp12-macos-window-info.txt
          cat reports/kphx-xp12-macos-menu-text.txt
          grep -Ei 'Install.*Free.*Demo|Free Demo|Install X-Plane|Update X-Plane|Add or Remove Scenery' reports/kphx-xp12-macos-menu-text.txt

      - name: Commit UI evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             reports/kphx-xp12-macos-main-menu.png             reports/kphx-xp12-macos-window-info.txt             reports/kphx-xp12-macos-ui-probe.txt
          git commit -m "Capture XP12 macOS installer main menu"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
