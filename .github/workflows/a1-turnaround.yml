name: A1 turnaround first-playable review
on:
  pull_request:
    paths:
      - 'src/components/A1TurnaroundBoard.jsx'
      - 'src/components/a1-turnaround.css'
      - 'src/components/PushbackTrainer.jsx'
      - 'src/components/RampReadyStandupTrainer.jsx'
      - 'src/components/RampReadyStandupTrainerTerminal4.jsx'
      - 'src/simulation/a1TurnaroundMission.js'
      - 'tests/a1TurnaroundMission.test.mjs'
      - 'tests/a1TurnaroundBrowser.mjs'
      - '.github/workflows/a1-turnaround.yml'
  workflow_dispatch:
jobs:
  mission-contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run A1 mission state tests
        run: node --test tests/a1TurnaroundMission.test.mjs
      - name: Build review runtime
        run: npx vite build
      - name: Install temporary Chromium smoke-test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Smoke-test real A1 mission UI on mobile viewport
        run: node tests/a1TurnaroundBrowser.mjs
      - name: Upload UI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rampready-a1-mobile-preview
          path: artifacts/a1/*.png
          if-no-files-found: warn
          retention-days: 14
