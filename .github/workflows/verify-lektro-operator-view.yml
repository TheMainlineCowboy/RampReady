name: Verify LEKTRO Operator View

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-lektro-operator-view.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start RampReady
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/lektro-operator-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lektro-operator-vite.log
          exit 1

      - name: Verify Operator View uses R187A driver seat
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });

          await page.goto("http://127.0.0.1:4173/RampReady/?inspectionPreset=a1", {
            waitUntil: "domcontentloaded",
            timeout: 60000,
          });

          await page.waitForFunction(() => {
            const d = document.querySelector("canvas.trainerCanvas")?.dataset || {};
            return d.tugSource === "lektro-ap88-tvo914-r187a";
          }, null, { timeout: 60000 });

          await page.selectOption('select[aria-label="Camera view"]', "driver");

          await page.waitForFunction(() => {
            const d = document.querySelector("canvas.trainerCanvas")?.dataset || {};
            const cx=Number(d.lektroOperatorCameraX), cy=Number(d.lektroOperatorCameraY), cz=Number(d.lektroOperatorCameraZ);
            const ex=Number(d.lektroOperatorEyeWorldX), ey=Number(d.lektroOperatorEyeWorldY), ez=Number(d.lektroOperatorEyeWorldZ);
            if (![cx,cy,cz,ex,ey,ez].every(Number.isFinite)) return false;
            return d.lektroOperatorViewAuthority === "r187a-driver-seat-after-180deg-model-forward-correction"
              && Math.hypot(cx-ex,cy-ey,cz-ez) < 0.05;
          }, null, { timeout: 15000 });

          const state = await page.evaluate(() => {
            const d = document.querySelector("canvas.trainerCanvas")?.dataset || {};
            const camera=[Number(d.lektroOperatorCameraX),Number(d.lektroOperatorCameraY),Number(d.lektroOperatorCameraZ)];
            const eye=[Number(d.lektroOperatorEyeWorldX),Number(d.lektroOperatorEyeWorldY),Number(d.lektroOperatorEyeWorldZ)];
            return {
              tugSource:d.tugSource || null,
              operatorSide:d.operatorSide || null,
              localEye:[Number(d.lektroOperatorEyeLocalX),Number(d.lektroOperatorEyeLocalY),Number(d.lektroOperatorEyeLocalZ)],
              worldEye:eye,
              camera,
              cameraToEyeMeters:Math.hypot(camera[0]-eye[0],camera[1]-eye[1],camera[2]-eye[2]),
              authority:d.lektroOperatorViewAuthority || null,
              modelForwardCorrectionDegrees:Number(d.tugModelForwardCorrectionDegrees || 0),
            };
          });

          const failures=[];
          if (state.tugSource !== "lektro-ap88-tvo914-r187a") failures.push("wrong visual source");
          if (state.operatorSide !== "right") failures.push(`operatorSide=${state.operatorSide}`);
          if (Math.abs(state.localEye[0] - 0.45) > 0.001) failures.push(`operator eye X=${state.localEye[0]}`);
          if (Math.abs(state.localEye[1] - 1.35) > 0.001) failures.push(`operator eye Y=${state.localEye[1]}`);
          if (Math.abs(state.localEye[2] + 2.15) > 0.001) failures.push(`operator eye Z=${state.localEye[2]}`);
          if (state.modelForwardCorrectionDegrees !== 180) failures.push(`model correction=${state.modelForwardCorrectionDegrees}`);
          if (state.cameraToEyeMeters >= 0.05) failures.push(`camera offset=${state.cameraToEyeMeters}`);
          if (errors.length) failures.push(`browser errors: ${errors.join(" | ")}`);

          const report={
            schemaVersion:1,
            status:failures.length ? "FAIL" : "PASS",
            visualSource:"LEKTRO_AP88_TVO914.glb R187A",
            authoredDriverEvidence:{
              steeringColumnSourceXApprox:-0.44,
              runtimeDriverSeatXAfterModelForwardCorrection:0.45,
              previousPassengerSeatCameraX:-0.45,
            },
            state,
            failures,
          };
          fs.writeFileSync("reports/lektro-r187a-operator-view-live.json",JSON.stringify(report,null,2)+"\n");
          await page.screenshot({path:"reports/lektro-r187a-operator-view-live.jpg",type:"jpeg",quality:90,fullPage:true});
          await browser.close();

          if(failures.length) throw new Error(failures.join("; "));
          console.log(JSON.stringify(report,null,2));
          NODE

      - name: Commit operator-view evidence
        run: |
          git restore -- package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lektro-r187a-operator-view-live.json reports/lektro-r187a-operator-view-live.jpg
          git commit -m "Verify LEKTRO operator view driver seat"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
