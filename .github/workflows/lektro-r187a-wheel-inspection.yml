name: Verify LEKTRO R187A Rear Steering

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-lektro-wheel-inspection.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Inspect finalized R187A GLB nodes
        run: node scripts/inspect-lektro-r187a-glb-nodes.mjs

      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start RampReady
        run: |
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/lektro-steer-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lektro-steer-vite.log
          exit 1

      - name: Verify authored rear steering pivots move and recenter
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          const errors = [];
          page.on("pageerror", (e) => errors.push(String(e)));
          page.on("console", (m) => { if (m.type() === "error") errors.push(m.text()); });

          await page.goto("http://127.0.0.1:4173/RampReady/?inspectionPreset=a1", {
            waitUntil: "domcontentloaded",
            timeout: 60000,
          });

          await page.waitForFunction(() => {
            const d = document.querySelector("canvas.trainerCanvas")?.dataset || {};
            return d.tugSource === "lektro-ap88-tvo914-r187a"
              && d.lektroAuthoredRearSteerBinding === "AP88_STEER_L_STEER|AP88_STEER_R_STEER"
              && d.lektroAuthoredRearSteerMode === "copy-validated-physics-visual-angle";
          }, null, { timeout: 60000 });

          const read = () => page.evaluate(() => {
            const d = document.querySelector("canvas.trainerCanvas")?.dataset || {};
            return {
              binding: d.lektroAuthoredRearSteerBinding || null,
              mode: d.lektroAuthoredRearSteerMode || null,
              radians: Number(d.lektroAuthoredRearSteerRadians || 0),
              degrees: Number(d.lektroAuthoredRearSteerDegrees || 0),
              maxVisualDegrees: Number(d.rigVisualMaxSteerDegrees || 0),
              steeringMode: d.steeringMode || null,
            };
          });

          const centeredBefore = await read();

          await page.keyboard.down("a");
          await page.waitForFunction(() => {
            const degrees = Number(document.querySelector("canvas.trainerCanvas")?.dataset?.lektroAuthoredRearSteerDegrees || 0);
            return Math.abs(degrees) > 5;
          }, null, { timeout: 10000 });
          const leftSteer = await read();

          await page.keyboard.up("a");
          await page.waitForFunction(() => {
            const degrees = Number(document.querySelector("canvas.trainerCanvas")?.dataset?.lektroAuthoredRearSteerDegrees || 999);
            return Math.abs(degrees) < 0.5;
          }, null, { timeout: 10000 });
          const centeredAfter = await read();

          const failures = [];
          if (centeredBefore.steeringMode !== "rear") failures.push("rig is not rear-steer");
          if (centeredBefore.binding !== "AP88_STEER_L_STEER|AP88_STEER_R_STEER") failures.push("authored pivot binding mismatch");
          if (Math.abs(leftSteer.degrees) <= 5) failures.push(`authored pivots did not visibly steer: ${leftSteer.degrees} deg`);
          if (Math.abs(centeredAfter.degrees) >= 0.5) failures.push(`authored pivots did not recenter: ${centeredAfter.degrees} deg`);
          if (errors.length) failures.push(`browser errors: ${errors.join(" | ")}`);

          const report = {
            schemaVersion: 1,
            status: failures.length ? "FAIL" : "PASS",
            visualSource: "LEKTRO_AP88_TVO914.glb R187A",
            binding: centeredBefore.binding,
            mode: centeredBefore.mode,
            centeredBefore,
            leftSteer,
            centeredAfter,
            failures,
          };
          fs.writeFileSync("reports/lektro-r187a-rear-steering-live.json", JSON.stringify(report, null, 2) + "\n");
          await page.screenshot({ path: "reports/lektro-r187a-rear-steering-live.jpg", type: "jpeg", quality: 90, fullPage: true });
          await browser.close();

          if (failures.length) throw new Error(failures.join("; "));
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Commit steering evidence
        run: |
          git restore -- package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/lektro-r187a-node-inspection.json reports/lektro-r187a-rear-steering-live.json reports/lektro-r187a-rear-steering-live.jpg
          git commit -m "Verify LEKTRO R187A rear steering"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
