name: KPHX XP12 Targeted DRM Disassembly

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-xp12-drm-disassembly.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 1
          sparse-checkout: |
            reports
          sparse-checkout-cone-mode: false

      - name: Disassemble only XP12 installer DRM/download functions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y binutils >/dev/null
          mkdir -p /tmp/xp12 reports
          curl -L --fail --retry 4 --show-error             "https://lookup.x-plane.com/_lookup_12_/download/X-Plane12InstallerLinux.zip"             -o /tmp/xp12.zip
          unzip -q /tmp/xp12.zip -d /tmp/xp12
          BIN="$(find /tmp/xp12 -maxdepth 3 -type f -iname '*Installer*Linux*' -print -quit)"
          test -n "$BIN"
          {
            echo "=== UTL_download_server_list 0x797960..0x79a290 ==="
            objdump -d -C -M intel --no-show-raw-insn               --start-address=0x797960 --stop-address=0x79a290 "$BIN"
            echo
            echo "=== UTL_request_xdd_auth 0x79bdd0..0x79c2f0 ==="
            objdump -d -C -M intel --no-show-raw-insn               --start-address=0x79bdd0 --stop-address=0x79c2f0 "$BIN"
            echo
            echo "=== UTL_check_xdd_auth 0x79c2f0..0x79d200 ==="
            objdump -d -C -M intel --no-show-raw-insn               --start-address=0x79c2f0 --stop-address=0x79d200 "$BIN"
          } > reports/kphx-xp12-targeted-drm-disassembly.txt
          wc -l reports/kphx-xp12-targeted-drm-disassembly.txt

      - name: Commit targeted DRM disassembly
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-xp12-targeted-drm-disassembly.txt
          git commit -m "Disassemble XP12 installer DRM download functions"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
