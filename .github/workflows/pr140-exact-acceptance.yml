name: PR 140 exact jetway acceptance

on:
  pull_request:
    branches:
      - maintenance/pr140-acceptance-base
    types: [opened, synchronize, reopened]
    paths:
      - .pr140-acceptance-trigger
  push:
    branches:
      - maintenance/pr140-acceptance-run
    paths:
      - .pr140-acceptance-trigger
      - .github/workflows/pr140-exact-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr140-exact-jetway-acceptance
  cancel-in-progress: true

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLAYWRIGHT_WEB_SERVER_COMMAND: npm run preview -- --port 4173 --strictPort
    steps:
      - name: Resolve exact current PR 140 head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/${GITHUB_REPOSITORY}/pulls/140 --jq .head.sha)"
          test -n "${sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Exact PR 140 head: ${sha}"

      - name: Publish exact-head acceptance pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context='PR140 exact visual acceptance' \
            -f description='Exact-head verification and visual render are running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact PR 140 head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact supplied jetway assets and repair contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-a1-measured-ground-contact-contract.mjs
          node scripts/verify-a1-evidence-subview-contract.mjs
          node scripts/verify-terminal4-static-cab-closure-contract.mjs
          node scripts/materialize-exact-airport-jetway.mjs
          node scripts/verify-exact-airport-jetway-runtime.mjs
          node scripts/verify-uploaded-airport-jetway-fleet.mjs
          node scripts/verify-uploaded-airport-jetway-articulation-v10.mjs

      - name: Run complete RampReady verification
        run: npm run verify

      - name: Build exact production artifact
        run: npm run build

      - name: Reapply and freeze strict browser acceptance migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-current-head-browser-expectations-v1.mjs
          node scripts/prepare-a1-post-lifecycle-evidence-v1.mjs
          node scripts/prepare-a1-bogie-centroid-browser-authority-v1.mjs
          node scripts/verify-a1-measured-ground-contact-contract.mjs
          node scripts/verify-a1-evidence-subview-contract.mjs
          for spec in \
            tests/browser/a1-ground-contact-evidence.spec.js \
            tests/browser/a1-terminal-joint-bogie-subviews.spec.js \
            tests/browser/kphx-ground-runtime.spec.js \
            tests/browser/uploaded-jetway-articulation-v10.spec.js; do
            if grep -Fq 'measured-cab-normal-aircraft-heading-v1' "${spec}"; then
              echo "Retired Cab-normal heading survived in ${spec}"
              exit 1
            fi
          done
          grep -Fq 'source-a1-parking-heading-authored-door-registration-v2' tests/browser/a1-terminal-joint-bogie-subviews.spec.js
          grep -Fq 'Math.abs(Number(data?.inspectionAircraftYaw) - 0.008569641) <= 0.001' tests/browser/a1-terminal-joint-bogie-subviews.spec.js
          grep -Fq 'source-a1-parking-heading-authored-door-registration-v2' tests/browser/kphx-ground-runtime.spec.js
          mkdir -p retained-evidence/generated-browser-specs
          cp tests/browser/a1-ground-contact-evidence.spec.js retained-evidence/generated-browser-specs/
          cp tests/browser/a1-terminal-joint-bogie-subviews.spec.js retained-evidence/generated-browser-specs/
          cp tests/browser/kphx-ground-runtime.spec.js retained-evidence/generated-browser-specs/
          cp tests/browser/uploaded-jetway-articulation-v10.spec.js retained-evidence/generated-browser-specs/
          echo 'Frozen production dist and strict exact browser specs are ready; Playwright preview will not rebuild or restore them.'

      - name: Quiet fail-closed generated A1 evidence checks
        shell: bash
        run: |
          set -euo pipefail
          search=(grep -R -I --exclude='*.glb' --exclude='*.bin' --fixed-strings --quiet)
          for forbidden in \
            'terminal-relocated-a1-exact-cab-registration-v1' \
            'named-landing-gear-wheel-bounds-v1' \
            'grounded-aircraft-wheel-contact-progressive-tunnel-slope-v2' \
            'grounded-aircraft-door-progressive-tunnel-slope-v1' \
            'measured-cab-normal-aircraft-heading-v1' \
            'expectedCabRegisteredYaw' \
            'exact-T4_WALK-A1-terminal-portal-v25' \
            'exactWalkwayPortalX' \
            'exactA1CabContactY += appliedA1JetwayVerticalFitMeters' \
            'exactA1CameraCabX - exactA1CameraApronX * 6'; do
            if "${search[@]}" "${forbidden}" dist; then
              echo "Forbidden generated A1 behavior remains: ${forbidden}"
              exit 1
            fi
          done
          for required in \
            'measured-a1-cab-inspection-pose-persisted-across-mode-toggle-v2' \
            'source-a1-parking-heading-authored-door-registration-v2' \
            'inspectionAircraftSourceParkingHeadingDegrees' \
            'inspectionAircraftSourceModelYawDegrees' \
            'grounded-jetway-door-gap-reported-no-child-lift-v1' \
            'inspectionAircraftDoorSignedVerticalGapMeters' \
            'inspectionAircraftJetwayRequestedVerticalFitMeters' \
            'inspectionAircraftJetwayVerticalFitMeters' \
            'inspectionAircraftJetwayAuthoredBogieGroundPreserved' \
            'authored-crj-lowest-geometry-contact-clusters-v2' \
            'exact-authored-a1-lowest-geometry-ramp-contact-v2' \
            'terminal4UploadedJetwayBogieGroundContactPointCount' \
            'terminal4UploadedJetwayBogieGroundContactClusterCount' \
            'terminal4UploadedJetwayBogieGroundHorizontalContactSpanMeters' \
            'terminal4UploadedJetwayBogieGroundContactCenterX' \
            'terminal4UploadedJetwayBogieGroundContactCenterY' \
            'terminal4UploadedJetwayBogieGroundContactCenterZ' \
            'inspectionCameraEndpointJointCenter' \
            'inspectionCameraEndpointJointApronDistanceMeters' \
            'inspectionCameraEndpointJointSideDistanceMeters' \
            'inspectionCameraEndpointBogieContactCenter' \
            'inspectionCameraEndpointBogieAircraftCenter' \
            'inspectionCameraEndpointBogieAircraftOppositionCosine' \
            'same-day-a1-continuous-compact-solid-closed-grounded-v1' \
            'exact-a1-terminal-joint-and-bogie-contact-subviews-v2' \
            '57-static-aircraft-facing-cab-portals-opaque-contact-plane-caps-v3' \
            '57-static-cab-endpoints-opaque-zero-open-area-no-authored-transform-v1' \
            'final-a1-acceptance-authority-after-all-preparers-v1'; do
            if ! "${search[@]}" "${required}" dist; then
              echo "Required generated A1 evidence is missing: ${required}"
              exit 1
            fi
          done
          echo "Quiet generated-bundle v2 checks passed with authored A1 aircraft heading."

      - name: Install browser verifier and Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Diagnose exact A1 readiness
        run: >-
          npx playwright test
          tests/browser/a1-close-readiness-diagnostic.spec.js
          --reporter=line --workers=1

      - name: Preflight exact A1 connection telemetry
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          npx playwright test tests/browser/uploaded-jetway-articulation-v10.spec.js \
            --reporter=json --workers=1 > test-results/a1-preflight-report.json
          status=$?
          set -e
          exit "${status}"

      - name: Render and verify A1, articulation, Terminal 4 and full airport
        run: >-
          npx playwright test
          tests/browser/a1-jetway-contact-clusters.spec.js
          tests/browser/a1-ground-contact-evidence.spec.js
          tests/browser/a1-terminal-joint-bogie-subviews.spec.js
          tests/browser/source-first-a1-repair.spec.js
          tests/browser/terminal4-static-cab-closure-evidence.spec.js
          tests/browser/uploaded-jetway-articulation-v10.spec.js
          tests/browser/kphx-ground-runtime.spec.js
          tests/browser/full-airport-inspection.spec.js
          --reporter=line --workers=1

      - name: Upload exact current-head visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr140-exact-acceptance-${{ steps.pr.outputs.sha }}
          path: |
            retained-evidence/
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 1

      - name: Publish exact-head acceptance success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context='PR140 exact visual acceptance' \
            -f description='Exact-head contracts, build and browser evidence passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish exact-head acceptance failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          test -n "${SHA}" || exit 0
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=failure \
            -f context='PR140 exact visual acceptance' \
            -f description='Exact-head acceptance failed; inspect workflow logs and retained evidence' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
