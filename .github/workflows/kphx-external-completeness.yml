name: KPHX External Completeness Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - ".github/workflows/kphx-external-completeness.yml"
      - "scripts/report-kphx-external-completeness.mjs"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0
      - name: Build loaded unresolved inventory
        run: node scripts/report-kphx-external-completeness.mjs
      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/kphx-external-loaded-unresolved-inventory.json
          git commit -m "Record exact KPHX external loaded unresolved inventory"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
