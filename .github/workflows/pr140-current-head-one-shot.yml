name: PR 140 one-shot current-head acceptance

on:
  push:
    branches:
      - maintenance/pr140-acceptance-run
    paths:
      - .github/workflows/pr140-current-head-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pr140-one-shot-current-head-acceptance
  cancel-in-progress: true

jobs:
  exact-current-head:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve exact PR 140 head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/${GITHUB_REPOSITORY}/pulls/140 --jq .head.sha)"
          test -n "${sha}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state=pending \
            -f context='PR140 one-shot exact acceptance' \
            -f description='Exact current-head Terminal 4 verification is running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out exact PR 140 head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify current repair contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-a1-measured-ground-contact-contract.mjs
          node scripts/verify-a1-evidence-subview-contract.mjs
          node scripts/verify-a1-grounded-lifecycle-order-v1.mjs
          node scripts/verify-terminal4-static-cab-closure-contract.mjs
          node scripts/materialize-exact-airport-jetway.mjs
          node scripts/verify-exact-airport-jetway-runtime.mjs
          node scripts/verify-uploaded-airport-jetway-fleet.mjs
          node scripts/verify-uploaded-airport-jetway-articulation-v10.mjs

      - name: Run repository verification
        run: npm run verify

      - name: Build exact production artifact
        run: npm run build

      - name: Reject stale walkway and floating-jetway behavior
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in \
            'exact-T4_WALK-A1-terminal-portal-v25' \
            'exactWalkwayPortalX' \
            'grounded-aircraft-door-progressive-tunnel-slope-v1' \
            'grounded-aircraft-wheel-contact-progressive-tunnel-slope-v2' \
            'exactA1CabContactY += appliedA1JetwayVerticalFitMeters' \
            'finitePositive(placement.bridgeEnd, 18)'; do
            if grep -R --fixed-strings --line-number "${forbidden}" dist; then
              echo "Forbidden Terminal 4 behavior remains: ${forbidden}"
              exit 1
            fi
          done
          for required in \
            'grounded-jetway-door-gap-reported-no-child-lift-v1' \
            'exact-authored-a1-lowest-geometry-ramp-contact-v1' \
            'same-day-a1-continuous-compact-solid-closed-grounded-v1' \
            'exact-a1-terminal-joint-and-bogie-contact-subviews-v1' \
            'placement-bridgeEnd-shared-with-static-articulation-v1' \
            '57-static-aircraft-facing-cab-portals-opaque-contact-plane-caps-v3' \
            '57-static-cab-endpoints-opaque-zero-open-area-no-authored-transform-v1' \
            'inspectionAircraftJetwayAuthoredBogieGroundPreserved' \
            'terminal4UploadedJetwayBogieGroundContactClusterCount' \
            'terminal4UploadedJetwayA1VisibleVestibuleLengthMeters' \
            'terminal4UploadedJetwayStaticBridgeEndFallbackCount' \
            'terminal4UploadedJetwayStaticApronFacingOpenAreaMeters'; do
            grep -R --fixed-strings --line-number "${required}" dist
          done

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and verify exact current-head evidence
        run: >-
          npx playwright test
          tests/browser/a1-jetway-contact-clusters.spec.js
          tests/browser/a1-ground-contact-evidence.spec.js
          tests/browser/a1-terminal-joint-bogie-subviews.spec.js
          tests/browser/source-first-a1-repair.spec.js
          tests/browser/terminal4-static-cab-closure-evidence.spec.js
          tests/browser/uploaded-jetway-articulation-v10.spec.js
          tests/browser/kphx-ground-runtime.spec.js
          tests/browser/full-airport-inspection.spec.js
          --reporter=line --workers=1

      - name: Upload exact current-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr140-one-shot-${{ steps.pr.outputs.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 1

      - name: Publish success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context='PR140 one-shot exact acceptance' \
            -f description='Exact current-head Terminal 4 contracts, build and renders passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          test -n "${SHA}" || exit 0
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=failure \
            -f context='PR140 one-shot exact acceptance' \
            -f description='Exact current-head Terminal 4 acceptance failed; inspect retained evidence' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
