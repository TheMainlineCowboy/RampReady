name: KPHX Manager Kubota Inspection Check

on:
  push:
    branches:
      - kphx-full-airport-import
    paths:
      - reports/trigger-manager-kubota-inspection.txt

permissions:
  contents: write

concurrency:
  group: kphx-manager-kubota-inspection
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-airport-import
          fetch-depth: 0

      - name: Verify exact Kubota bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s public/models/manager-kubota/RampReady-manager-Kubota-exact.glb)" = "23988388"
          echo "726fdcb3511e6d52990da11118be4ca8a8b73c5d5c8f5bde4f934131e3c31b7d  public/models/manager-kubota/RampReady-manager-Kubota-exact.glb" | sha256sum -c -

      - name: Install app and browser
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start RampReady
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite --host 127.0.0.1 --port 4173 > /tmp/kubota-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/RampReady/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kubota-vite.log
          exit 1

      - name: Verify exact Kubota free-drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const pageErrors = [];
          const failedRequests = [];
          page.on("pageerror", e => pageErrors.push(String(e)));
          page.on("requestfailed", r => failedRequests.push({ url:r.url(), error:r.failure()?.errorText || "unknown" }));

          await page.goto("http://127.0.0.1:4173/RampReady/", { waitUntil:"domcontentloaded", timeout:60000 });
          const kubota = page.getByRole("radio", { name:/Manager Kubota RTV/i });
          await kubota.waitFor({ state:"visible", timeout:30000 });
          await kubota.click();

          const training = page.getByRole("button", { name:"Start training" });
          const inspection = page.getByRole("button", { name:"Drive vehicle / inspect airport" });
          if (!(await training.isDisabled())) throw new Error("Kubota training button must remain disabled");
          if (await inspection.isDisabled()) throw new Error("Kubota inspection button must be enabled");
          await inspection.click();

          await page.waitForFunction(() => {
            const canvas=document.querySelector("canvas.trainerCanvas");
            const d=canvas?.dataset || {};
            return d.tugSource==="manager-kubota-exact"
              && d.rigProfile==="manager-kubota-exact"
              && d.steeringMode==="front"
              && d.rigWheelbaseMeters==="1.94"
              && d.rigFreeMaxSpeedMps==="9.2"
              && d.tugModelForwardCorrectionDegrees==="0"
              && d.kphxExactLiveT4==="ready"
              && d.kphxSurfaceReady==="true"
              && d.kphxA1ZdpMarkingsReady==="true";
          }, null, { timeout:180000 });

          const shell = page.locator(".rr-shell");
          if (await shell.getAttribute("data-equipment-id") !== "manager-kubota") throw new Error("Kubota shell equipment ID missing");
          if (await shell.getAttribute("data-inspection-mode") !== "active") throw new Error("Kubota did not launch in inspection mode");

          const speedText = page.locator(".rr-metrics").getByText(/mph$/).first();
          await page.keyboard.down("w");
          await page.waitForTimeout(1400);
          await page.keyboard.up("w");
          await page.waitForTimeout(250);
          const text = await speedText.textContent();
          const mph = Number.parseFloat(text || "0");
          if (!(mph > 0.2)) throw new Error(`Kubota did not move forward under W; speed text=${text}`);

          const dataset = await page.locator("canvas.trainerCanvas").evaluate(el => ({...el.dataset}));
          const report = {
            schemaVersion:1,
            status:"PASS",
            exactAsset:{
              bytes:23988388,
              sha256:"726fdcb3511e6d52990da11118be4ca8a8b73c5d5c8f5bde4f934131e3c31b7d"
            },
            inspectionOnly:true,
            movementMph:mph,
            dataset,
            pageErrors,
            failedRequests
          };
          fs.writeFileSync("reports/manager-kubota-live-verification.json", JSON.stringify(report,null,2)+"\n");
          await page.screenshot({ path:"reports/manager-kubota-live.png", fullPage:true });
          await browser.close();

          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join(" | ")}`);
          const critical=failedRequests.filter(x=>/manager-kubota|kphx-full-airport|assets\/.*\.js/i.test(x.url));
          if (critical.length) throw new Error(`Critical request failures: ${JSON.stringify(critical)}`);
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: manager-kubota-live
          path: |
            reports/manager-kubota-live-verification.json
            reports/manager-kubota-live.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/manager-kubota-live-verification.json reports/manager-kubota-live.png
          git commit -m "Verify exact manager Kubota inspection runtime"
          git pull --rebase origin kphx-full-airport-import
          git push origin HEAD:kphx-full-airport-import
