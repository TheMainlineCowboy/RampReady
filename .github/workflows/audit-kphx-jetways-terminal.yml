name: Audit exact KPHX jetways and terminal source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/audit-kphx-jetways-and-terminal-primitives.mjs
      - scripts/discover-kphx-freeware-archive.mjs
      - .github/workflows/audit-kphx-jetways-terminal.yml

permissions:
  contents: write

concurrency:
  group: audit-kphx-jetways-terminal
  cancel-in-progress: true

jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Decode and preserve exact source evidence
        id: audit
        shell: bash
        run: |
          mkdir -p reports
          set +e
          node scripts/audit-kphx-jetways-and-terminal-primitives.mjs reports/kphx-jetway-terminal-audit.json > reports/kphx-jetway-terminal-audit.log 2>&1
          audit_exit=$?
          node scripts/discover-kphx-freeware-archive.mjs reports/kphx-freeware-download-discovery.json > reports/kphx-freeware-download-discovery.log 2>&1
          discovery_exit=$?
          set -e

          AUDIT_EXIT="$audit_exit" DISCOVERY_EXIT="$discovery_exit" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const exitCode = Number(process.env.AUDIT_EXIT ?? 1);
          const discoveryExitCode = Number(process.env.DISCOVERY_EXIT ?? 1);
          let valid = false;
          let summary = null;
          let validationError = null;
          try {
            const report = JSON.parse(fs.readFileSync("reports/kphx-jetway-terminal-audit.json", "utf8"));
            if (!(report.jetways?.recordCount > 0)) throw new Error("No KPHX jetway records were decoded");
            if (!(report.terminal?.primitiveCount > 0)) throw new Error("No Terminal 4 primitives were decoded");
            if (!Array.isArray(report.terminal?.fallbackPrimitives)) throw new Error("Terminal fallback primitive evidence is missing");
            summary = {
              jetwayRecords: report.jetways.recordCount,
              embeddedLibraryObjects: report.jetways.embeddedLibraryObjectCount,
              modelGuidCounts: report.jetways.modelGuidCounts,
              terminalPrimitives: report.terminal.primitiveCount,
              fallbackPrimitives: report.terminal.fallbackPrimitiveCount,
            };
            valid = exitCode === 0;
          } catch (error) {
            validationError = error instanceof Error ? error.message : String(error);
          }
          let discoverySummary = null;
          if (fs.existsSync("reports/kphx-freeware-download-discovery.json")) {
            const discovery = JSON.parse(fs.readFileSync("reports/kphx-freeware-download-discovery.json", "utf8"));
            discoverySummary = {
              forms: discovery.forms?.length ?? 0,
              candidateUrls: discovery.candidateUrls?.length ?? 0,
              scriptsWithEvidence: discovery.scriptEvidence?.length ?? 0,
              exactFilesConfirmed: discovery.exactFilesConfirmedByPublishedInventory?.length ?? 0,
            };
          }
          const status = {
            schemaVersion: 2,
            sourceSha: process.env.GITHUB_SHA,
            generatedAtUtc: new Date().toISOString(),
            conclusion: valid ? "success" : "failure",
            exitCode,
            validationError,
            summary,
            freewareDiscovery: {
              exitCode: discoveryExitCode,
              conclusion: discoveryExitCode === 0 ? "success" : "failure",
              summary: discoverySummary,
            },
          };
          fs.writeFileSync("reports/kphx-jetway-terminal-audit-status.json", `${JSON.stringify(status, null, 2)}\n`);
          console.log(JSON.stringify(status, null, 2));
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/kphx-jetway-terminal-audit.log reports/kphx-jetway-terminal-audit-status.json
          git add -f reports/kphx-freeware-download-discovery.log
          for file in reports/kphx-jetway-terminal-audit.json reports/kphx-freeware-download-discovery.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Record exact KPHX source recovery evidence [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Audit evidence is unchanged."
          fi

          if [ "$audit_exit" -ne 0 ]; then
            echo "KPHX source audit failed with exit code $audit_exit"
            exit "$audit_exit"
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync("reports/kphx-jetway-terminal-audit-status.json", "utf8"));
          if (status.conclusion !== "success") throw new Error(status.validationError || "KPHX source audit validation failed");
          NODE
