name: Trace materialized exact jetway render

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/trace-materialized-jetway-render.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  trace-materialized-render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Wait for latest materialize-build-render run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'RampReady-exact-jetway-render-trace',
          };
          const workflow = 'materialize-exact-jetway-runtime.yml';
          const base = `https://api.github.com/repos/${process.env.REPOSITORY}`;
          const getJson = async (url) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status} ${await response.text()}`);
            return response.json();
          };
          const runs = await getJson(`${base}/actions/workflows/${workflow}/runs?branch=fix%2Fexact-airport-jetway-glb&per_page=10`);
          const run = runs.workflow_runs?.find((candidate) => candidate.event === 'push') || runs.workflow_runs?.[0];
          if (!run) throw new Error('No exact Airport Jetway materialization run was found');
          console.log(`MATERIALIZE_RUN_FOUND id=${run.id} status=${run.status} conclusion=${run.conclusion || 'pending'} sha=${run.head_sha}`);
          const deadline = Date.now() + 42 * 60 * 1000;
          let current = run;
          while (current.status !== 'completed') {
            if (Date.now() >= deadline) throw new Error(`Materialization run ${current.id} did not complete before the trace deadline`);
            await new Promise((resolve) => setTimeout(resolve, 10_000));
            current = await getJson(`${base}/actions/runs/${current.id}`);
            console.log(`MATERIALIZE_RUN_WAIT id=${current.id} status=${current.status} conclusion=${current.conclusion || 'pending'}`);
          }
          const jobs = await getJson(`${base}/actions/runs/${current.id}/jobs?per_page=100`);
          const summary = {
            id: current.id,
            name: current.name,
            status: current.status,
            conclusion: current.conclusion,
            head_sha: current.head_sha,
            html_url: current.html_url,
            jobs: (jobs.jobs || []).map((job) => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              steps: (job.steps || []).map((step) => ({ name: step.name, conclusion: step.conclusion })),
            })),
          };
          fs.writeFileSync('materialize-run-summary.json', `${JSON.stringify(summary, null, 2)}\n`);
          console.log(`MATERIALIZE_RUN_COMPLETE ${JSON.stringify(summary)}`);
          if (current.conclusion !== 'success') process.exitCode = 1;
          NODE

      - name: Upload trace summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materialized-exact-jetway-render-trace-${{ github.sha }}
          path: materialize-run-summary.json
          if-no-files-found: warn
          retention-days: 3
