name: Materialize Jetway Visual V6

on:
  push:
    branches: [work/simulator-quality-inspection-pass]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampready-materialize-jetway-visual-v6
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/simulator-quality-inspection-pass
          fetch-depth: 0
      - name: Apply jetway visual v6
        run: node scripts/prepare-terminal4-jetway-visual-v6.mjs
      - name: Verify exact generated scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev '^(src/environment/sourcePlacedTerminal4Jetways\.js|src/environment/animatedA1Jetway\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected visual-v6 files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          test -n "$changed"
          node --check src/environment/sourcePlacedTerminal4Jetways.js
          node --check src/environment/animatedA1Jetway.js
          grep -q 'exactJetwayAtlasRegions' src/environment/sourcePlacedTerminal4Jetways.js
          grep -q 'const facadeRampOffset = 0.95' src/environment/sourcePlacedTerminal4Jetways.js
          ! grep -q 'map.repeat.set(repeatX, repeatY)' src/environment/sourcePlacedTerminal4Jetways.js
      - name: Commit visual v6 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/environment/sourcePlacedTerminal4Jetways.js src/environment/animatedA1Jetway.js
          git commit -m "Materialize non-striped jetways and facade closures"
          git push origin HEAD:work/simulator-quality-inspection-pass
