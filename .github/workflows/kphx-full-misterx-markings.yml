name: KPHX Full Exact MisterX Markings

on:
  push:
    branches:
      - kphx-full-markings-stage
    paths:
      - ".github/workflows/kphx-full-misterx-markings.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kphx-full-misterx-markings
  cancel-in-progress: true

jobs:
  markings:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kphx-full-markings-stage
          fetch-depth: 0

      - name: Install exact conversion tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/magick" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "identify" ]; then
            shift
            exec identify "$@"
          fi
          exec convert "$@"
          SH
          chmod +x "$HOME/bin/magick"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build exact full-airport MisterX marking selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const src=JSON.parse(fs.readFileSync("public/models/kphx-full-airport/surfaces/surface-network.json","utf8"));
          const keep=(x)=>x.resourcePrefix==="MisterX_Library" && (
            String(x.resource||"").includes("/Airport/Taxilines/")
            || String(x.resource||"").includes("/markings/")
          );
          const out={
            ...src,
            scope:{
              authority:"KPHX 1.75.1 full surface-network WED extraction",
              resourceScope:"MisterX exact marking/taxiline resources only",
            },
            polygons:(src.polygons||[]).filter(keep),
            drapedOrthophotos:(src.drapedOrthophotos||[]).filter(keep),
            lines:(src.lines||[]).filter(keep),
            facades:[],strings:[],forests:[],roads:[],signs:[],lightFixtures:[],runways:[],taxiways:[],
          };
          const records=[...out.polygons,...out.drapedOrthophotos,...out.lines];
          const resources=[...new Set(records.map((x)=>x.resource))].sort();
          if(out.polygons.length!==1||out.drapedOrthophotos.length!==0||out.lines.length!==65){
            throw new Error(`MisterX marking WED counts changed: polygons=${out.polygons.length} orthos=${out.drapedOrthophotos.length} lines=${out.lines.length}`);
          }
          if(records.length!==66||resources.length!==10){
            throw new Error(`MisterX marking authority changed: placements=${records.length} resources=${resources.length}`);
          }
          fs.writeFileSync("reports/kphx-full-misterx-marking-network.json",JSON.stringify(out,null,2)+"\n");
          fs.writeFileSync("reports/kphx-full-misterx-marking-resources.json",JSON.stringify({
            authority:"public/models/kphx-full-airport/surfaces/surface-network.json",
            dependency:"MisterX_Library_2.0c checked-in exact source",
            placements:66,
            resources,
          },null,2)+"\n");
          console.log(JSON.stringify({polygons:1,orthos:0,lines:65,placements:66,resources:10},null,2));
          NODE

      - name: Materialize exact MisterX marking resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .runtime-misterx-markings
          node scripts/materialize-kphx-surface-resources.mjs             assets/kphx-source/dependencies/MisterX_Library_2.0c             .runtime-misterx-markings             --placement-report=reports/kphx-full-misterx-marking-network.json             --include-external-prefixes=MisterX_Library             --skip-package-owned=true             --concurrency=3

      - name: Verify and commit exact MisterX marking checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const m=JSON.parse(fs.readFileSync(".runtime-misterx-markings/manifest.json","utf8"));
          const n=JSON.parse(fs.readFileSync(".runtime-misterx-markings/surface-network.json","utf8"));
          const counts={
            polygons:(n.polygons||[]).length,
            orthos:(n.drapedOrthophotos||[]).length,
            lines:(n.lines||[]).length,
          };
          if(m.failures?.length) throw new Error(`MisterX marking failures=${m.failures.length}`);
          if(m.resolvedExternalResourceCount!==10) throw new Error(`Expected 10 MisterX marking resources, got ${m.resolvedExternalResourceCount}`);
          if(counts.polygons!==1||counts.orthos!==0||counts.lines!==65){
            throw new Error(`MisterX marking placement mismatch ${JSON.stringify(counts)}`);
          }
          console.log(JSON.stringify({resources:10,...counts,status:"PASS"},null,2));
          NODE

          rm -rf public/models/kphx-full-airport/full-misterx-markings
          mkdir -p public/models/kphx-full-airport/full-misterx-markings
          cp -a .runtime-misterx-markings/. public/models/kphx-full-airport/full-misterx-markings/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             public/models/kphx-full-airport/full-misterx-markings             reports/kphx-full-misterx-marking-network.json             reports/kphx-full-misterx-marking-resources.json
          git commit -m "Materialize full exact KPHX MisterX markings"
          git pull --rebase origin kphx-full-markings-stage
          git push origin HEAD:kphx-full-markings-stage
