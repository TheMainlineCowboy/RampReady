name: Recover Authored Aircraft Git API

on:
  push:
    branches: [fix/authored-aircraft-live]
    paths:
      - .github/workflows/recover-authored-aircraft-git-api.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-git-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COMPRESSED_GIT_BLOB: 800ea25e341f025085eeab59a1d57c56169b700e
      COMPRESSED_SHA256: f4124a1ca343b6aaeb961f6bfcd970d09de3945088b08b06052f333f3ac788ae
      COMPRESSED_BYTES: '939980'
      GLB_SHA256: 01383b502fa9a5e0aca3b5cc4a90b5ffe82d52160778bc309e2de73579b1056b
      GLB_BYTES: '1873128'
    steps:
      - name: Check out active aircraft branch
        uses: actions/checkout@v4
        with:
          ref: fix/authored-aircraft-live
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Recover exact compressed authored-aircraft blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/aircraft public/models
          gh api "repos/${REPO}/git/blobs/${COMPRESSED_GIT_BLOB}" --jq .content \
            | tr -d '\n' \
            | base64 -d > assets/aircraft/crj700-user.glb.br
          test "$(stat -c%s assets/aircraft/crj700-user.glb.br)" = "${COMPRESSED_BYTES}"
          test "$(sha256sum assets/aircraft/crj700-user.glb.br | awk '{print $1}')" = "${COMPRESSED_SHA256}"
          test "$(git hash-object assets/aircraft/crj700-user.glb.br)" = "${COMPRESSED_GIT_BLOB}"

      - name: Materialize exact American Eagle aircraft
        shell: bash
        run: |
          set -euo pipefail
          node scripts/materialize-authored-aircraft.mjs
          test -s public/models/crj700-user.glb
          test "$(stat -c%s public/models/crj700-user.glb)" = "${GLB_BYTES}"
          test "$(sha256sum public/models/crj700-user.glb | awk '{print $1}')" = "${GLB_SHA256}"
          printf glTF | cmp -n 4 - public/models/crj700-user.glb

      - name: Run full repository verification and production build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          npm run build
          test -s dist/models/crj700-user.glb
          test "$(stat -c%s dist/models/crj700-user.glb)" = "${GLB_BYTES}"
          test "$(sha256sum dist/models/crj700-user.glb | awk '{print $1}')" = "${GLB_SHA256}"

      - name: Commit exact aircraft bytes to active integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RampReady aircraft recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/aircraft/crj700-user.glb.br public/models/crj700-user.glb public/models/crj700-user.asset.json
          if git diff --cached --quiet; then
            echo 'Exact authored aircraft is already committed.'
            exit 0
          fi
          git commit -m 'Materialize exact authored American Eagle aircraft'
          git push origin HEAD:fix/authored-aircraft-live
