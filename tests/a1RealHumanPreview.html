<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RampReady · Real Human NPC model quality comparison</title>
<style>
html,body{margin:0;height:100%;background:#172537;color:#f9fbff;font-family:system-ui;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
header{position:absolute;z-index:2;left:12px;top:12px;border-radius:12px;background:#131e2ada;padding:12px 15px;max-width:340px;line-height:1.4;box-shadow:0 8px 25px #0007}
h1{font-size:18px;margin:0 0 4px}p{margin:4px 0;font-size:12px;color:#d9e4ee}
#status{font-size:13px;color:#ffe18c}
button{font:600 14px system-ui;color:#101b28;background:#f5ce5c;border:0;border-radius:9px;padding:9px;margin-top:7px}
</style></head><body>
<header><h1>RampReady · Human NPC quality test</h1><p>Actual textured, skeleton-rigged 3D models. Not an AI picture. Left: animated Sam. Right: hi-vis Drew. Both source models are CC0.</p><p id="status">Loading actual GLBs…</p><button id="toggle">Pause / play</button></header>
<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
const scene=new THREE.Scene();scene.background=new THREE.Color(0x647b8e);
scene.add(new THREE.HemisphereLight(0xffffff,0x34475d,2.3));
const key=new THREE.DirectionalLight(0xfff7ee,3.0);key.position.set(-3,9,8);scene.add(key);
const fill=new THREE.DirectionalLight(0xe0f0ff,1.4);fill.position.set(5,5,-5);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,15),new THREE.MeshStandardMaterial({color:0x586067,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.position.y=-.035;scene.add(ground);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(36,1,.1,200);
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.position.set(0,Math.max(2.5,5.0*h/w),Math.max(6.0,11*h/w));camera.lookAt(0,1,0);camera.updateProjectionMatrix();}addEventListener("resize",resize);resize();
const loader=new GLTFLoader(),mixers=[],roots=[];const status=document.getElementById("status");
const asset=(f)=>new URL("../models/a1-npc-preview/"+f,document.baseURI).href;
async function load(file,x,name){
 const gltf=await loader.loadAsync(asset(file));const model=gltf.scene;
 const raw=new THREE.Box3().setFromObject(model),size=raw.getSize(new THREE.Vector3());
 const height=size.y;const scale=1.75/height;model.scale.setScalar(scale);
 model.position.set(x,-raw.min.y*scale,0);
 model.traverse(node=>{if(node.isMesh){node.castShadow=true;node.receiveShadow=true}});
 scene.add(model);roots.push(model);
 let played=null;
 if(gltf.animations.length){
   const mixer=new THREE.AnimationMixer(model);mixers.push(mixer);
   played=gltf.animations.find(a=>/walk/i.test(a.name))||gltf.animations[0];
   mixer.clipAction(played).play();
 }
 return{name,height,animations:gltf.animations.map(x=>x.name),clip:played?.name,meshes:(()=>{let n=0;model.traverse(o=>{if(o.isMesh)n++});return n})()};
}
let done=[],fail=[];
Promise.all([
 load("sam-locomotion.glb",-1.25,"Sam animated"),
 load("drew-hivis.glb",1.25,"Drew hi-vis")
].map(async p=>{try{return await p;}catch(e){fail.push(String(e));return null;}})).then(results=>{
done=results.filter(Boolean);
const ok=done.length===2 && done[0].animations.length>2;
renderer.domElement.dataset.humanModelStatus=ok?"ready":"error";
renderer.domElement.dataset.humanAnimationCount=String(done[0]?.animations?.length||0);
renderer.domElement.dataset.humanCharactersLoaded=String(done.length);
renderer.domElement.dataset.humanError=fail.join(" | ");
status.textContent=ok?("Loaded 2 genuine GLBs · Sam "+done[0].animations.length+" animations, "+done[0].meshes+" meshes"):"LOAD ISSUE: "+fail.join("; ");
});
let playing=true;document.getElementById("toggle").onclick=()=>{playing=!playing};
let then=performance.now();function draw(now){const dt=Math.min(.05,Math.max(0,(now-then)/1000));then=now;if(playing)for(const m of mixers)m.update(dt);renderer.render(scene,camera);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></body></html>
